const D={"city": "Utrecht", "city_id": 1528871692, "highlights": [{"id": "domtoren", "category": "landmark", "top": 1, "names": {"en": "Dom Tower (Domtoren)", "de": "Domturm (Domtoren)", "nl": "Domtoren", "fr": "Tour de la cathédrale (Domtoren)", "es": "Torre de la catedral (Domtoren)", "it": "Torre del Duomo (Domtoren)"}, "texts": {"en": "Built between 1321 and 1382, the Dom Tower is about 112 metres tall, the tallest church tower in the Netherlands. It has stood apart from its church since a storm brought down the nave in 1674. A restoration of the exterior was completed in 2024, and guided tours climb its 465 steps past bells that are still rung by hand.", "de": "Der zwischen 1321 und 1382 erbaute Domturm ist rund 112 Meter hoch und der höchste Kirchturm der Niederlande. Seit ein Sturm 1674 das Langhaus zum Einsturz brachte, steht er getrennt von seiner Kirche. 2024 wurde die Restaurierung der Außenseite abgeschlossen; Führungen steigen die 465 Stufen hinauf, vorbei an Glocken, die noch von Hand geläutet werden.", "nl": "De Domtoren, gebouwd tussen 1321 en 1382, is ongeveer 112 meter hoog en de hoogste kerktoren van Nederland. Sinds een storm in 1674 het schip van de kerk deed instorten, staat hij los van zijn kerk. In 2024 werd de restauratie van de buitenkant afgerond; rondleidingen gaan de 465 treden op, langs klokken die nog met de hand worden geluid.", "fr": "Construite de 1321 à 1382, la tour de la cathédrale mesure environ 112 mètres : c'est le plus haut clocher des Pays-Bas. Une tempête l'a séparée de son église en abattant la nef en 1674. Sa restauration extérieure s'est achevée en 2024 ; les visites guidées gravissent 465 marches, près de cloches encore sonnées à la main.", "es": "Construida entre 1321 y 1382, la torre de la catedral mide unos 112 metros: es el campanario más alto de los Países Bajos. Una tormenta la separó de su iglesia al derribar la nave en 1674. Su restauración exterior terminó en 2024; las visitas guiadas suben 465 escalones junto a campanas aún tocadas a mano.", "it": "Costruita tra il 1321 e il 1382, la Torre del Duomo è alta circa 112 metri: è il campanile più alto dei Paesi Bassi. Una tempesta la separò dalla chiesa facendo crollare la navata nel 1674. Il restauro esterno si è concluso nel 2024; le visite guidate salgono 465 gradini, accanto a campane ancora suonate a mano."}, "status": null, "lat": 52.09065, "lon": 5.1214, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Dom_Tower_of_Utrecht", "nl": "https://nl.wikipedia.org/wiki/Domtoren_%28Utrecht%29"}, "image": {"file": "DomTorenUtrechtNederland.jpg", "local": "/travel/map-assets/1528871692/domtoren.jpg", "author": "Massimo Catarinella", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:DomTorenUtrechtNederland.jpg"}, "mini": "/travel/map-assets/1528871692/mini/domtoren.jpg", "mini_source": {"file": "DomTorenUtrechtNederland.jpg", "author": "Massimo Catarinella", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:DomTorenUtrechtNederland.jpg"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "domkerk", "category": "landmark", "top": 3, "names": {"en": "Dom Church (Domkerk)", "de": "Domkirche (Domkerk)", "nl": "Domkerk", "fr": "Cathédrale Saint-Martin (Domkerk)", "es": "Catedral de San Martín (Domkerk)", "it": "Cattedrale di San Martino (Domkerk)"}, "texts": {"en": "The Domkerk is what remains of Utrecht's medieval St Martin's Cathedral: the Gothic choir and transept, begun in 1254. Its nave collapsed in the storm of 1 August 1674 and was never rebuilt. The church has been Protestant since 1580, and on its south side lie the cloister and its garden, the Pandhof.", "de": "Die Domkerk ist der Rest der mittelalterlichen Kathedrale St. Martin in Utrecht: der gotische Chor und das Querschiff, begonnen 1254. Das Langhaus stürzte beim Sturm am 1. August 1674 ein und wurde nie wieder aufgebaut. Seit 1580 ist die Kirche protestantisch; an ihrer Südseite liegen der Kreuzgang und sein Garten, der Pandhof.", "nl": "De Domkerk is wat er over is van de middeleeuwse Sint-Maartenskathedraal van Utrecht: het gotische koor en transept, begonnen in 1254. Het schip stortte in tijdens de storm van 1 augustus 1674 en werd nooit herbouwd. Sinds 1580 is de kerk protestants; aan de zuidkant liggen de kloostergang en de kloostertuin, de Pandhof.", "fr": "La Domkerk est ce qui reste de la cathédrale médiévale Saint-Martin d'Utrecht : le chœur et le transept gothiques, commencés en 1254. La nef s'est effondrée lors de la tempête du 1er août 1674 et n'a jamais été reconstruite. L'église est protestante depuis 1580 ; au sud se trouvent le cloître et son jardin, le Pandhof.", "es": "La Domkerk es lo que queda de la catedral medieval de San Martín de Utrecht: el coro y el crucero góticos, iniciados en 1254. Su nave se derrumbó en la tormenta del 1 de agosto de 1674 y nunca se reconstruyó. La iglesia es protestante desde 1580; en su lado sur están el claustro y su jardín, el Pandhof.", "it": "La Domkerk è ciò che resta della cattedrale medievale di San Martino a Utrecht: il coro e il transetto gotici, iniziati nel 1254. La navata crollò nella tempesta del 1° agosto 1674 e non fu mai ricostruita. La chiesa è protestante dal 1580; sul lato sud si trovano il chiostro e il suo giardino, il Pandhof."}, "status": null, "lat": 52.09092, "lon": 5.122233, "wikipedia": {"en": "https://en.wikipedia.org/wiki/St._Martin%27s_Cathedral%2C_Utrecht", "de": "https://de.wikipedia.org/wiki/Utrechter_Dom", "nl": "https://nl.wikipedia.org/wiki/Dom_van_Utrecht", "fr": "https://fr.wikipedia.org/wiki/Cath%C3%A9drale_Saint-Martin_d%27Utrecht", "es": "https://es.wikipedia.org/wiki/Catedral_de_San_Mart%C3%ADn_%28Utrecht%29", "it": "https://it.wikipedia.org/wiki/Duomo_di_Utrecht"}, "image": {"file": "DomTorenUtrechtNederland.jpg", "local": "/travel/map-assets/1528871692/domkerk.jpg", "author": "Massimo Catarinella", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:DomTorenUtrechtNederland.jpg"}, "mini": "/travel/map-assets/1528871692/mini/domkerk.jpg", "mini_source": {"file": "Zuid transept-top - Utrecht - 20232156 - RCE.jpg", "author": "G.Th. Delemarre", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Zuid_transept-top_-_Utrecht_-_20232156_-_RCE.jpg"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "pandhof", "category": "nature", "top": null, "names": {"en": "Dom cloister garden (Pandhof)", "de": "Kreuzganggarten des Doms (Pandhof)", "nl": "Pandhof van de Dom", "fr": "Jardin du cloître du Dom (Pandhof)", "es": "Jardín del claustro del Dom (Pandhof)", "it": "Giardino del chiostro del Duomo (Pandhof)"}, "texts": {"en": "The Pandhof is the garden enclosed by the Dom Church's cloister, on the south side of the choir. The cloister was built in two phases in the 14th and 15th centuries and restored in 1876–1896. In 1730 it was one of the meeting places named in the sodomy trials. Today it is a quiet garden beside the church.", "de": "Der Pandhof ist der vom Kreuzgang des Doms umschlossene Garten an der Südseite des Chors. Der Kreuzgang entstand in zwei Phasen im 14. und 15. Jahrhundert und wurde 1876–1896 restauriert. 1730 wurde er in den Sodomieprozessen als einer der Treffpunkte genannt. Heute ist er ein ruhiger Garten neben der Kirche.", "nl": "De Pandhof is de tuin binnen de kruisgang van de Domkerk, aan de zuidkant van het koor. De kruisgang werd in twee fasen gebouwd in de 14e en 15e eeuw en in 1876–1896 gerestaureerd. In 1730 werd hij in de sodomieprocessen genoemd als een van de ontmoetingsplaatsen. Nu is het een rustige tuin naast de kerk.", "fr": "Le Pandhof est le jardin enclos par le cloître du Dom, au sud du chœur. Le cloître fut bâti en deux étapes aux XIVe et XVe siècles et restauré en 1876–1896. En 1730, il figurait parmi les lieux de rencontre cités dans les procès pour sodomie. C'est aujourd'hui un jardin paisible à côté de l'église.", "es": "El Pandhof es el jardín rodeado por el claustro del Dom, al sur del coro. El claustro se construyó en dos fases en los siglos XIV y XV y se restauró en 1876–1896. En 1730 fue uno de los lugares de encuentro citados en los juicios por sodomía. Hoy es un jardín tranquilo junto a la iglesia.", "it": "Il Pandhof è il giardino racchiuso dal chiostro del Duomo, sul lato sud del coro. Il chiostro fu costruito in due fasi nel XIV e XV secolo e restaurato nel 1876–1896. Nel 1730 fu tra i luoghi d'incontro citati nei processi per sodomia. Oggi è un giardino tranquillo accanto alla chiesa."}, "status": null, "lat": 52.090556, "lon": 5.122611, "wikipedia": {}, "image": {"file": "Kloostergang Domkerk.JPG", "local": "/travel/map-assets/1528871692/pandhof.jpg", "author": "Mioblo", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Kloostergang_Domkerk.JPG"}, "mini": "/travel/map-assets/1528871692/mini/pandhof.jpg", "mini_source": {"file": "Kloostergang Domkerk.JPG", "author": "Mioblo", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Kloostergang_Domkerk.JPG"}, "episode": {"en": true}}, {"id": "domplein", "category": "history", "top": 4, "names": {"en": "Dom Square (Domplein)", "de": "Domplatz (Domplein)", "nl": "Domplein", "fr": "Place de la cathédrale (Domplein)", "es": "Plaza de la catedral (Domplein)", "it": "Piazza del Duomo (Domplein)"}, "texts": {"en": "Dom Square is the space left by the cathedral nave that fell in the storm of 1674. The walled-off ruin stood until the city bought it in 1826 and had it demolished. Coloured paving stones mark the outline of the lost nave, and guided DOMunder tours lead down to remains of the Roman fort Traiectum.", "de": "Der Domplatz ist die Fläche, die das im Sturm von 1674 eingestürzte Langhaus der Kathedrale hinterließ. Die ummauerte Ruine stand, bis die Stadt sie 1826 kaufte und abreißen ließ. Farbige Pflastersteine zeigen den Grundriss des verlorenen Schiffs, und DOMunder-Führungen führen hinab zu Resten des römischen Kastells Traiectum.", "nl": "Het Domplein is de ruimte die het in de storm van 1674 ingestorte schip van de kathedraal achterliet. De ommuurde ruïne bleef staan tot de stad haar in 1826 kocht en liet slopen. Gekleurde stenen in de bestrating tonen de omtrek van het verdwenen schip, en rondleidingen van DOMunder gaan naar resten van het Romeinse fort Traiectum.", "fr": "La place de la cathédrale occupe l'espace de la nef effondrée lors de la tempête de 1674. La ruine, close par un mur, resta debout jusqu'à son achat par la ville en 1826, suivi de sa démolition. Des pavés colorés dessinent le contour de la nef, et les visites guidées DOMunder mènent aux vestiges du fort romain de Traiectum.", "es": "La plaza de la catedral ocupa el espacio de la nave derrumbada en la tormenta de 1674. La ruina, cerrada por un muro, siguió en pie hasta que la ciudad la compró en 1826 y la demolió. Adoquines de colores marcan el contorno de la nave, y las visitas guiadas de DOMunder bajan a restos del fuerte romano de Traiectum.", "it": "Piazza del Duomo occupa lo spazio della navata crollata nella tempesta del 1674. La rovina, chiusa da un muro, rimase in piedi finché la città la acquistò nel 1826 e la fece demolire. Pietre colorate nel selciato segnano il contorno della navata, e le visite guidate di DOMunder scendono ai resti del forte romano di Traiectum."}, "status": null, "lat": 52.09028, "lon": 5.12167, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Domplein"}, "image": {"file": "Utrecht Dom church.JPG", "local": "/travel/map-assets/1528871692/domplein.jpg", "author": "unknown", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Dom_church.JPG"}, "mini": "/travel/map-assets/1528871692/mini/domplein.jpg", "mini_source": {"file": "Utrecht Dom church.JPG", "author": "unknown", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Dom_church.JPG"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "domunder", "category": "museum", "top": null, "names": {"en": "DOMunder (beneath Dom Square)", "de": "DOMunder (unter dem Domplein)", "nl": "DOMunder", "fr": "DOMunder (sous la place du Dom)", "es": "DOMunder (bajo la plaza del Dom)", "it": "DOMunder (sotto il Domplein)"}, "texts": {"en": "DOMunder is an archaeological site beneath Dom Square, visited with a guide and a smart torch. Below ground you see remains of the Roman fort Traiectum, part of the Lower Germanic Limes World Heritage Site since 2021, and foundations of the cathedral nave that collapsed in 1674. Tours start at the tourist office, Domplein 9.", "de": "DOMunder ist eine archäologische Stätte unter dem Domplein, die man mit Führer und einer smarten Taschenlampe besucht. Unter der Erde sieht man Reste des Römerkastells Traiectum, seit 2021 Teil des Welterbes Niedergermanischer Limes, und Fundamente des 1674 eingestürzten Kirchenschiffs. Die Touren beginnen im Touristenbüro am Domplein 9.", "nl": "DOMunder is een archeologische vindplaats onder het Domplein, die je met een gids en een slimme zaklamp bezoekt. Onder de grond zie je resten van het Romeinse fort Traiectum, sinds 2021 onderdeel van het werelderfgoed Neder-Germaanse Limes, en funderingen van het in 1674 ingestorte schip van de Dom. De tochten beginnen bij de VVV op Domplein 9.", "fr": "DOMunder est un site archéologique sous la place du Dom, qui se visite avec un guide et une lampe torche interactive. Sous terre, on voit des vestiges du fort romain Traiectum, inscrit depuis 2021 au patrimoine mondial avec le limes de Germanie inférieure, et les fondations de la nef effondrée en 1674. Les visites partent de l'office de tourisme, Domplein 9.", "es": "DOMunder es un yacimiento arqueológico bajo la plaza del Dom que se visita con guía y una linterna inteligente. Bajo tierra se ven restos del fuerte romano Traiectum, parte desde 2021 del Patrimonio Mundial del Limes de Germania Inferior, y cimientos de la nave que se derrumbó en 1674. Las visitas salen de la oficina de turismo, Domplein 9.", "it": "DOMunder è un sito archeologico sotto il Domplein, visitabile con una guida e una torcia interattiva. Sottoterra si vedono resti del forte romano Traiectum, dal 2021 parte del Patrimonio mondiale del Limes della Germania inferiore, e le fondamenta della navata crollata nel 1674. Le visite partono dall'ufficio turistico in Domplein 9."}, "status": null, "lat": 52.09073, "lon": 5.12176, "wikipedia": null, "image": null, "mini": "/travel/map-assets/1528871692/mini/domunder.jpg", "mini_source": {"file": "Interieur, resten van vroeg middeleeuwse muur, onder Domplein van Romeins Castellum--Categorie - C1 - Utrecht - 20528902 - RCE.jpg", "author": "Chris Booms", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Interieur,_resten_van_vroeg_middeleeuwse_muur,_onder_Domplein_van_Romeins_Castellum--Categorie_-_C1_-_Utrecht_-_20528902_-_RCE.jpg"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "paleis-lofen", "category": "history", "top": null, "names": {"en": "Lofen Palace (Paleis Lofen)", "de": "Pfalz Lofen (Paleis Lofen)", "nl": "Paleis Lofen", "fr": "Palais Lofen (Paleis Lofen)", "es": "Palacio Lofen (Paleis Lofen)", "it": "Palazzo Lofen (Paleis Lofen)"}, "texts": {"en": "Lofen was the palace of the German emperors in Utrecht, built around 1020. Here Emperor Henry V granted Utrecht its city rights on 2 June 1122. The palace probably burned down in 1253, but columns and vaults survive in cellars between Domplein and Vismarkt, shown on guided tours since 2022.", "de": "Lofen war die Pfalz der deutschen Kaiser in Utrecht, erbaut um 1020. Hier verlieh Kaiser Heinrich V. Utrecht am 2. Juni 1122 die Stadtrechte. Die Pfalz brannte vermutlich 1253 ab, doch Säulen und Gewölbe sind in Kellern zwischen Domplein und Vismarkt erhalten; seit 2022 sind sie bei Führungen zu sehen.", "nl": "Lofen was de palts van de Duitse keizers in Utrecht, gebouwd rond 1020. Hier verleende keizer Hendrik V op 2 juni 1122 stadsrechten aan Utrecht. Het paleis brandde waarschijnlijk in 1253 af, maar zuilen en gewelven zijn bewaard in kelders tussen Domplein en Vismarkt, sinds 2022 te zien met een rondleiding.", "fr": "Lofen était le palais des empereurs germaniques à Utrecht, construit vers 1020. C'est là que l'empereur Henri V accorda à Utrecht ses droits de cité le 2 juin 1122. Le palais brûla probablement en 1253, mais des colonnes et des voûtes subsistent dans des caves entre le Domplein et le Vismarkt, visibles en visite guidée depuis 2022.", "es": "Lofen fue el palacio de los emperadores germánicos en Utrecht, construido hacia 1020. Allí el emperador Enrique V concedió a Utrecht sus derechos de ciudad el 2 de junio de 1122. Probablemente ardió en 1253, pero se conservan columnas y bóvedas en sótanos entre el Domplein y el Vismarkt, visitables con guía desde 2022.", "it": "Lofen era il palazzo degli imperatori germanici a Utrecht, costruito intorno al 1020. Qui l'imperatore Enrico V concesse a Utrecht i diritti di città il 2 giugno 1122. Il palazzo bruciò probabilmente nel 1253, ma colonne e volte sopravvivono nelle cantine tra il Domplein e il Vismarkt, visitabili con guida dal 2022."}, "status": null, "lat": 52.090556, "lon": 5.120556, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Lofen"}, "image": {"file": "Vismarkt 18.JPG", "local": "/travel/map-assets/1528871692/paleis-lofen.jpg", "author": "Sargas", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Vismarkt_18.JPG"}, "mini": "/travel/map-assets/1528871692/mini/paleis-lofen.jpg", "mini_source": {"file": "Voormalig paleis - Utrecht - 20212505 - RCE.jpg", "author": "G.Th. Delemarre", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Voormalig_paleis_-_Utrecht_-_20212505_-_RCE.jpg"}, "episode": {"de": true, "fr": true, "es": true}}, {"id": "academiegebouw", "category": "landmark", "top": null, "names": {"en": "University Hall (Academiegebouw)", "de": "Akademiegebäude (Academiegebouw)", "nl": "Academiegebouw", "fr": "Bâtiment de l'Académie (Academiegebouw)", "es": "Edificio de la Academia (Academiegebouw)", "it": "Palazzo dell'Accademia (Academiegebouw)"}, "texts": {"en": "The Academiegebouw on Dom Square is the main building of Utrecht University, founded in 1636. Its neo-Renaissance building was begun in 1891, but its Aula is the Dom's medieval chapter house, where the Union of Utrecht was signed on 23 January 1579, the basis of the Dutch Republic. In front stands a statue of Count Jan van Nassau, who initiated the Union.", "de": "Das Academiegebouw am Domplein ist das Hauptgebäude der 1636 gegründeten Universität Utrecht. Der Neorenaissancebau wurde 1891 begonnen, doch seine Aula ist der mittelalterliche Kapitelsaal des Doms, in dem am 23. Januar 1579 die Utrechter Union unterzeichnet wurde, die Grundlage der Niederländischen Republik. Davor steht eine Statue des Grafen Johann von Nassau, des Initiators der Union.", "nl": "Het Academiegebouw aan het Domplein is het hoofdgebouw van de Universiteit Utrecht, opgericht in 1636. Het neorenaissancegebouw werd vanaf 1891 gebouwd, maar de aula is de middeleeuwse kapittelzaal van de Dom, waar op 23 januari 1579 de Unie van Utrecht werd gesloten, de basis van de Republiek. Ervoor staat een standbeeld van graaf Jan van Nassau, initiatiefnemer van de Unie.", "fr": "L'Academiegebouw, sur la place du Dom, est le bâtiment principal de l'université d'Utrecht, fondée en 1636. L'édifice néo-Renaissance fut commencé en 1891, mais son aula est l'ancienne salle capitulaire médiévale du Dom, où l'Union d'Utrecht fut signée le 23 janvier 1579, base de la République des Provinces-Unies. Devant se dresse la statue du comte Jean de Nassau, initiateur de l'Union.", "es": "El Academiegebouw, en la plaza del Dom, es el edificio principal de la Universidad de Utrecht, fundada en 1636. El edificio neorrenacentista se empezó en 1891, pero su aula es la sala capitular medieval del Dom, donde se firmó la Unión de Utrecht el 23 de enero de 1579, base de la República neerlandesa. Delante se alza la estatua del conde Juan de Nassau, impulsor de la Unión.", "it": "L'Academiegebouw, sul Domplein, è l'edificio principale dell'Università di Utrecht, fondata nel 1636. L'edificio neorinascimentale fu iniziato nel 1891, ma la sua aula è l'antica sala capitolare medievale del Duomo, dove il 23 gennaio 1579 fu firmata l'Unione di Utrecht, base della Repubblica olandese. Davanti si trova la statua del conte Giovanni di Nassau, promotore dell'Unione."}, "status": {"en": "University building used for ceremonies: the interior is generally not open to visitors; closed for renovation from January 2027.", "de": "Universitätsgebäude für Zeremonien: Das Innere ist in der Regel nicht für Besucher geöffnet; ab Januar 2027 wegen Renovierung geschlossen.", "nl": "Universiteitsgebouw voor plechtigheden: het interieur is meestal niet open voor bezoekers; vanaf januari 2027 gesloten voor renovatie.", "fr": "Bâtiment universitaire réservé aux cérémonies : l'intérieur n'est généralement pas ouvert au public ; fermé pour rénovation à partir de janvier 2027.", "es": "Edificio universitario para ceremonias: el interior no suele estar abierto al público; cerrado por renovación a partir de enero de 2027.", "it": "Edificio universitario per le cerimonie: l'interno di norma non è aperto al pubblico; chiuso per ristrutturazione da gennaio 2027."}, "lat": 52.09, "lon": 5.12222, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Academiegebouw_%28Utrecht%29"}, "image": {"file": "514264Academiegebouw.JPG", "local": "/travel/map-assets/1528871692/academiegebouw.jpg", "author": "Edoderoo", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:514264Academiegebouw.JPG"}, "mini": "/travel/map-assets/1528871692/mini/academiegebouw.jpg", "mini_source": {"file": "514264Academiegebouw.JPG", "author": "Edoderoo", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:514264Academiegebouw.JPG"}, "episode": {}}, {"id": "paushuize", "category": "landmark", "top": null, "names": {"en": "Pope's House (Paushuize)", "de": "Papsthaus (Paushuize)", "nl": "Paushuize", "fr": "Maison du pape (Paushuize)", "es": "Casa del papa (Paushuize)", "it": "Casa del papa (Paushuize)"}, "texts": {"en": "Adriaan Floriszoon Boeyens had this house built from 1517. In 1522 he became Pope Adrian VI, the only Dutch pope, and he died in Rome a year later without ever living here. From 1815 to 1954 it housed the King's Commissioner; today it is an event venue, best seen from Pausdam.", "de": "Adriaan Floriszoon Boeyens ließ dieses Haus ab 1517 bauen. 1522 wurde er als Hadrian VI. Papst, der einzige niederländische Papst, und starb ein Jahr später in Rom, ohne je hier gewohnt zu haben. Von 1815 bis 1954 residierte hier der Kommissar des Königs; heute ist es ein Veranstaltungsort, am besten vom Pausdam aus zu sehen.", "nl": "Adriaan Floriszoon Boeyens liet dit huis vanaf 1517 bouwen. In 1522 werd hij paus Adrianus VI, de enige Nederlandse paus, en een jaar later stierf hij in Rome zonder hier ooit te hebben gewoond. Van 1815 tot 1954 zetelde hier de commissaris van de Koning; nu is het een evenementenlocatie, het mooist te zien vanaf de Pausdam.", "fr": "Adriaan Floriszoon Boeyens fit construire cette maison à partir de 1517. Devenu en 1522 le pape Adrien VI, le seul pape néerlandais, il mourut à Rome un an plus tard sans jamais y habiter. De 1815 à 1954, elle accueillit le commissaire du Roi ; c'est aujourd'hui un lieu d'événements, à voir depuis le Pausdam.", "es": "Adriaan Floriszoon Boeyens mandó construir esta casa a partir de 1517. En 1522 fue elegido papa como Adriano VI, el único papa neerlandés, y murió en Roma un año después sin haber vivido aquí. De 1815 a 1954 fue sede del comisario del Rey; hoy es un espacio para eventos, que se ve mejor desde el Pausdam.", "it": "Adriaan Floriszoon Boeyens fece costruire questa casa dal 1517. Nel 1522 divenne papa Adriano VI, l'unico papa olandese, e morì a Roma un anno dopo senza averci mai abitato. Dal 1815 al 1954 ospitò il commissario del Re; oggi è una sede per eventi, da ammirare dal Pausdam."}, "status": {"en": "Event venue: the interior is generally not open to visitors; view it from outside.", "de": "Veranstaltungsort: Das Innere ist in der Regel nicht für Besucher geöffnet; von außen besichtigen.", "nl": "Evenementenlocatie: het interieur is meestal niet open voor bezoekers; bekijk het van buiten.", "fr": "Lieu d'événements : l'intérieur n'est généralement pas ouvert au public ; à voir de l'extérieur.", "es": "Espacio para eventos: el interior no suele estar abierto al público; se ve desde fuera.", "it": "Sede per eventi: l'interno di norma non è aperto al pubblico; si ammira dall'esterno."}, "lat": 52.090278, "lon": 5.123889, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Paushuize"}, "image": {"file": "Paushuize.Utrecht.jpg", "local": "/travel/map-assets/1528871692/paushuize.jpg", "author": "China Crisis", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Paushuize.Utrecht.jpg"}, "mini": "/travel/map-assets/1528871692/mini/paushuize.jpg", "mini_source": {"file": "Paushuize.Utrecht.jpg", "author": "China Crisis", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Paushuize.Utrecht.jpg"}, "episode": {"en": true, "fr": true}}, {"id": "pieterskerk", "category": "landmark", "top": null, "names": {"en": "St Peter's Church (Pieterskerk)", "de": "Peterskirche (Pieterskerk)", "nl": "Pieterskerk", "fr": "Église Saint-Pierre (Pieterskerk)", "es": "Iglesia de San Pedro (Pieterskerk)", "it": "Chiesa di San Pietro (Pieterskerk)"}, "texts": {"en": "Bishop Bernold consecrated the Pieterskerk on 1 May 1048, making it one of Utrecht's oldest churches. Its Romanesque nave rests on columns each cut from one block of red sandstone, and a crypt lies under the choir. It was the eastern end of the 'church cross' around the Dom and is now used by the Walloon Church.", "de": "Bischof Bernold weihte die Pieterskerk am 1. Mai 1048; sie zählt zu den ältesten Kirchen Utrechts. Das romanische Langhaus ruht auf Säulen aus je einem Block roten Sandsteins, unter dem Chor liegt eine Krypta. Sie bildete das östliche Ende des „Kirchenkreuzes“ um den Dom und wird heute von der Wallonischen Kirche genutzt.", "nl": "Bisschop Bernold wijdde de Pieterskerk in op 1 mei 1048; het is een van de oudste kerken van Utrecht. Het romaanse schip rust op zuilen van telkens één blok rode zandsteen, en onder het koor ligt een crypte. De kerk vormde het oostelijke eind van het kerkenkruis rond de Dom en wordt nu gebruikt door de Waalse Kerk.", "fr": "L'évêque Bernold consacra la Pieterskerk le 1er mai 1048 : c'est l'une des plus anciennes églises d'Utrecht. Sa nef romane repose sur des colonnes taillées chacune dans un bloc de grès rouge, et une crypte s'étend sous le chœur. Extrémité est de la « croix d'églises » autour de la cathédrale, elle sert aujourd'hui à l'Église wallonne.", "es": "El obispo Bernold consagró la Pieterskerk el 1 de mayo de 1048: es una de las iglesias más antiguas de Utrecht. Su nave románica se apoya en columnas de un solo bloque de arenisca roja, y bajo el coro hay una cripta. Cerraba por el este la «cruz de iglesias» de la catedral y hoy la usa la Iglesia valona.", "it": "Il vescovo Bernold consacrò la Pieterskerk il 1° maggio 1048: è una delle chiese più antiche di Utrecht. La navata romanica poggia su colonne ricavate ciascuna da un blocco di arenaria rossa, e sotto il coro c'è una cripta. Era l'estremità orientale della «croce di chiese» intorno al Duomo e oggi è usata dalla Chiesa vallona."}, "status": null, "lat": 52.091389, "lon": 5.124444, "wikipedia": {"en": "https://en.wikipedia.org/wiki/St._Peter%27s_Church%2C_Utrecht", "de": "https://de.wikipedia.org/wiki/Pieterskerk_%28Utrecht%29", "nl": "https://nl.wikipedia.org/wiki/Pieterskerk_%28Utrecht%29"}, "image": {"file": "18297-Pieterskerk.JPG", "local": "/travel/map-assets/1528871692/pieterskerk.jpg", "author": "Michielderoo", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:18297-Pieterskerk.JPG"}, "mini": "/travel/map-assets/1528871692/mini/pieterskerk.jpg", "mini_source": {"file": "18297-Pieterskerk.JPG", "author": "Michielderoo", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:18297-Pieterskerk.JPG"}, "episode": {}}, {"id": "oudegracht", "category": "landmark", "top": 2, "names": {"en": "Old Canal (Oudegracht)", "de": "Alte Gracht (Oudegracht)", "nl": "Oudegracht", "fr": "Vieux canal (Oudegracht)", "es": "Canal viejo (Oudegracht)", "it": "Canale vecchio (Oudegracht)"}, "texts": {"en": "The Oudegracht has two levels: the street above and wharves at water level, with cellars running under the street. From the late 12th century merchants linked their cellars to the wharf; by about 1500 wharf cellars lined both banks, a harbour almost 2 km long. Many now hold cafés with waterside terraces.", "de": "Die Oudegracht hat zwei Ebenen: oben die Straße, unten Werften auf Wasserhöhe mit Kellern unter der Straße. Ab dem späten 12. Jahrhundert verbanden Kaufleute ihre Keller mit der Werft; um 1500 säumten Werftkeller beide Ufer, ein fast 2 km langer Hafen. Heute beherbergen viele Cafés mit Terrassen am Wasser.", "nl": "De Oudegracht heeft twee niveaus: de straat boven en werven op waterhoogte, met kelders die onder de straat doorlopen. Vanaf eind 12e eeuw verbonden kooplieden hun kelders met de werf; rond 1500 lagen er werfkelders langs beide oevers, een haven van bijna 2 km. In veel kelders zitten nu cafés met terrassen aan het water.", "fr": "L'Oudegracht a deux niveaux : la rue et, au ras de l'eau, des quais dont les caves passent sous la chaussée. Dès la fin du XIIe siècle, les marchands relièrent leurs caves au quai ; vers 1500, elles bordaient les deux rives, un port de près de 2 km. Beaucoup abritent des cafés avec terrasse au bord de l'eau.", "es": "El Oudegracht tiene dos niveles: la calle arriba y, a ras del agua, muelles con bodegas bajo la calzada. Desde finales del siglo XII los comerciantes unieron sus sótanos al muelle; hacia 1500 las bodegas bordeaban ambas orillas, un puerto de casi 2 km. Muchas albergan hoy cafés con terraza junto al agua.", "it": "L'Oudegracht ha due livelli: la strada in alto e, a pelo d'acqua, banchine con cantine sotto la carreggiata. Dalla fine del XII secolo i mercanti collegarono le cantine alla banchina; intorno al 1500 le cantine fiancheggiavano entrambe le sponde, un porto di quasi 2 km. Molte ospitano oggi caffè con terrazze sull'acqua."}, "status": null, "lat": 52.09167, "lon": 5.11778, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Oudegracht", "nl": "https://nl.wikipedia.org/wiki/Oudegracht_%28Utrecht%29", "it": "https://it.wikipedia.org/wiki/Oudegracht"}, "image": {"file": "Utrecht Canals Aerial View - July 2006.jpg", "local": "/travel/map-assets/1528871692/oudegracht.jpg", "author": "Diliff", "license": "CC BY 2.5", "license_url": "https://creativecommons.org/licenses/by/2.5", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Canals_Aerial_View_-_July_2006.jpg"}, "mini": "/travel/map-assets/1528871692/mini/oudegracht.jpg", "mini_source": {"file": "2024 - free download photo of old city canal Oudegracht aan de Werf with water reflections of the grey sky and in the background the brick arch bridge Bakkersbrug, Utrecht in high resolution. Street photography by Fons Heijnsbroek.tif", "author": "Fons Heijnsbroek", "license": "CC0", "license_url": "http://creativecommons.org/publicdomain/zero/1.0/deed.en", "source": "https://commons.wikimedia.org/wiki/File:2024_-_free_download_photo_of_old_city_canal_Oudegracht_aan_de_Werf_with_water_reflections_of_the_grey_sky_and_in_the_background_the_brick_arch_bridge_Bakkersbrug,_Utrecht_in_high_resolution._Street_photography_by_Fons_Heijnsbroek.tif"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "stadskasteel-oudaen", "category": "landmark", "top": null, "names": {"en": "Oudaen city castle (Stadskasteel Oudaen)", "de": "Stadtburg Oudaen (Stadskasteel Oudaen)", "nl": "Stadskasteel Oudaen", "fr": "Château urbain Oudaen (Stadskasteel Oudaen)", "es": "Castillo urbano Oudaen (Stadskasteel Oudaen)", "it": "Castello urbano Oudaen (Stadskasteel Oudaen)"}, "texts": {"en": "Oudaen is a fortified medieval town house on the Oudegracht, built shortly after 1276 for the Zoudenbalch family. It is the best preserved of the stone 'city castles' along the canal. During the siege of Vredenburg Castle in 1576–1577 it was badly damaged, and cannonballs are still set in its facades. Today it houses a brewery and restaurant.", "de": "Oudaen ist ein befestigtes mittelalterliches Stadthaus an der Oudegracht, kurz nach 1276 für die Familie Zoudenbalch erbaut. Es ist die am besten erhaltene der steinernen „Stadtburgen“ am Kanal. Bei der Belagerung der Burg Vredenburg 1576–1577 wurde es schwer beschädigt; Kanonenkugeln stecken noch in den Fassaden. Heute beherbergt es eine Brauerei und ein Restaurant.", "nl": "Oudaen is een versterkt middeleeuws huis aan de Oudegracht, kort na 1276 gebouwd voor de familie Zoudenbalch. Het is het best bewaarde van de stenen 'stadskastelen' langs de gracht. Bij het beleg van kasteel Vredenburg in 1576–1577 raakte het zwaar beschadigd; in de gevels zitten nog kanonskogels. Nu zijn er een brouwerij en een restaurant gevestigd.", "fr": "Oudaen est une maison fortifiée médiévale sur l'Oudegracht, bâtie peu après 1276 pour la famille Zoudenbalch. C'est le mieux conservé des « châteaux urbains » en pierre le long du canal. Lors du siège du château de Vredenburg en 1576–1577, il fut gravement endommagé, et des boulets sont encore incrustés dans ses façades. Il abrite aujourd'hui une brasserie et un restaurant.", "es": "Oudaen es una casa medieval fortificada junto al Oudegracht, construida poco después de 1276 para la familia Zoudenbalch. Es el mejor conservado de los «castillos urbanos» de piedra del canal. Durante el asedio del castillo de Vredenburg en 1576–1577 sufrió graves daños, y aún hay balas de cañón incrustadas en sus fachadas. Hoy alberga una cervecería y un restaurante.", "it": "Oudaen è una casa medievale fortificata sull'Oudegracht, costruita poco dopo il 1276 per la famiglia Zoudenbalch. È il meglio conservato dei «castelli urbani» in pietra lungo il canale. Durante l'assedio del castello di Vredenburg nel 1576–1577 fu gravemente danneggiato, e palle di cannone sono ancora incastonate nelle facciate. Oggi ospita un birrificio e un ristorante."}, "status": null, "lat": 52.092778, "lon": 5.116389, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Oudaen_%28Utrecht%29"}, "image": {"file": "Kasteel Oudaen.JPG", "local": "/travel/map-assets/1528871692/stadskasteel-oudaen.jpg", "author": "Sargas", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Kasteel_Oudaen.JPG"}, "mini": "/travel/map-assets/1528871692/mini/stadskasteel-oudaen.jpg", "mini_source": {"file": "Kasteel Oudaen.JPG", "author": "Sargas", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Kasteel_Oudaen.JPG"}, "episode": {"it": true}}, {"id": "stadhuis", "category": "landmark", "top": null, "names": {"en": "City Hall (Stadhuis)", "de": "Rathaus (Stadhuis)", "nl": "Stadhuis", "fr": "Hôtel de ville (Stadhuis)", "es": "Ayuntamiento (Stadhuis)", "it": "Municipio (Stadhuis)"}, "texts": {"en": "Utrecht's city hall stands on the Oudegracht by the Stadhuisbrug, a bridge formed in 1547 by joining two older ones. The neoclassical sandstone front by city architect Johannes van Embden was completed in 1830, replacing medieval houses. Between 1997 and 2000 Enric Miralles renovated the complex and added deconstructivist wings at the back.", "de": "Das Utrechter Rathaus steht an der Oudegracht an der Stadhuisbrug, einer Brücke, die 1547 aus zwei älteren zusammengelegt wurde. Die klassizistische Sandsteinfassade von Stadtarchitekt Johannes van Embden wurde 1830 fertig und ersetzte mittelalterliche Häuser. Von 1997 bis 2000 renovierte Enric Miralles den Komplex und fügte hinten dekonstruktivistische Flügel hinzu.", "nl": "Het stadhuis van Utrecht staat aan de Oudegracht bij de Stadhuisbrug, die in 1547 ontstond door twee oudere bruggen samen te voegen. De neoclassicistische zandstenen gevel van stadsarchitect Johannes van Embden was in 1830 klaar en verving middeleeuwse huizen. Van 1997 tot 2000 renoveerde Enric Miralles het complex en voegde achteraan deconstructivistische delen toe.", "fr": "L'hôtel de ville d'Utrecht se dresse sur l'Oudegracht, près du Stadhuisbrug, un pont formé en 1547 par la réunion de deux ponts plus anciens. La façade néoclassique en grès de l'architecte municipal Johannes van Embden fut achevée en 1830, à la place de maisons médiévales. De 1997 à 2000, Enric Miralles rénova l'ensemble et ajouta à l'arrière des ailes déconstructivistes.", "es": "El ayuntamiento de Utrecht se alza junto al Oudegracht, en el Stadhuisbrug, un puente formado en 1547 al unir dos más antiguos. La fachada neoclásica de arenisca del arquitecto municipal Johannes van Embden se terminó en 1830, en lugar de casas medievales. Entre 1997 y 2000 Enric Miralles renovó el conjunto y añadió en la parte trasera alas deconstructivistas.", "it": "Il municipio di Utrecht sorge sull'Oudegracht presso lo Stadhuisbrug, un ponte nato nel 1547 dall'unione di due ponti più antichi. La facciata neoclassica in arenaria dell'architetto comunale Johannes van Embden fu completata nel 1830, al posto di case medievali. Tra il 1997 e il 2000 Enric Miralles rinnovò il complesso e aggiunse sul retro ali decostruttiviste."}, "status": null, "lat": 52.09177, "lon": 5.11958, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Stadhuis_van_Utrecht"}, "image": {"file": "Stadhuis Utrecht.JPG", "local": "/travel/map-assets/1528871692/stadhuis.jpg", "author": "Pepijntje", "license": "Public domain", "license_url": "", "source": "https://commons.wikimedia.org/wiki/File:Stadhuis_Utrecht.JPG"}, "mini": "/travel/map-assets/1528871692/mini/stadhuis.jpg", "mini_source": {"file": "Stadhuis Utrecht.JPG", "author": "Pepijntje", "license": "Public domain", "license_url": "", "source": "https://commons.wikimedia.org/wiki/File:Stadhuis_Utrecht.JPG"}, "episode": {}}, {"id": "museum-speelklok", "category": "museum", "top": null, "names": {"en": "Museum Speelklok (Buurkerk)", "de": "Museum Speelklok (Buurkerk)", "nl": "Museum Speelklok (Buurkerk)", "fr": "Museum Speelklok (Buurkerk)", "es": "Museum Speelklok (Buurkerk)", "it": "Museum Speelklok (Buurkerk)"}, "texts": {"en": "Museum Speelklok collects self-playing musical instruments, from tiny music boxes and musical clocks to large Dutch street organs. It grew out of an exhibition held in Utrecht in 1956 and has been housed since 1984 in the medieval Buurkerk. Most of the instruments still play for visitors.", "de": "Das Museum Speelklok sammelt selbstspielende Musikinstrumente, von winzigen Spieldosen und Musikuhren bis zu großen niederländischen Drehorgeln. Es ging aus einer Ausstellung in Utrecht im Jahr 1956 hervor und befindet sich seit 1984 in der mittelalterlichen Buurkerk. Die meisten Instrumente spielen noch für die Besucher.", "nl": "Museum Speelklok verzamelt zelfspelende muziekinstrumenten, van piepkleine speeldozen en speelklokken tot grote Nederlandse straatorgels. Het museum groeide uit een tentoonstelling in Utrecht in 1956 en is sinds 1984 gevestigd in de middeleeuwse Buurkerk. De meeste instrumenten spelen nog voor bezoekers.", "fr": "Le Museum Speelklok rassemble des instruments de musique automatiques, des minuscules boîtes à musique et horloges musicales aux grands orgues de rue néerlandais. Né d'une exposition organisée à Utrecht en 1956, il est installé depuis 1984 dans la Buurkerk médiévale. La plupart des instruments jouent encore pour les visiteurs.", "es": "El Museum Speelklok reúne instrumentos musicales automáticos, desde diminutas cajas de música y relojes musicales hasta grandes organillos callejeros neerlandeses. Nació de una exposición celebrada en Utrecht en 1956 y desde 1984 ocupa la Buurkerk, una iglesia medieval. La mayoría de los instrumentos todavía suenan para los visitantes.", "it": "Il Museum Speelklok raccoglie strumenti musicali automatici, dai minuscoli carillon e orologi musicali ai grandi organi di strada olandesi. Nato da una mostra tenuta a Utrecht nel 1956, dal 1984 ha sede nella Buurkerk, una chiesa medievale. La maggior parte degli strumenti suona ancora per i visitatori."}, "status": null, "lat": 52.090292, "lon": 5.118899, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Museum_Speelklok", "de": "https://de.wikipedia.org/wiki/Museum_Speelklok", "nl": "https://nl.wikipedia.org/wiki/Museum_Speelklok", "fr": "https://fr.wikipedia.org/wiki/Museum_Speelklok", "it": "https://it.wikipedia.org/wiki/Museum_Speelklok"}, "image": {"file": "Buurkerk en Dom.jpg", "local": "/travel/map-assets/1528871692/museum-speelklok.jpg", "author": "Victor van Werkhooven", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Buurkerk_en_Dom.jpg"}, "mini": "/travel/map-assets/1528871692/mini/museum-speelklok.jpg", "mini_source": {"file": "Buurkerk Utrecht.JPG", "author": "Pepijntje", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Buurkerk_Utrecht.JPG"}, "episode": {"de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "bibliotheek-neude", "category": "landmark", "top": 10, "names": {"en": "Neude Library, former main post office (Bibliotheek Neude)", "de": "Bibliothek Neude im ehemaligen Hauptpostamt (Bibliotheek Neude)", "nl": "Bibliotheek Neude (voormalig hoofdpostkantoor)", "fr": "Bibliothèque Neude, ancienne poste centrale (Bibliotheek Neude)", "es": "Biblioteca Neude, antigua central de correos (Bibliotheek Neude)", "it": "Biblioteca Neude, ex posta centrale (Bibliotheek Neude)"}, "texts": {"en": "Utrecht's former main post office on the Neude was built in 1919–1924 to a design by J. Crouwel jr. in the Amsterdam School style. Its hall is known for tall parabolic arches and stone figures of the continents. The post office closed in 2011; since 2020 the building has housed Bibliotheek Neude, the city's central library.", "de": "Das ehemalige Hauptpostamt am Neude wurde von 1919 bis 1924 nach einem Entwurf von J. Crouwel jr. im Stil der Amsterdamer Schule gebaut. Bekannt ist die Halle mit ihren hohen Parabelbögen und Steinfiguren, die die Erdteile darstellen. Das Postamt schloss 2011; seit 2020 ist hier die Bibliotheek Neude untergebracht, die Zentralbibliothek der Stadt.", "nl": "Het voormalige hoofdpostkantoor aan de Neude werd tussen 1919 en 1924 gebouwd naar een ontwerp van J. Crouwel jr. in de stijl van de Amsterdamse School. De hal is bekend om de hoge paraboolvormige bogen en de stenen beelden van de werelddelen. Het postkantoor sloot in 2011; sinds 2020 zit hier Bibliotheek Neude, de centrale bibliotheek van de stad.", "fr": "L'ancienne poste centrale d'Utrecht, sur la Neude, fut construite de 1919 à 1924 par J. Crouwel jr., dans le style de l'école d'Amsterdam. Son hall est connu pour ses hauts arcs paraboliques et ses statues des continents. La poste a fermé en 2011 ; depuis 2020, le bâtiment abrite la Bibliotheek Neude, bibliothèque centrale de la ville.", "es": "La antigua central de correos de Utrecht, en la Neude, se construyó entre 1919 y 1924 según un diseño de J. Crouwel jr., al estilo de la Escuela de Ámsterdam. Su vestíbulo destaca por sus altos arcos parabólicos y sus figuras de piedra de los continentes. Correos cerró en 2011; desde 2020 alberga la Bibliotheek Neude, la biblioteca central.", "it": "L'ex posta centrale di Utrecht, sulla Neude, fu costruita tra il 1919 e il 1924 su progetto di J. Crouwel jr., nello stile della Scuola di Amsterdam. La sala è nota per gli alti archi parabolici e le statue in pietra dei continenti. L'ufficio postale chiuse nel 2011; dal 2020 ospita la Bibliotheek Neude, la biblioteca centrale della città."}, "status": null, "lat": 52.093056, "lon": 5.117778, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Utrecht_Post_Office", "de": "https://de.wikipedia.org/wiki/Hauptpostamt_Utrecht", "nl": "https://nl.wikipedia.org/wiki/Hoofdpostkantoor_%28Utrecht%29"}, "image": {"file": "Utrecht MainPostOffice 018 1755.jpg", "local": "/travel/map-assets/1528871692/bibliotheek-neude.jpg", "author": "Ludvig14", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_MainPostOffice_018_1755.jpg"}, "mini": "/travel/map-assets/1528871692/mini/bibliotheek-neude.jpg", "mini_source": {"file": "Utrecht MainPostOffice 018 1755.jpg", "author": "Ludvig14", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_MainPostOffice_018_1755.jpg"}, "episode": {"en": true}}, {"id": "janskerkhof", "category": "market", "top": null, "names": {"en": "Janskerkhof (square by St John's Church)", "de": "Janskerkhof (Platz an der Johanneskirche)", "nl": "Janskerkhof", "fr": "Janskerkhof (place de l'église Saint-Jean)", "es": "Janskerkhof (plaza de la iglesia de San Juan)", "it": "Janskerkhof (piazza della chiesa di San Giovanni)"}, "texts": {"en": "Janskerkhof is the square around the Janskerk, a church founded shortly after 1040 by Bishop Bernold. Once the walled precinct of the chapter of St John, it opened up after the Reformation. In 1730 it was among the meeting places named in the sodomy trials. Every Saturday the square holds a large flower and plant market.", "de": "Der Janskerkhof ist der Platz rund um die Janskerk, eine Kirche, die Bischof Bernold kurz nach 1040 gründete. Einst der ummauerte Bezirk des Kapitels von St. Johannes, wurde er nach der Reformation zugänglich. 1730 gehörte er zu den in den Sodomieprozessen genannten Treffpunkten. Jeden Samstag findet hier ein großer Blumen- und Pflanzenmarkt statt.", "nl": "Het Janskerkhof is het plein rond de Janskerk, kort na 1040 gesticht door bisschop Bernold. Ooit was het de ommuurde immuniteit van het kapittel van Sint-Jan; na de Reformatie werd het toegankelijk. In 1730 hoorde het bij de ontmoetingsplaatsen die in de sodomieprocessen werden genoemd. Elke zaterdag is er een grote bloemen- en plantenmarkt.", "fr": "Le Janskerkhof est la place qui entoure la Janskerk, église fondée peu après 1040 par l'évêque Bernold. Ancien enclos fermé du chapitre de Saint-Jean, il s'est ouvert après la Réforme. En 1730, il figurait parmi les lieux de rencontre cités dans les procès pour sodomie. Chaque samedi s'y tient un grand marché aux fleurs et aux plantes.", "es": "El Janskerkhof es la plaza que rodea la Janskerk, iglesia fundada poco después de 1040 por el obispo Bernold. Antiguo recinto amurallado del cabildo de San Juan, se abrió tras la Reforma. En 1730 fue uno de los lugares de encuentro citados en los juicios por sodomía. Cada sábado acoge un gran mercado de flores y plantas.", "it": "Il Janskerkhof è la piazza attorno alla Janskerk, chiesa fondata poco dopo il 1040 dal vescovo Bernold. Un tempo recinto murato del capitolo di San Giovanni, si aprì dopo la Riforma. Nel 1730 fu tra i luoghi d'incontro citati nei processi per sodomia. Ogni sabato ospita un grande mercato di fiori e piante."}, "status": null, "lat": 52.093611, "lon": 5.121111, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Janskerkhof"}, "image": {"file": "JanskerkUtrecht.jpg", "local": "/travel/map-assets/1528871692/janskerkhof.jpg", "author": "GVR", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:JanskerkUtrecht.jpg"}, "mini": "/travel/map-assets/1528871692/mini/janskerkhof.jpg", "mini_source": {"file": "JanskerkUtrecht.jpg", "author": "GVR", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:JanskerkUtrecht.jpg"}, "episode": {"en": true}}, {"id": "tivolivredenburg", "category": "landmark", "top": null, "names": {"en": "TivoliVredenburg", "de": "TivoliVredenburg", "nl": "TivoliVredenburg", "fr": "TivoliVredenburg", "es": "TivoliVredenburg", "it": "TivoliVredenburg"}, "texts": {"en": "TivoliVredenburg is Utrecht's music centre, opened in 2014 when the pop venue Tivoli and the concert hall Vredenburg merged. Herman Hertzberger and other architects designed it as a 'vertical city', with halls for different genres stacked on top of each other. It stands by Vredenburg square, where Charles V built a castle in 1529–1532.", "de": "TivoliVredenburg ist Utrechts Musikzentrum, eröffnet 2014, als die Popbühne Tivoli und das Konzerthaus Vredenburg fusionierten. Herman Hertzberger und weitere Architekten entwarfen es als „vertikale Stadt“ mit übereinander gestapelten Sälen für verschiedene Musikrichtungen. Es steht am Vredenburgplein, wo Karl V. 1529–1532 eine Burg errichten ließ.", "nl": "TivoliVredenburg is het muziekcentrum van Utrecht, geopend in 2014 na de fusie van poppodium Tivoli en muziekcentrum Vredenburg. Herman Hertzberger en andere architecten ontwierpen het als een 'verticale stad', met zalen voor verschillende genres boven op elkaar. Het staat aan het Vredenburgplein, waar Karel V in 1529–1532 een kasteel liet bouwen.", "fr": "TivoliVredenburg est le centre musical d'Utrecht, ouvert en 2014 après la fusion de la salle pop Tivoli et de la salle de concert Vredenburg. Herman Hertzberger et d'autres architectes l'ont conçu comme une « ville verticale », avec des salles empilées pour différents genres. Il se dresse au bord du Vredenburgplein, où Charles Quint fit bâtir un château en 1529–1532.", "es": "TivoliVredenburg es el centro musical de Utrecht, abierto en 2014 tras la fusión de la sala pop Tivoli y la sala de conciertos Vredenburg. Herman Hertzberger y otros arquitectos lo diseñaron como una «ciudad vertical», con salas para distintos géneros apiladas unas sobre otras. Está junto al Vredenburgplein, donde Carlos V mandó construir un castillo en 1529–1532.", "it": "TivoliVredenburg è il centro musicale di Utrecht, aperto nel 2014 dalla fusione del locale pop Tivoli e della sala concerti Vredenburg. Herman Hertzberger e altri architetti lo hanno concepito come una «città verticale», con sale per generi diversi sovrapposte. Sorge sul Vredenburgplein, dove Carlo V fece costruire un castello nel 1529–1532."}, "status": null, "lat": 52.0922, "lon": 5.11333, "wikipedia": {"en": "https://en.wikipedia.org/wiki/TivoliVredenburg", "nl": "https://nl.wikipedia.org/wiki/TivoliVredenburg"}, "image": {"file": "TivoliVredenburg-2014-08.JPG", "local": "/travel/map-assets/1528871692/tivolivredenburg.jpg", "author": "Michielderoo", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:TivoliVredenburg-2014-08.JPG"}, "mini": "/travel/map-assets/1528871692/mini/tivolivredenburg.jpg", "mini_source": {"file": "TivoliVredenburg-2014-08.JPG", "author": "Michielderoo", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:TivoliVredenburg-2014-08.JPG"}, "episode": {"nl": true, "fr": true}}, {"id": "catharijnesingel", "category": "history", "top": 9, "names": {"en": "Catharijnesingel (city moat)", "de": "Catharijnesingel (Stadtgraben)", "nl": "Catharijnesingel", "fr": "Catharijnesingel (douves de la ville)", "es": "Catharijnesingel (foso de la ciudad)", "it": "Catharijnesingel (fossato della città)"}, "texts": {"en": "The Catharijnesingel is part of the moat dug around Utrecht after it gained city rights in 1122. Around 1970 this stretch was filled in for a road, with the Hoog Catharijne shopping centre built over it. The water returned in stages, and since 2020 boats can again sail all the way around the old centre.", "de": "Die Catharijnesingel ist Teil des Stadtgrabens, der angelegt wurde, nachdem Utrecht 1122 das Stadtrecht erhielt. Um 1970 wurde dieser Abschnitt für eine Straße zugeschüttet und das Einkaufszentrum Hoog Catharijne darüber gebaut. Das Wasser kehrte schrittweise zurück, und seit 2020 können Boote wieder rund um die ganze Altstadt fahren.", "nl": "De Catharijnesingel is een deel van de gracht die rond Utrecht werd gegraven nadat de stad in 1122 stadsrechten kreeg. Rond 1970 werd dit stuk gedempt voor een autoweg, en winkelcentrum Hoog Catharijne werd erboven gebouwd. Het water kwam in fasen terug, en sinds 2020 kunnen boten weer helemaal rond de binnenstad varen.", "fr": "La Catharijnesingel fait partie des douves creusées autour d'Utrecht après l'obtention des droits de cité en 1122. Vers 1970, ce tronçon fut comblé pour une route, et le centre commercial Hoog Catharijne fut construit au-dessus. L'eau est revenue par étapes, et depuis 2020 les bateaux peuvent de nouveau faire le tour complet du centre historique.", "es": "La Catharijnesingel forma parte del foso excavado alrededor de Utrecht tras obtener los derechos de ciudad en 1122. Hacia 1970 este tramo se rellenó para construir una carretera, y encima se levantó el centro comercial Hoog Catharijne. El agua volvió por fases, y desde 2020 los barcos pueden volver a rodear todo el centro histórico.", "it": "La Catharijnesingel fa parte del fossato scavato intorno a Utrecht dopo che la città ottenne i diritti civici nel 1122. Verso il 1970 questo tratto fu interrato per una strada e coperto dal centro commerciale Hoog Catharijne. L'acqua è tornata per fasi, e dal 2020 le barche possono di nuovo girare intorno a tutto il centro storico."}, "status": null, "lat": 52.08489, "lon": 5.11881, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Catharijnesingel", "nl": "https://nl.wikipedia.org/wiki/Catharijnesingel"}, "image": {"file": "Catharijnesingel Utrecht Nederland.JPG", "local": "/travel/map-assets/1528871692/catharijnesingel.jpg", "author": "Antoine", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Catharijnesingel_Utrecht_Nederland.JPG"}, "mini": "/travel/map-assets/1528871692/mini/catharijnesingel.jpg", "mini_source": {"file": "De vernieuwde Catharijnesingel in de stad Utrecht.jpg", "author": "Jan dijkstra", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:De_vernieuwde_Catharijnesingel_in_de_stad_Utrecht.jpg"}, "episode": {"en": true, "nl": true}}, {"id": "utrecht-centraal", "category": "station", "top": null, "names": {"en": "Utrecht Centraal station", "de": "Bahnhof Utrecht Centraal", "nl": "Station Utrecht Centraal", "fr": "Gare d'Utrecht Centraal", "es": "Estación de Utrecht Centraal", "it": "Stazione di Utrecht Centraal"}, "texts": {"en": "The first station on this site opened in 1843, and Utrecht Centraal is now the busiest railway station in the Netherlands and the hub of its rail network. A new station hall with a curved roof was completed in 2016. Next to it, the Stationsplein cycle park opened in 2019 with 12,500 spaces, then the largest in the world.", "de": "Der erste Bahnhof an dieser Stelle öffnete 1843; heute ist Utrecht Centraal der verkehrsreichste Bahnhof der Niederlande und Knotenpunkt des Bahnnetzes. 2016 wurde eine neue Bahnhofshalle mit geschwungenem Dach fertiggestellt. Daneben öffnete 2019 das Fahrradparkhaus Stationsplein mit 12.500 Plätzen, damals das größte der Welt.", "nl": "Het eerste station op deze plek opende in 1843; nu is Utrecht Centraal het drukste station van Nederland en het knooppunt van het spoornet. In 2016 werd een nieuwe stationshal met een gebogen dak opgeleverd. Ernaast opende in 2019 de fietsenstalling Stationsplein met 12.500 plekken, toen de grootste ter wereld.", "fr": "La première gare du site date de 1843 ; Utrecht Centraal est aujourd'hui la gare la plus fréquentée des Pays-Bas et le nœud du réseau ferré. Un nouveau hall au toit incurvé a été achevé en 2016. À côté, le parking à vélos Stationsplein a ouvert en 2019 avec 12 500 places, alors le plus grand du monde.", "es": "La primera estación en este lugar abrió en 1843; hoy Utrecht Centraal es la estación con más tráfico de los Países Bajos y el nudo de su red ferroviaria. En 2016 se terminó un nuevo vestíbulo con cubierta curva. Al lado, el aparcamiento de bicicletas Stationsplein abrió en 2019 con 12.500 plazas, entonces el mayor del mundo.", "it": "La prima stazione in questo luogo aprì nel 1843; oggi Utrecht Centraal è la stazione più trafficata dei Paesi Bassi e il nodo della sua rete ferroviaria. Nel 2016 è stato completato un nuovo atrio con tetto curvo. Accanto, nel 2019 ha aperto il parcheggio per bici Stationsplein con 12.500 posti, allora il più grande del mondo."}, "status": null, "lat": 52.089316, "lon": 5.109972, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Utrecht_Centraal_station", "de": "https://de.wikipedia.org/wiki/Bahnhof_Utrecht_Centraal", "nl": "https://nl.wikipedia.org/wiki/Station_Utrecht_Centraal", "fr": "https://fr.wikipedia.org/wiki/Gare_centrale_d%27Utrecht", "es": "https://es.wikipedia.org/wiki/Estaci%C3%B3n_Central_de_Utrecht", "it": "https://it.wikipedia.org/wiki/Stazione_di_Utrecht_Centrale"}, "image": {"file": "Utrecht Centraal station vanaf voetgangersbrug 2017 1.jpg", "local": "/travel/map-assets/1528871692/utrecht-centraal.jpg", "author": "Smiley.toerist", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Centraal_station_vanaf_voetgangersbrug_2017_1.jpg"}, "mini": "/travel/map-assets/1528871692/mini/utrecht-centraal.jpg", "mini_source": {"file": "Utrecht Centraal station vanaf voetgangersbrug 2017 1.jpg", "author": "Smiley.toerist", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Centraal_station_vanaf_voetgangersbrug_2017_1.jpg"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "inktpot", "category": "landmark", "top": null, "names": {"en": "The Inkpot (De Inktpot)", "de": "Tintenfass (De Inktpot)", "nl": "De Inktpot", "fr": "L'Encrier (De Inktpot)", "es": "El Tintero (De Inktpot)", "it": "Il Calamaio (De Inktpot)"}, "texts": {"en": "De Inktpot ('the Inkpot'), built in 1918–1921 as an administration building for the Dutch railways, is the largest brick building in the Netherlands, made of 22 million bricks. Since 1995 it has housed the rail infrastructure manager ProRail. On its roof sits a 12-metre 'UFO' by Marc Ruygrok, left over from the art event Panorama 2000.", "de": "De Inktpot („das Tintenfass“), 1918–1921 als Verwaltungsgebäude der niederländischen Eisenbahn erbaut, ist mit 22 Millionen Ziegeln das größte Backsteingebäude der Niederlande. Seit 1995 sitzt hier der Schienennetzbetreiber ProRail. Auf dem Dach ragt ein 12 Meter breites „UFO“ von Marc Ruygrok über die Kante, ein Überbleibsel der Kunstschau Panorama 2000.", "nl": "De Inktpot, in 1918–1921 gebouwd als administratiegebouw van de Nederlandse Spoorwegen, is met 22 miljoen stenen het grootste bakstenen gebouw van Nederland. Sinds 1995 is spoorbeheerder ProRail er gevestigd. Op het dak steekt een 'ufo' met een doorsnede van 12 meter over de rand, ontworpen door Marc Ruygrok en overgebleven van de kunstmanifestatie Panorama 2000.", "fr": "De Inktpot (« l'Encrier »), construit en 1918–1921 comme bâtiment administratif des chemins de fer néerlandais, est le plus grand bâtiment en brique des Pays-Bas, avec 22 millions de briques. Depuis 1995, il abrite ProRail, gestionnaire du réseau ferré. Sur son toit trône un « OVNI » de 12 mètres de Marc Ruygrok, vestige de la manifestation artistique Panorama 2000.", "es": "De Inktpot («el Tintero»), construido en 1918–1921 como edificio administrativo de los ferrocarriles neerlandeses, es el mayor edificio de ladrillo de los Países Bajos, con 22 millones de ladrillos. Desde 1995 alberga a ProRail, gestor de la red ferroviaria. En el tejado asoma un «ovni» de 12 metros de Marc Ruygrok, recuerdo de la muestra de arte Panorama 2000.", "it": "De Inktpot («il Calamaio»), costruito nel 1918–1921 come edificio amministrativo delle ferrovie olandesi, è il più grande edificio in mattoni dei Paesi Bassi, con 22 milioni di mattoni. Dal 1995 ospita ProRail, gestore della rete ferroviaria. Sul tetto sporge un «UFO» di 12 metri di Marc Ruygrok, rimasto dalla manifestazione artistica Panorama 2000."}, "status": {"en": "Office building (ProRail): not open to visitors; view it from outside.", "de": "Bürogebäude (ProRail): nicht für Besucher geöffnet; von außen besichtigen.", "nl": "Kantoorgebouw (ProRail): niet open voor bezoekers; bekijk het van buiten.", "fr": "Immeuble de bureaux (ProRail) : non ouvert au public ; à voir de l'extérieur.", "es": "Edificio de oficinas (ProRail): no abierto al público; se ve desde fuera.", "it": "Edificio per uffici (ProRail): non aperto al pubblico; si ammira dall'esterno."}, "lat": 52.087317, "lon": 5.114967, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/De_Inktpot"}, "image": {"file": "Utrecht de inktpot september 2003.jpg", "local": "/travel/map-assets/1528871692/inktpot.jpg", "author": "Ellywa at Dutch Wikipedia", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_de_inktpot_september_2003.jpg"}, "mini": "/travel/map-assets/1528871692/mini/inktpot.jpg", "mini_source": {"file": "Utrecht de inktpot september 2003.jpg", "author": "Ellywa at Dutch Wikipedia", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_de_inktpot_september_2003.jpg"}, "episode": {"fr": true}}, {"id": "centraal-museum", "category": "museum", "top": 8, "names": {"en": "Centraal Museum", "de": "Centraal Museum", "nl": "Centraal Museum", "fr": "Centraal Museum", "es": "Centraal Museum", "it": "Centraal Museum"}, "texts": {"en": "Founded in 1838, the Centraal Museum describes itself as the oldest municipal museum in the Netherlands. Since 1921 it has occupied the former convent of St Agnes. Its collections cover art, fashion, design and city history, from paintings by the Utrecht Caravaggisti such as Gerard van Honthorst to the Utrecht Ship, a boat about a thousand years old.", "de": "Das 1838 gegründete Centraal Museum bezeichnet sich als ältestes städtisches Museum der Niederlande. Seit 1921 befindet es sich im ehemaligen Agnes-Kloster. Die Sammlungen umfassen Kunst, Mode, Design und Stadtgeschichte, von Gemälden der Utrechter Caravaggisten wie Gerard van Honthorst bis zum Utrechter Schiff, einem rund tausend Jahre alten Boot.", "nl": "Het Centraal Museum, opgericht in 1838, noemt zich het oudste gemeentelijke museum van Nederland. Sinds 1921 zit het in het voormalige Agnietenklooster. De collecties omvatten kunst, mode, design en stadsgeschiedenis, van schilderijen van de Utrechtse caravaggisten zoals Gerard van Honthorst tot het Utrechtse schip, een boot van ongeveer duizend jaar oud.", "fr": "Fondé en 1838, le Centraal Museum se présente comme le plus ancien musée municipal des Pays-Bas. Depuis 1921, il occupe l'ancien couvent Sainte-Agnès. Ses collections couvrent l'art, la mode, le design et l'histoire de la ville, des tableaux des caravagesques d'Utrecht comme Gerard van Honthorst au bateau d'Utrecht, une embarcation vieille d'environ mille ans.", "es": "Fundado en 1838, el Centraal Museum se presenta como el museo municipal más antiguo de los Países Bajos. Desde 1921 ocupa el antiguo convento de Santa Inés. Sus colecciones abarcan arte, moda, diseño e historia de la ciudad, desde cuadros de los caravaggistas de Utrecht como Gerard van Honthorst hasta el barco de Utrecht, de unos mil años de antigüedad.", "it": "Fondato nel 1838, il Centraal Museum si definisce il più antico museo civico dei Paesi Bassi. Dal 1921 ha sede nell'ex convento di Sant'Agnese. Le collezioni spaziano tra arte, moda, design e storia della città, dai dipinti dei caravaggisti di Utrecht come Gerard van Honthorst alla nave di Utrecht, un'imbarcazione di circa mille anni."}, "status": null, "lat": 52.083333, "lon": 5.125833, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Centraal_Museum", "de": "https://de.wikipedia.org/wiki/Centraal_Museum_Utrecht", "nl": "https://nl.wikipedia.org/wiki/Centraal_Museum", "fr": "https://fr.wikipedia.org/wiki/Centraal_Museum", "es": "https://es.wikipedia.org/wiki/Centraal_Museum", "it": "https://it.wikipedia.org/wiki/Centraal_Museum"}, "image": {"file": "Exterieur Centraal Museum.jpg", "local": "/travel/map-assets/1528871692/centraal-museum.jpg", "author": "Centraal Museum / fotograaf: Vincent Zedelius", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Exterieur_Centraal_Museum.jpg"}, "mini": "/travel/map-assets/1528871692/mini/centraal-museum.jpg", "mini_source": {"file": "Exterieur Centraal Museum.jpg", "author": "Centraal Museum / fotograaf: Vincent Zedelius", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Exterieur_Centraal_Museum.jpg"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "nijntje-museum", "category": "museum", "top": null, "names": {"en": "Miffy Museum (nijntje museum)", "de": "Miffy-Museum (nijntje museum)", "nl": "nijntje museum", "fr": "Musée Miffy (nijntje museum)", "es": "Museo Miffy (nijntje museum)", "it": "Museo di Miffy (nijntje museum)"}, "texts": {"en": "This museum lets children aged 2 to 6 step into the world of Miffy, the rabbit created by Utrecht artist Dick Bruna (1927–2017). It opened in 2006 as the dick bruna huis and reopened in 2016 as the nijntje museum. Its rooms, about 1,500 m² in all, invite toddlers to look, play and explore in Bruna's simple style.", "de": "In diesem Museum tauchen Kinder von 2 bis 6 Jahren in die Welt von Miffy ein, dem Hasen des Utrechter Künstlers Dick Bruna (1927–2017). Es öffnete 2006 als dick bruna huis und 2016 neu als nijntje museum. Auf rund 1.500 m² laden die Räume Kleinkinder ein, in Brunas schlichtem Stil zu schauen, zu spielen und zu entdecken.", "nl": "In dit museum stappen kinderen van 2 tot en met 6 jaar in de wereld van nijntje, het konijntje van de Utrechtse kunstenaar Dick Bruna (1927–2017). Het opende in 2006 als dick bruna huis en ging in 2016 opnieuw open als nijntje museum. Op ruim 1500 m² kunnen peuters en kleuters kijken, spelen en ontdekken in Bruna's eenvoudige stijl.", "fr": "Ce musée fait entrer les enfants de 2 à 6 ans dans l'univers de Miffy, la petite lapine créée par l'artiste utrechtois Dick Bruna (1927–2017). Ouvert en 2006 sous le nom de dick bruna huis, il a rouvert en 2016 comme nijntje museum. Sur environ 1 500 m², les tout-petits regardent, jouent et explorent dans le style épuré de Bruna.", "es": "Este museo invita a niños de 2 a 6 años a entrar en el mundo de Miffy, la conejita creada por el artista de Utrecht Dick Bruna (1927–2017). Abrió en 2006 como dick bruna huis y reabrió en 2016 como nijntje museum. En unos 1500 m², los más pequeños miran, juegan y exploran en el estilo sencillo de Bruna.", "it": "Questo museo porta i bambini dai 2 ai 6 anni nel mondo di Miffy, la coniglietta creata dall'artista di Utrecht Dick Bruna (1927–2017). Aperto nel 2006 come dick bruna huis, ha riaperto nel 2016 come nijntje museum. Su circa 1500 m², i più piccoli guardano, giocano ed esplorano nello stile essenziale di Bruna."}, "status": null, "lat": 52.083869, "lon": 5.125625, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Nijntje_museum"}, "image": {"file": "Dick Bruna huis.jpg", "local": "/travel/map-assets/1528871692/nijntje-museum.jpg", "author": "Japiot", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Dick_Bruna_huis.jpg"}, "mini": "/travel/map-assets/1528871692/mini/nijntje-museum.jpg", "mini_source": {"file": "Dick Bruna huis.jpg", "author": "Japiot", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Dick_Bruna_huis.jpg"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "universiteitsmuseum", "category": "museum", "top": null, "names": {"en": "University Museum (UMU) and Oude Hortus", "de": "Universitätsmuseum (UMU) und Oude Hortus", "nl": "Universiteitsmuseum (UMU) en Oude Hortus", "fr": "Musée de l'université (UMU) et Oude Hortus", "es": "Museo de la Universidad (UMU) y Oude Hortus", "it": "Museo dell'Università (UMU) e Oude Hortus"}, "texts": {"en": "The University Museum (UMU) shows the collections of Utrecht University, from scientific instruments of 1650–1850, including a Van Leeuwenhoek microscope, to medical and zoological objects. Founded in 1918, it reopened in 2023 after a renovation. Its garden, the Oude Hortus, was laid out as the university's botanic garden in 1723 and still has its greenhouses and former orangery.", "de": "Das Universitätsmuseum (UMU) zeigt die Sammlungen der Universität Utrecht, von wissenschaftlichen Instrumenten aus den Jahren 1650–1850, darunter ein Mikroskop von Van Leeuwenhoek, bis zu medizinischen und zoologischen Objekten. Gegründet 1918, wurde es 2023 nach einem Umbau wiedereröffnet. Sein Garten, die Oude Hortus, wurde 1723 als botanischer Garten der Universität angelegt und hat noch Gewächshäuser und eine frühere Orangerie.", "nl": "Het Universiteitsmuseum (UMU) toont de collecties van de Universiteit Utrecht, van wetenschappelijke instrumenten uit 1650–1850, waaronder een Van Leeuwenhoekmicroscoop, tot medische en zoölogische voorwerpen. Het werd opgericht in 1918 en heropende in 2023 na een verbouwing. De tuin, de Oude Hortus, werd in 1723 ingericht als botanische tuin van de universiteit en heeft nog kassen en een voormalige oranjerie.", "fr": "Le musée de l'université (UMU) présente les collections de l'université d'Utrecht, des instruments scientifiques de 1650–1850, dont un microscope de Van Leeuwenhoek, aux objets médicaux et zoologiques. Fondé en 1918, il a rouvert en 2023 après des travaux. Son jardin, l'Oude Hortus, aménagé en 1723 comme jardin botanique de l'université, conserve ses serres et une ancienne orangerie.", "es": "El Museo de la Universidad (UMU) muestra las colecciones de la Universidad de Utrecht, desde instrumentos científicos de 1650–1850, entre ellos un microscopio de Van Leeuwenhoek, hasta objetos médicos y zoológicos. Fundado en 1918, reabrió en 2023 tras una reforma. Su jardín, el Oude Hortus, se creó en 1723 como jardín botánico de la universidad y conserva invernaderos y una antigua orangerie.", "it": "Il Museo dell'Università (UMU) espone le collezioni dell'Università di Utrecht, dagli strumenti scientifici del 1650–1850, tra cui un microscopio di Van Leeuwenhoek, agli oggetti medici e zoologici. Fondato nel 1918, ha riaperto nel 2023 dopo una ristrutturazione. Il suo giardino, l'Oude Hortus, allestito nel 1723 come orto botanico dell'università, conserva serre e un'antica aranciera."}, "status": null, "lat": 52.0849, "lon": 5.12571, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Universiteitsmuseum_%28Utrecht%29"}, "image": {"file": "Entrance of Universiteitsmuseum Utrecht.jpg", "local": "/travel/map-assets/1528871692/universiteitsmuseum.jpg", "author": "Sandra Fauconnier", "license": "CC BY 4.0", "license_url": "https://creativecommons.org/licenses/by/4.0", "source": "https://commons.wikimedia.org/wiki/File:Entrance_of_Universiteitsmuseum_Utrecht.jpg"}, "mini": "/travel/map-assets/1528871692/mini/universiteitsmuseum.jpg", "mini_source": {"file": "Lange Nieuwstraat, Utrecht, Netherlands - panoramio (7).jpg", "author": "Ben Bender", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Lange_Nieuwstraat,_Utrecht,_Netherlands_-_panoramio_(7).jpg"}, "episode": {}}, {"id": "sonnenborgh", "category": "museum", "top": null, "names": {"en": "Sonnenborgh museum & observatory", "de": "Sternwarte Sonnenborgh", "nl": "Sonnenborgh – museum & sterrenwacht", "fr": "Observatoire de Sonnenborgh", "es": "Observatorio Sonnenborgh", "it": "Osservatorio Sonnenborgh"}, "texts": {"en": "Sonnenborgh is one of four stone bastions Charles V had built around Utrecht; it came into use in 1552 and is the only one to survive. In 1853 Buys Ballot founded the university observatory here, and the Dutch weather institute KNMI started here in 1854. Today it is a museum and public observatory with historic telescopes.", "de": "Sonnenborgh ist eine von vier steinernen Bastionen, die Karl V. um Utrecht anlegen ließ; sie wurde 1552 in Gebrauch genommen und ist als einzige erhalten. 1853 gründete Buys Ballot hier die Universitätssternwarte, 1854 entstand hier das niederländische Wetterinstitut KNMI. Heute ist sie Museum und Volkssternwarte mit historischen Teleskopen.", "nl": "Sonnenborgh is een van de vier stenen bolwerken die Karel V rond Utrecht liet bouwen; het werd in 1552 in gebruik genomen en is als enige bewaard. In 1853 vestigde Buys Ballot hier de universiteitssterrenwacht, en in 1854 begon hier het KNMI. Nu is het een museum en publiekssterrenwacht met historische telescopen.", "fr": "Sonnenborgh est l'un des quatre bastions en pierre que Charles Quint fit construire autour d'Utrecht ; mis en service en 1552, c'est le seul conservé. En 1853, Buys Ballot y installa l'observatoire de l'université, et l'institut météorologique néerlandais KNMI y naquit en 1854. C'est aujourd'hui un musée et un observatoire public avec des télescopes historiques.", "es": "Sonnenborgh es uno de los cuatro bastiones de piedra que Carlos V mandó construir alrededor de Utrecht; entró en uso en 1552 y es el único que se conserva. En 1853 Buys Ballot instaló aquí el observatorio de la universidad, y en 1854 nació aquí el instituto meteorológico neerlandés KNMI. Hoy es museo y observatorio público con telescopios históricos.", "it": "Sonnenborgh è uno dei quattro bastioni in pietra che Carlo V fece costruire attorno a Utrecht; entrò in uso nel 1552 ed è l'unico rimasto. Nel 1853 Buys Ballot vi fondò l'osservatorio universitario, e nel 1854 vi nacque l'istituto meteorologico olandese KNMI. Oggi è un museo e osservatorio pubblico con telescopi storici."}, "status": null, "lat": 52.085389, "lon": 5.129194, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Sonnenborgh_Observatory", "de": "https://de.wikipedia.org/wiki/Sonnenborgh", "nl": "https://nl.wikipedia.org/wiki/Sonnenborgh_%28Utrecht%29", "fr": "https://fr.wikipedia.org/wiki/Observatoire_de_Sonnenborgh", "es": "https://es.wikipedia.org/wiki/Observatorio_Sonnenborgh", "it": "https://it.wikipedia.org/wiki/Osservatorio_Sonnenborgh"}, "image": {"file": "Utrecht Zonnenburg2 018 2227.jpg", "local": "/travel/map-assets/1528871692/sonnenborgh.jpg", "author": "Ludvig14", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Zonnenburg2_018_2227.jpg"}, "mini": "/travel/map-assets/1528871692/mini/sonnenborgh.jpg", "mini_source": {"file": "Utrecht Zonnenburg2 018 2227.jpg", "author": "Ludvig14", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Zonnenburg2_018_2227.jpg"}, "episode": {}}, {"id": "museum-catharijneconvent", "category": "museum", "top": null, "names": {"en": "Museum Catharijneconvent", "de": "Museum Catharijneconvent", "nl": "Museum Catharijneconvent", "fr": "Museum Catharijneconvent", "es": "Museum Catharijneconvent", "it": "Museum Catharijneconvent"}, "texts": {"en": "Museum Catharijneconvent shows the history of Christianity in the Netherlands through art, from the early Middle Ages to today. Since 1979 it has been housed in the former convent of St Catherine. Highlights include illuminated manuscripts, the 9th-century chalice of St Lebuinus and paintings by Jan van Scorel and Pieter Saenredam.", "de": "Das Museum Catharijneconvent zeigt die Geschichte des Christentums in den Niederlanden anhand von Kunst, vom frühen Mittelalter bis heute. Seit 1979 befindet es sich im ehemaligen Katharinenkloster. Zu den Höhepunkten gehören illuminierte Handschriften, der Kelch des heiligen Lebuinus aus dem 9. Jahrhundert und Gemälde von Jan van Scorel und Pieter Saenredam.", "nl": "Museum Catharijneconvent laat met kunst de geschiedenis van het christendom in Nederland zien, van de vroege middeleeuwen tot nu. Sinds 1979 is het gevestigd in het voormalige klooster van Sint-Catharina. Hoogtepunten zijn verluchte handschriften, de kelk van Sint-Lebuïnus uit de 9e eeuw en schilderijen van Jan van Scorel en Pieter Saenredam.", "fr": "Le Museum Catharijneconvent retrace par l'art l'histoire du christianisme aux Pays-Bas, du haut Moyen Âge à nos jours. Il occupe depuis 1979 l'ancien couvent Sainte-Catherine. Parmi les pièces phares figurent des manuscrits enluminés, le calice de saint Lebuin du IXe siècle et des tableaux de Jan van Scorel et de Pieter Saenredam.", "es": "El Museum Catharijneconvent recorre a través del arte la historia del cristianismo en los Países Bajos, desde la Alta Edad Media hasta hoy. Desde 1979 ocupa el antiguo convento de Santa Catalina. Destacan los manuscritos iluminados, el cáliz de san Lebuino del siglo IX y cuadros de Jan van Scorel y Pieter Saenredam.", "it": "Il Museum Catharijneconvent racconta attraverso l'arte la storia del cristianesimo nei Paesi Bassi, dall'alto Medioevo a oggi. Dal 1979 ha sede nell'ex convento di Santa Caterina. Tra i pezzi principali ci sono manoscritti miniati, il calice di san Lebuino del IX secolo e dipinti di Jan van Scorel e Pieter Saenredam."}, "status": null, "lat": 52.087222, "lo
