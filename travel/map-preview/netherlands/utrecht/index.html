<script>
const D={"city": "Utrecht", "city_id": 1528871692, "highlights": [{"id": "domtoren", "category": "landmark", "in_episode": true, "names": {"en": "Dom Tower (Domtoren)", "de": "Domturm (Domtoren)", "nl": "Domtoren", "fr": "Tour de la cathédrale (Domtoren)", "es": "Torre de la catedral (Domtoren)", "it": "Torre del Duomo (Domtoren)"}, "texts": {"en": "Built between 1321 and 1382, the Dom Tower is about 112 metres tall, the tallest church tower in the Netherlands. It has stood apart from its church since a storm brought down the nave in 1674. A restoration of the exterior was completed in 2024, and guided tours climb its 465 steps past bells that are still rung by hand.", "de": "Der zwischen 1321 und 1382 erbaute Domturm ist rund 112 Meter hoch und der höchste Kirchturm der Niederlande. Seit ein Sturm 1674 das Langhaus zum Einsturz brachte, steht er getrennt von seiner Kirche. 2024 wurde die Restaurierung der Außenseite abgeschlossen; Führungen steigen die 465 Stufen hinauf, vorbei an Glocken, die noch von Hand geläutet werden.", "nl": "De Domtoren, gebouwd tussen 1321 en 1382, is ongeveer 112 meter hoog en de hoogste kerktoren van Nederland. Sinds een storm in 1674 het schip van de kerk deed instorten, staat hij los van zijn kerk. In 2024 werd de restauratie van de buitenkant afgerond; rondleidingen gaan de 465 treden op, langs klokken die nog met de hand worden geluid.", "fr": "Construite de 1321 à 1382, la tour de la cathédrale mesure environ 112 mètres : c'est le plus haut clocher des Pays-Bas. Une tempête l'a séparée de son église en abattant la nef en 1674. Sa restauration extérieure s'est achevée en 2024 ; les visites guidées gravissent 465 marches, près de cloches encore sonnées à la main.", "es": "Construida entre 1321 y 1382, la torre de la catedral mide unos 112 metros: es el campanario más alto de los Países Bajos. Una tormenta la separó de su iglesia al derribar la nave en 1674. Su restauración exterior terminó en 2024; las visitas guiadas suben 465 escalones junto a campanas aún tocadas a mano.", "it": "Costruita tra il 1321 e il 1382, la Torre del Duomo è alta circa 112 metri: è il campanile più alto dei Paesi Bassi. Una tempesta la separò dalla chiesa facendo crollare la navata nel 1674. Il restauro esterno si è concluso nel 2024; le visite guidate salgono 465 gradini, accanto a campane ancora suonate a mano."}, "status": null, "lat": 52.09065, "lon": 5.1214, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Dom_Tower_of_Utrecht", "nl": "https://nl.wikipedia.org/wiki/Domtoren_%28Utrecht%29"}, "image": {"file": "DomTorenUtrechtNederland.jpg", "local": "/travel/map-assets/1528871692/domtoren.jpg", "author": "Massimo Catarinella", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:DomTorenUtrechtNederland.jpg"}}, {"id": "domkerk", "category": "landmark", "in_episode": true, "names": {"en": "Dom Church (Domkerk)", "de": "Domkirche (Domkerk)", "nl": "Domkerk", "fr": "Cathédrale Saint-Martin (Domkerk)", "es": "Catedral de San Martín (Domkerk)", "it": "Cattedrale di San Martino (Domkerk)"}, "texts": {"en": "The Domkerk is what remains of Utrecht's medieval St Martin's Cathedral: the Gothic choir and transept, begun in 1254. Its nave collapsed in the storm of 1 August 1674 and was never rebuilt. The church has been Protestant since 1580, and on its south side lie the cloister and its garden, the Pandhof.", "de": "Die Domkerk ist der Rest der mittelalterlichen Kathedrale St. Martin in Utrecht: der gotische Chor und das Querschiff, begonnen 1254. Das Langhaus stürzte beim Sturm am 1. August 1674 ein und wurde nie wieder aufgebaut. Seit 1580 ist die Kirche protestantisch; an ihrer Südseite liegen der Kreuzgang und sein Garten, der Pandhof.", "nl": "De Domkerk is wat er over is van de middeleeuwse Sint-Maartenskathedraal van Utrecht: het gotische koor en transept, begonnen in 1254. Het schip stortte in tijdens de storm van 1 augustus 1674 en werd nooit herbouwd. Sinds 1580 is de kerk protestants; aan de zuidkant liggen de kloostergang en de kloostertuin, de Pandhof.", "fr": "La Domkerk est ce qui reste de la cathédrale médiévale Saint-Martin d'Utrecht : le chœur et le transept gothiques, commencés en 1254. La nef s'est effondrée lors de la tempête du 1er août 1674 et n'a jamais été reconstruite. L'église est protestante depuis 1580 ; au sud se trouvent le cloître et son jardin, le Pandhof.", "es": "La Domkerk es lo que queda de la catedral medieval de San Martín de Utrecht: el coro y el crucero góticos, iniciados en 1254. Su nave se derrumbó en la tormenta del 1 de agosto de 1674 y nunca se reconstruyó. La iglesia es protestante desde 1580; en su lado sur están el claustro y su jardín, el Pandhof.", "it": "La Domkerk è ciò che resta della cattedrale medievale di San Martino a Utrecht: il coro e il transetto gotici, iniziati nel 1254. La navata crollò nella tempesta del 1° agosto 1674 e non fu mai ricostruita. La chiesa è protestante dal 1580; sul lato sud si trovano il chiostro e il suo giardino, il Pandhof."}, "status": null, "lat": 52.09092, "lon": 5.122233, "wikipedia": {"en": "https://en.wikipedia.org/wiki/St._Martin%27s_Cathedral%2C_Utrecht", "de": "https://de.wikipedia.org/wiki/Utrechter_Dom", "nl": "https://nl.wikipedia.org/wiki/Dom_van_Utrecht", "fr": "https://fr.wikipedia.org/wiki/Cath%C3%A9drale_Saint-Martin_d%27Utrecht", "es": "https://es.wikipedia.org/wiki/Catedral_de_San_Mart%C3%ADn_%28Utrecht%29", "it": "https://it.wikipedia.org/wiki/Duomo_di_Utrecht"}, "image": {"file": "DomTorenUtrechtNederland.jpg", "local": "/travel/map-assets/1528871692/domkerk.jpg", "author": "Massimo Catarinella", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:DomTorenUtrechtNederland.jpg"}}, {"id": "domplein", "category": "history", "in_episode": true, "names": {"en": "Dom Square (Domplein)", "de": "Domplatz (Domplein)", "nl": "Domplein", "fr": "Place de la cathédrale (Domplein)", "es": "Plaza de la catedral (Domplein)", "it": "Piazza del Duomo (Domplein)"}, "texts": {"en": "Dom Square is the space left by the cathedral nave that fell in the storm of 1674. The walled-off ruin stood until the city bought it in 1826 and had it demolished. Coloured paving stones mark the outline of the lost nave, and guided DOMunder tours lead down to remains of the Roman fort Traiectum.", "de": "Der Domplatz ist die Fläche, die das im Sturm von 1674 eingestürzte Langhaus der Kathedrale hinterließ. Die ummauerte Ruine stand, bis die Stadt sie 1826 kaufte und abreißen ließ. Farbige Pflastersteine zeigen den Grundriss des verlorenen Schiffs, und DOMunder-Führungen führen hinab zu Resten des römischen Kastells Traiectum.", "nl": "Het Domplein is de ruimte die het in de storm van 1674 ingestorte schip van de kathedraal achterliet. De ommuurde ruïne bleef staan tot de stad haar in 1826 kocht en liet slopen. Gekleurde stenen in de bestrating tonen de omtrek van het verdwenen schip, en rondleidingen van DOMunder gaan naar resten van het Romeinse fort Traiectum.", "fr": "La place de la cathédrale occupe l'espace de la nef effondrée lors de la tempête de 1674. La ruine, close par un mur, resta debout jusqu'à son achat par la ville en 1826, suivi de sa démolition. Des pavés colorés dessinent le contour de la nef, et les visites guidées DOMunder mènent aux vestiges du fort romain de Traiectum.", "es": "La plaza de la catedral ocupa el espacio de la nave derrumbada en la tormenta de 1674. La ruina, cerrada por un muro, siguió en pie hasta que la ciudad la compró en 1826 y la demolió. Adoquines de colores marcan el contorno de la nave, y las visitas guiadas de DOMunder bajan a restos del fuerte romano de Traiectum.", "it": "Piazza del Duomo occupa lo spazio della navata crollata nella tempesta del 1674. La rovina, chiusa da un muro, rimase in piedi finché la città la acquistò nel 1826 e la fece demolire. Pietre colorate nel selciato segnano il contorno della navata, e le visite guidate di DOMunder scendono ai resti del forte romano di Traiectum."}, "status": null, "lat": 52.09028, "lon": 5.12167, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Domplein"}, "image": {"file": "Utrecht Dom church.JPG", "local": "/travel/map-assets/1528871692/domplein.jpg", "author": "unknown", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Dom_church.JPG"}}, {"id": "paushuize", "category": "landmark", "in_episode": true, "names": {"en": "Pope's House (Paushuize)", "de": "Papsthaus (Paushuize)", "nl": "Paushuize", "fr": "Maison du pape (Paushuize)", "es": "Casa del papa (Paushuize)", "it": "Casa del papa (Paushuize)"}, "texts": {"en": "Adriaan Floriszoon Boeyens had this house built from 1517. In 1522 he became Pope Adrian VI, the only Dutch pope, and he died in Rome a year later without ever living here. From 1815 to 1954 it housed the King's Commissioner; today it is an event venue, best seen from Pausdam.", "de": "Adriaan Floriszoon Boeyens ließ dieses Haus ab 1517 bauen. 1522 wurde er als Hadrian VI. Papst, der einzige niederländische Papst, und starb ein Jahr später in Rom, ohne je hier gewohnt zu haben. Von 1815 bis 1954 residierte hier der Kommissar des Königs; heute ist es ein Veranstaltungsort, am besten vom Pausdam aus zu sehen.", "nl": "Adriaan Floriszoon Boeyens liet dit huis vanaf 1517 bouwen. In 1522 werd hij paus Adrianus VI, de enige Nederlandse paus, en een jaar later stierf hij in Rome zonder hier ooit te hebben gewoond. Van 1815 tot 1954 zetelde hier de commissaris van de Koning; nu is het een evenementenlocatie, het mooist te zien vanaf de Pausdam.", "fr": "Adriaan Floriszoon Boeyens fit construire cette maison à partir de 1517. Devenu en 1522 le pape Adrien VI, le seul pape néerlandais, il mourut à Rome un an plus tard sans jamais y habiter. De 1815 à 1954, elle accueillit le commissaire du Roi ; c'est aujourd'hui un lieu d'événements, à voir depuis le Pausdam.", "es": "Adriaan Floriszoon Boeyens mandó construir esta casa a partir de 1517. En 1522 fue elegido papa como Adriano VI, el único papa neerlandés, y murió en Roma un año después sin haber vivido aquí. De 1815 a 1954 fue sede del comisario del Rey; hoy es un espacio para eventos, que se ve mejor desde el Pausdam.", "it": "Adriaan Floriszoon Boeyens fece costruire questa casa dal 1517. Nel 1522 divenne papa Adriano VI, l'unico papa olandese, e morì a Roma un anno dopo senza averci mai abitato. Dal 1815 al 1954 ospitò il commissario del Re; oggi è una sede per eventi, da ammirare dal Pausdam."}, "status": {"en": "Event venue: the interior is generally not open to visitors; view it from outside.", "de": "Veranstaltungsort: Das Innere ist in der Regel nicht für Besucher geöffnet; von außen besichtigen.", "nl": "Evenementenlocatie: het interieur is meestal niet open voor bezoekers; bekijk het van buiten.", "fr": "Lieu d'événements : l'intérieur n'est généralement pas ouvert au public ; à voir de l'extérieur.", "es": "Espacio para eventos: el interior no suele estar abierto al público; se ve desde fuera.", "it": "Sede per eventi: l'interno di norma non è aperto al pubblico; si ammira dall'esterno."}, "lat": 52.090278, "lon": 5.123889, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Paushuize"}, "image": {"file": "Paushuize.Utrecht.jpg", "local": "/travel/map-assets/1528871692/paushuize.jpg", "author": "China Crisis", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Paushuize.Utrecht.jpg"}}, {"id": "oudegracht", "category": "landmark", "in_episode": true, "names": {"en": "Old Canal (Oudegracht)", "de": "Alte Gracht (Oudegracht)", "nl": "Oudegracht", "fr": "Vieux canal (Oudegracht)", "es": "Canal viejo (Oudegracht)", "it": "Canale vecchio (Oudegracht)"}, "texts": {"en": "The Oudegracht has two levels: the street above and wharves at water level, with cellars running under the street. From the late 12th century merchants linked their cellars to the wharf; by about 1500 wharf cellars lined both banks, a harbour almost 2 km long. Many now hold cafés with waterside terraces.", "de": "Die Oudegracht hat zwei Ebenen: oben die Straße, unten Werften auf Wasserhöhe mit Kellern unter der Straße. Ab dem späten 12. Jahrhundert verbanden Kaufleute ihre Keller mit der Werft; um 1500 säumten Werftkeller beide Ufer, ein fast 2 km langer Hafen. Heute beherbergen viele Cafés mit Terrassen am Wasser.", "nl": "De Oudegracht heeft twee niveaus: de straat boven en werven op waterhoogte, met kelders die onder de straat doorlopen. Vanaf eind 12e eeuw verbonden kooplieden hun kelders met de werf; rond 1500 lagen er werfkelders langs beide oevers, een haven van bijna 2 km. In veel kelders zitten nu cafés met terrassen aan het water.", "fr": "L'Oudegracht a deux niveaux : la rue et, au ras de l'eau, des quais dont les caves passent sous la chaussée. Dès la fin du XIIe siècle, les marchands relièrent leurs caves au quai ; vers 1500, elles bordaient les deux rives, un port de près de 2 km. Beaucoup abritent des cafés avec terrasse au bord de l'eau.", "es": "El Oudegracht tiene dos niveles: la calle arriba y, a ras del agua, muelles con bodegas bajo la calzada. Desde finales del siglo XII los comerciantes unieron sus sótanos al muelle; hacia 1500 las bodegas bordeaban ambas orillas, un puerto de casi 2 km. Muchas albergan hoy cafés con terraza junto al agua.", "it": "L'Oudegracht ha due livelli: la strada in alto e, a pelo d'acqua, banchine con cantine sotto la carreggiata. Dalla fine del XII secolo i mercanti collegarono le cantine alla banchina; intorno al 1500 le cantine fiancheggiavano entrambe le sponde, un porto di quasi 2 km. Molte ospitano oggi caffè con terrazze sull'acqua."}, "status": null, "lat": 52.09167, "lon": 5.11778, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Oudegracht", "nl": "https://nl.wikipedia.org/wiki/Oudegracht_%28Utrecht%29", "it": "https://it.wikipedia.org/wiki/Oudegracht"}, "image": {"file": "Utrecht Canals Aerial View - July 2006.jpg", "local": "/travel/map-assets/1528871692/oudegracht.jpg", "author": "Diliff", "license": "CC BY 2.5", "license_url": "https://creativecommons.org/licenses/by/2.5", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Canals_Aerial_View_-_July_2006.jpg"}}, {"id": "catharijnesingel", "category": "history", "in_episode": true, "names": {"en": "Catharijnesingel (city moat)", "de": "Catharijnesingel (Stadtgraben)", "nl": "Catharijnesingel", "fr": "Catharijnesingel (douves de la ville)", "es": "Catharijnesingel (foso de la ciudad)", "it": "Catharijnesingel (fossato della città)"}, "texts": {"en": "The Catharijnesingel is part of the moat dug around Utrecht after it gained city rights in 1122. Around 1970 this stretch was filled in for a road, with the Hoog Catharijne shopping centre built over it. The water returned in stages, and since 2020 boats can again sail all the way around the old centre.", "de": "Die Catharijnesingel ist Teil des Stadtgrabens, der angelegt wurde, nachdem Utrecht 1122 das Stadtrecht erhielt. Um 1970 wurde dieser Abschnitt für eine Straße zugeschüttet und das Einkaufszentrum Hoog Catharijne darüber gebaut. Das Wasser kehrte schrittweise zurück, und seit 2020 können Boote wieder rund um die ganze Altstadt fahren.", "nl": "De Catharijnesingel is een deel van de gracht die rond Utrecht werd gegraven nadat de stad in 1122 stadsrechten kreeg. Rond 1970 werd dit stuk gedempt voor een autoweg, en winkelcentrum Hoog Catharijne werd erboven gebouwd. Het water kwam in fasen terug, en sinds 2020 kunnen boten weer helemaal rond de binnenstad varen.", "fr": "La Catharijnesingel fait partie des douves creusées autour d'Utrecht après l'obtention des droits de cité en 1122. Vers 1970, ce tronçon fut comblé pour une route, et le centre commercial Hoog Catharijne fut construit au-dessus. L'eau est revenue par étapes, et depuis 2020 les bateaux peuvent de nouveau faire le tour complet du centre historique.", "es": "La Catharijnesingel forma parte del foso excavado alrededor de Utrecht tras obtener los derechos de ciudad en 1122. Hacia 1970 este tramo se rellenó para construir una carretera, y encima se levantó el centro comercial Hoog Catharijne. El agua volvió por fases, y desde 2020 los barcos pueden volver a rodear todo el centro histórico.", "it": "La Catharijnesingel fa parte del fossato scavato intorno a Utrecht dopo che la città ottenne i diritti civici nel 1122. Verso il 1970 questo tratto fu interrato per una strada e coperto dal centro commerciale Hoog Catharijne. L'acqua è tornata per fasi, e dal 2020 le barche possono di nuovo girare intorno a tutto il centro storico."}, "status": null, "lat": 52.08489, "lon": 5.11881, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Catharijnesingel", "nl": "https://nl.wikipedia.org/wiki/Catharijnesingel"}, "image": {"file": "Catharijnesingel Utrecht Nederland.JPG", "local": "/travel/map-assets/1528871692/catharijnesingel.jpg", "author": "Antoine", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Catharijnesingel_Utrecht_Nederland.JPG"}}, {"id": "centraal-museum", "category": "museum", "in_episode": true, "names": {"en": "Centraal Museum", "de": "Centraal Museum", "nl": "Centraal Museum", "fr": "Centraal Museum", "es": "Centraal Museum", "it": "Centraal Museum"}, "texts": {"en": "Founded in 1838, the Centraal Museum describes itself as the oldest municipal museum in the Netherlands. Since 1921 it has occupied the former convent of St Agnes. Its collections cover art, fashion, design and city history, from paintings by the Utrecht Caravaggisti such as Gerard van Honthorst to the Utrecht Ship, a boat about a thousand years old.", "de": "Das 1838 gegründete Centraal Museum bezeichnet sich als ältestes städtisches Museum der Niederlande. Seit 1921 befindet es sich im ehemaligen Agnes-Kloster. Die Sammlungen umfassen Kunst, Mode, Design und Stadtgeschichte, von Gemälden der Utrechter Caravaggisten wie Gerard van Honthorst bis zum Utrechter Schiff, einem rund tausend Jahre alten Boot.", "nl": "Het Centraal Museum, opgericht in 1838, noemt zich het oudste gemeentelijke museum van Nederland. Sinds 1921 zit het in het voormalige Agnietenklooster. De collecties omvatten kunst, mode, design en stadsgeschiedenis, van schilderijen van de Utrechtse caravaggisten zoals Gerard van Honthorst tot het Utrechtse schip, een boot van ongeveer duizend jaar oud.", "fr": "Fondé en 1838, le Centraal Museum se présente comme le plus ancien musée municipal des Pays-Bas. Depuis 1921, il occupe l'ancien couvent Sainte-Agnès. Ses collections couvrent l'art, la mode, le design et l'histoire de la ville, des tableaux des caravagesques d'Utrecht comme Gerard van Honthorst au bateau d'Utrecht, une embarcation vieille d'environ mille ans.", "es": "Fundado en 1838, el Centraal Museum se presenta como el museo municipal más antiguo de los Países Bajos. Desde 1921 ocupa el antiguo convento de Santa Inés. Sus colecciones abarcan arte, moda, diseño e historia de la ciudad, desde cuadros de los caravaggistas de Utrecht como Gerard van Honthorst hasta el barco de Utrecht, de unos mil años de antigüedad.", "it": "Fondato nel 1838, il Centraal Museum si definisce il più antico museo civico dei Paesi Bassi. Dal 1921 ha sede nell'ex convento di Sant'Agnese. Le collezioni spaziano tra arte, moda, design e storia della città, dai dipinti dei caravaggisti di Utrecht come Gerard van Honthorst alla nave di Utrecht, un'imbarcazione di circa mille anni."}, "status": null, "lat": 52.083333, "lon": 5.125833, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Centraal_Museum", "de": "https://de.wikipedia.org/wiki/Centraal_Museum_Utrecht", "nl": "https://nl.wikipedia.org/wiki/Centraal_Museum", "fr": "https://fr.wikipedia.org/wiki/Centraal_Museum", "es": "https://es.wikipedia.org/wiki/Centraal_Museum", "it": "https://it.wikipedia.org/wiki/Centraal_Museum"}, "image": {"file": "Exterieur Centraal Museum.jpg", "local": "/travel/map-assets/1528871692/centraal-museum.jpg", "author": "Centraal Museum / fotograaf: Vincent Zedelius", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Exterieur_Centraal_Museum.jpg"}}, {"id": "rietveld-schroderhuis", "category": "landmark", "in_episode": true, "names": {"en": "Rietveld Schröder House (Rietveld Schröderhuis)", "de": "Rietveld-Schröder-Haus (Rietveld Schröderhuis)", "nl": "Rietveld Schröderhuis", "fr": "Maison Rietveld Schröder (Rietveld Schröderhuis)", "es": "Casa Rietveld Schröder (Rietveld Schröderhuis)", "it": "Casa Rietveld Schröder (Rietveld Schröderhuis)"}, "texts": {"en": "Gerrit Rietveld designed this house in 1924 with Truus Schröder, who lived here until her death in 1985. A key work of De Stijl, it has primary colours, straight lines and an upper floor divided by sliding panels instead of fixed walls. A UNESCO World Heritage Site since 2000, it can only be visited with a booked time slot.", "de": "Gerrit Rietveld entwarf dieses Haus 1924 zusammen mit Truus Schröder, die bis zu ihrem Tod 1985 hier lebte. Es ist ein Hauptwerk von De Stijl, mit Primärfarben, geraden Linien und einem Obergeschoss, das statt fester Wände durch Schiebewände geteilt wird. Das Haus ist seit 2000 UNESCO-Welterbe und nur mit gebuchtem Zeitfenster zu besichtigen.", "nl": "Gerrit Rietveld ontwierp dit huis in 1924 samen met Truus Schröder, die er tot haar dood in 1985 woonde. Het is een sleutelwerk van De Stijl, met primaire kleuren, rechte lijnen en een bovenverdieping die met schuifwanden in plaats van vaste muren wordt ingedeeld. Het huis is sinds 2000 UNESCO-werelderfgoed en alleen te bezoeken met een gereserveerd tijdslot.", "fr": "Gerrit Rietveld a conçu cette maison en 1924 avec Truus Schröder, qui y vécut jusqu'à sa mort en 1985. Œuvre clé de De Stijl, elle associe couleurs primaires, lignes droites et un étage divisé par des cloisons coulissantes au lieu de murs fixes. Inscrite au patrimoine mondial de l'UNESCO depuis 2000, elle se visite uniquement sur réservation.", "es": "Gerrit Rietveld diseñó esta casa en 1924 junto con Truus Schröder, que vivió en ella hasta su muerte en 1985. Es una obra clave de De Stijl, con colores primarios, líneas rectas y una planta alta dividida por paneles correderos en lugar de muros fijos. Patrimonio Mundial de la UNESCO desde 2000, solo se puede visitar reservando un horario.", "it": "Gerrit Rietveld progettò questa casa nel 1924 insieme a Truus Schröder, che vi abitò fino alla morte nel 1985. È un'opera chiave di De Stijl, con colori primari, linee rette e un piano superiore diviso da pannelli scorrevoli invece che da muri fissi. Patrimonio mondiale dell'UNESCO dal 2000, si visita solo prenotando una fascia oraria."}, "status": null, "lat": 52.085333, "lon": 5.147597, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Rietveld_Schr%C3%B6der_House", "de": "https://de.wikipedia.org/wiki/Rietveld-Schr%C3%B6der-Haus", "nl": "https://nl.wikipedia.org/wiki/Rietveld_Schr%C3%B6derhuis", "fr": "https://fr.wikipedia.org/wiki/Maison_Schr%C3%B6der_de_Rietveld", "es": "https://es.wikipedia.org/wiki/Casa_Rietveld_Schr%C3%B6der", "it": "https://it.wikipedia.org/wiki/Casa_Rietveld_Schr%C3%B6der"}, "image": {"file": "Rietveld Schröderhuis HayKranen-20.JPG", "local": "/travel/map-assets/1528871692/rietveld-schroderhuis.jpg", "author": "User:Husky", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Rietveld_Schr%C3%B6derhuis_HayKranen-20.JPG"}}, {"id": "nijntje-museum", "category": "museum", "in_episode": true, "names": {"en": "Miffy Museum (nijntje museum)", "de": "Miffy-Museum (nijntje museum)", "nl": "nijntje museum", "fr": "Musée Miffy (nijntje museum)", "es": "Museo Miffy (nijntje museum)", "it": "Museo di Miffy (nijntje museum)"}, "texts": {"en": "This museum lets children aged 2 to 6 step into the world of Miffy, the rabbit created by Utrecht artist Dick Bruna (1927–2017). It opened in 2006 as the dick bruna huis and reopened in 2016 as the nijntje museum. Its rooms, about 1,500 m² in all, invite toddlers to look, play and explore in Bruna's simple style.", "de": "In diesem Museum tauchen Kinder von 2 bis 6 Jahren in die Welt von Miffy ein, dem Hasen des Utrechter Künstlers Dick Bruna (1927–2017). Es öffnete 2006 als dick bruna huis und 2016 neu als nijntje museum. Auf rund 1.500 m² laden die Räume Kleinkinder ein, in Brunas schlichtem Stil zu schauen, zu spielen und zu entdecken.", "nl": "In dit museum stappen kinderen van 2 tot en met 6 jaar in de wereld van nijntje, het konijntje van de Utrechtse kunstenaar Dick Bruna (1927–2017). Het opende in 2006 als dick bruna huis en ging in 2016 opnieuw open als nijntje museum. Op ruim 1500 m² kunnen peuters en kleuters kijken, spelen en ontdekken in Bruna's eenvoudige stijl.", "fr": "Ce musée fait entrer les enfants de 2 à 6 ans dans l'univers de Miffy, la petite lapine créée par l'artiste utrechtois Dick Bruna (1927–2017). Ouvert en 2006 sous le nom de dick bruna huis, il a rouvert en 2016 comme nijntje museum. Sur environ 1 500 m², les tout-petits regardent, jouent et explorent dans le style épuré de Bruna.", "es": "Este museo invita a niños de 2 a 6 años a entrar en el mundo de Miffy, la conejita creada por el artista de Utrecht Dick Bruna (1927–2017). Abrió en 2006 como dick bruna huis y reabrió en 2016 como nijntje museum. En unos 1500 m², los más pequeños miran, juegan y exploran en el estilo sencillo de Bruna.", "it": "Questo museo porta i bambini dai 2 ai 6 anni nel mondo di Miffy, la coniglietta creata dall'artista di Utrecht Dick Bruna (1927–2017). Aperto nel 2006 come dick bruna huis, ha riaperto nel 2016 come nijntje museum. Su circa 1500 m², i più piccoli guardano, giocano ed esplorano nello stile essenziale di Bruna."}, "status": null, "lat": 52.083869, "lon": 5.125625, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Nijntje_museum"}, "image": {"file": "Dick Bruna huis.jpg", "local": "/travel/map-assets/1528871692/nijntje-museum.jpg", "author": "Japiot", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Dick_Bruna_huis.jpg"}}, {"id": "bibliotheek-neude", "category": "landmark", "in_episode": true, "names": {"en": "Neude Library, former main post office (Bibliotheek Neude)", "de": "Bibliothek Neude im ehemaligen Hauptpostamt (Bibliotheek Neude)", "nl": "Bibliotheek Neude (voormalig hoofdpostkantoor)", "fr": "Bibliothèque Neude, ancienne poste centrale (Bibliotheek Neude)", "es": "Biblioteca Neude, antigua central de correos (Bibliotheek Neude)", "it": "Biblioteca Neude, ex posta centrale (Bibliotheek Neude)"}, "texts": {"en": "Utrecht's former main post office on the Neude was built in 1919–1924 to a design by J. Crouwel jr. in the Amsterdam School style. Its hall is known for tall parabolic arches and stone figures of the continents. The post office closed in 2011; since 2020 the building has housed Bibliotheek Neude, the city's central library.", "de": "Das ehemalige Hauptpostamt am Neude wurde von 1919 bis 1924 nach einem Entwurf von J. Crouwel jr. im Stil der Amsterdamer Schule gebaut. Bekannt ist die Halle mit ihren hohen Parabelbögen und Steinfiguren, die die Erdteile darstellen. Das Postamt schloss 2011; seit 2020 ist hier die Bibliotheek Neude untergebracht, die Zentralbibliothek der Stadt.", "nl": "Het voormalige hoofdpostkantoor aan de Neude werd tussen 1919 en 1924 gebouwd naar een ontwerp van J. Crouwel jr. in de stijl van de Amsterdamse School. De hal is bekend om de hoge paraboolvormige bogen en de stenen beelden van de werelddelen. Het postkantoor sloot in 2011; sinds 2020 zit hier Bibliotheek Neude, de centrale bibliotheek van de stad.", "fr": "L'ancienne poste centrale d'Utrecht, sur la Neude, fut construite de 1919 à 1924 par J. Crouwel jr., dans le style de l'école d'Amsterdam. Son hall est connu pour ses hauts arcs paraboliques et ses statues des continents. La poste a fermé en 2011 ; depuis 2020, le bâtiment abrite la Bibliotheek Neude, bibliothèque centrale de la ville.", "es": "La antigua central de correos de Utrecht, en la Neude, se construyó entre 1919 y 1924 según un diseño de J. Crouwel jr., al estilo de la Escuela de Ámsterdam. Su vestíbulo destaca por sus altos arcos parabólicos y sus figuras de piedra de los continentes. Correos cerró en 2011; desde 2020 alberga la Bibliotheek Neude, la biblioteca central.", "it": "L'ex posta centrale di Utrecht, sulla Neude, fu costruita tra il 1919 e il 1924 su progetto di J. Crouwel jr., nello stile della Scuola di Amsterdam. La sala è nota per gli alti archi parabolici e le statue in pietra dei continenti. L'ufficio postale chiuse nel 2011; dal 2020 ospita la Bibliotheek Neude, la biblioteca centrale della città."}, "status": null, "lat": 52.093056, "lon": 5.117778, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Utrecht_Post_Office", "de": "https://de.wikipedia.org/wiki/Hauptpostamt_Utrecht", "nl": "https://nl.wikipedia.org/wiki/Hoofdpostkantoor_%28Utrecht%29"}, "image": {"file": "Utrecht MainPostOffice 018 1755.jpg", "local": "/travel/map-assets/1528871692/bibliotheek-neude.jpg", "author": "Ludvig14", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_MainPostOffice_018_1755.jpg"}}, {"id": "utrecht-centraal", "category": "station", "in_episode": true, "names": {"en": "Utrecht Centraal station", "de": "Bahnhof Utrecht Centraal", "nl": "Station Utrecht Centraal", "fr": "Gare d'Utrecht Centraal", "es": "Estación de Utrecht Centraal", "it": "Stazione di Utrecht Centraal"}, "texts": {"en": "The first station on this site opened in 1843, and Utrecht Centraal is now the busiest railway station in the Netherlands and the hub of its rail network. A new station hall with a curved roof was completed in 2016. Next to it, the Stationsplein cycle park opened in 2019 with 12,500 spaces, then the largest in the world.", "de": "Der erste Bahnhof an dieser Stelle öffnete 1843; heute ist Utrecht Centraal der verkehrsreichste Bahnhof der Niederlande und Knotenpunkt des Bahnnetzes. 2016 wurde eine neue Bahnhofshalle mit geschwungenem Dach fertiggestellt. Daneben öffnete 2019 das Fahrradparkhaus Stationsplein mit 12.500 Plätzen, damals das größte der Welt.", "nl": "Het eerste station op deze plek opende in 1843; nu is Utrecht Centraal het drukste station van Nederland en het knooppunt van het spoornet. In 2016 werd een nieuwe stationshal met een gebogen dak opgeleverd. Ernaast opende in 2019 de fietsenstalling Stationsplein met 12.500 plekken, toen de grootste ter wereld.", "fr": "La première gare du site date de 1843 ; Utrecht Centraal est aujourd'hui la gare la plus fréquentée des Pays-Bas et le nœud du réseau ferré. Un nouveau hall au toit incurvé a été achevé en 2016. À côté, le parking à vélos Stationsplein a ouvert en 2019 avec 12 500 places, alors le plus grand du monde.", "es": "La primera estación en este lugar abrió en 1843; hoy Utrecht Centraal es la estación con más tráfico de los Países Bajos y el nudo de su red ferroviaria. En 2016 se terminó un nuevo vestíbulo con cubierta curva. Al lado, el aparcamiento de bicicletas Stationsplein abrió en 2019 con 12.500 plazas, entonces el mayor del mundo.", "it": "La prima stazione in questo luogo aprì nel 1843; oggi Utrecht Centraal è la stazione più trafficata dei Paesi Bassi e il nodo della sua rete ferroviaria. Nel 2016 è stato completato un nuovo atrio con tetto curvo. Accanto, nel 2019 ha aperto il parcheggio per bici Stationsplein con 12.500 posti, allora il più grande del mondo."}, "status": null, "lat": 52.089316, "lon": 5.109972, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Utrecht_Centraal_station", "de": "https://de.wikipedia.org/wiki/Bahnhof_Utrecht_Centraal", "nl": "https://nl.wikipedia.org/wiki/Station_Utrecht_Centraal", "fr": "https://fr.wikipedia.org/wiki/Gare_centrale_d%27Utrecht", "es": "https://es.wikipedia.org/wiki/Estaci%C3%B3n_Central_de_Utrecht", "it": "https://it.wikipedia.org/wiki/Stazione_di_Utrecht_Centrale"}, "image": {"file": "Utrecht Centraal station vanaf voetgangersbrug 2017 1.jpg", "local": "/travel/map-assets/1528871692/utrecht-centraal.jpg", "author": "Smiley.toerist", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_Centraal_station_vanaf_voetgangersbrug_2017_1.jpg"}}, {"id": "museum-catharijneconvent", "category": "museum", "in_episode": false, "names": {"en": "Museum Catharijneconvent", "de": "Museum Catharijneconvent", "nl": "Museum Catharijneconvent", "fr": "Museum Catharijneconvent", "es": "Museum Catharijneconvent", "it": "Museum Catharijneconvent"}, "texts": {"en": "Museum Catharijneconvent shows the history of Christianity in the Netherlands through art, from the early Middle Ages to today. Since 1979 it has been housed in the former convent of St Catherine. Highlights include illuminated manuscripts, the 9th-century chalice of St Lebuinus and paintings by Jan van Scorel and Pieter Saenredam.", "de": "Das Museum Catharijneconvent zeigt die Geschichte des Christentums in den Niederlanden anhand von Kunst, vom frühen Mittelalter bis heute. Seit 1979 befindet es sich im ehemaligen Katharinenkloster. Zu den Höhepunkten gehören illuminierte Handschriften, der Kelch des heiligen Lebuinus aus dem 9. Jahrhundert und Gemälde von Jan van Scorel und Pieter Saenredam.", "nl": "Museum Catharijneconvent laat met kunst de geschiedenis van het christendom in Nederland zien, van de vroege middeleeuwen tot nu. Sinds 1979 is het gevestigd in het voormalige klooster van Sint-Catharina. Hoogtepunten zijn verluchte handschriften, de kelk van Sint-Lebuïnus uit de 9e eeuw en schilderijen van Jan van Scorel en Pieter Saenredam.", "fr": "Le Museum Catharijneconvent retrace par l'art l'histoire du christianisme aux Pays-Bas, du haut Moyen Âge à nos jours. Il occupe depuis 1979 l'ancien couvent Sainte-Catherine. Parmi les pièces phares figurent des manuscrits enluminés, le calice de saint Lebuin du IXe siècle et des tableaux de Jan van Scorel et de Pieter Saenredam.", "es": "El Museum Catharijneconvent recorre a través del arte la historia del cristianismo en los Países Bajos, desde la Alta Edad Media hasta hoy. Desde 1979 ocupa el antiguo convento de Santa Catalina. Destacan los manuscritos iluminados, el cáliz de san Lebuino del siglo IX y cuadros de Jan van Scorel y Pieter Saenredam.", "it": "Il Museum Catharijneconvent racconta attraverso l'arte la storia del cristianesimo nei Paesi Bassi, dall'alto Medioevo a oggi. Dal 1979 ha sede nell'ex convento di Santa Caterina. Tra i pezzi principali ci sono manoscritti miniati, il calice di san Lebuino del IX secolo e dipinti di Jan van Scorel e Pieter Saenredam."}, "status": null, "lat": 52.087222, "lon": 5.124167, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Museum_Catharijneconvent", "de": "https://de.wikipedia.org/wiki/Museum_Catharijneconvent", "nl": "https://nl.wikipedia.org/wiki/Museum_Catharijneconvent", "fr": "https://fr.wikipedia.org/wiki/Mus%C3%A9e_du_couvent_Sainte-Catherine", "it": "https://it.wikipedia.org/wiki/Museo_Catharijneconvent"}, "image": {"file": "Catharijneconvent Utrecht.jpg", "local": "/travel/map-assets/1528871692/museum-catharijneconvent.jpg", "author": "FaceMePLS", "license": "CC BY 2.0", "license_url": "https://creativecommons.org/licenses/by/2.0", "source": "https://commons.wikimedia.org/wiki/File:Catharijneconvent_Utrecht.jpg"}}, {"id": "museum-speelklok", "category": "museum", "in_episode": false, "names": {"en": "Museum Speelklok", "de": "Museum Speelklok", "nl": "Museum Speelklok", "fr": "Museum Speelklok", "es": "Museum Speelklok", "it": "Museum Speelklok"}, "texts": {"en": "Museum Speelklok collects self-playing musical instruments, from tiny music boxes and musical clocks to large Dutch street organs. It grew out of an exhibition held in Utrecht in 1956 and has been housed since 1984 in the medieval Buurkerk. Most of the instruments still play for visitors.", "de": "Das Museum Speelklok sammelt selbstspielende Musikinstrumente, von winzigen Spieldosen und Musikuhren bis zu großen niederländischen Drehorgeln. Es ging aus einer Ausstellung in Utrecht im Jahr 1956 hervor und befindet sich seit 1984 in der mittelalterlichen Buurkerk. Die meisten Instrumente spielen noch für die Besucher.", "nl": "Museum Speelklok verzamelt zelfspelende muziekinstrumenten, van piepkleine speeldozen en speelklokken tot grote Nederlandse straatorgels. Het museum groeide uit een tentoonstelling in Utrecht in 1956 en is sinds 1984 gevestigd in de middeleeuwse Buurkerk. De meeste instrumenten spelen nog voor bezoekers.", "fr": "Le Museum Speelklok rassemble des instruments de musique automatiques, des minuscules boîtes à musique et horloges musicales aux grands orgues de rue néerlandais. Né d'une exposition organisée à Utrecht en 1956, il est installé depuis 1984 dans la Buurkerk médiévale. La plupart des instruments jouent encore pour les visiteurs.", "es": "El Museum Speelklok reúne instrumentos musicales automáticos, desde diminutas cajas de música y relojes musicales hasta grandes organillos callejeros neerlandeses. Nació de una exposición celebrada en Utrecht en 1956 y desde 1984 ocupa la Buurkerk, una iglesia medieval. La mayoría de los instrumentos todavía suenan para los visitantes.", "it": "Il Museum Speelklok raccoglie strumenti musicali automatici, dai minuscoli carillon e orologi musicali ai grandi organi di strada olandesi. Nato da una mostra tenuta a Utrecht nel 1956, dal 1984 ha sede nella Buurkerk, una chiesa medievale. La maggior parte degli strumenti suona ancora per i visitatori."}, "status": null, "lat": 52.090292, "lon": 5.118899, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Museum_Speelklok", "de": "https://de.wikipedia.org/wiki/Museum_Speelklok", "nl": "https://nl.wikipedia.org/wiki/Museum_Speelklok", "fr": "https://fr.wikipedia.org/wiki/Museum_Speelklok", "it": "https://it.wikipedia.org/wiki/Museum_Speelklok"}, "image": {"file": "Buurkerk en Dom.jpg", "local": "/travel/map-assets/1528871692/museum-speelklok.jpg", "author": "Victor van Werkhooven", "license": "CC BY-SA 3.0", "license_url": "http://creativecommons.org/licenses/by-sa/3.0/", "source": "https://commons.wikimedia.org/wiki/File:Buurkerk_en_Dom.jpg"}}, {"id": "spoorwegmuseum", "category": "museum", "in_episode": false, "names": {"en": "Railway Museum (Spoorwegmuseum)", "de": "Eisenbahnmuseum (Spoorwegmuseum)", "nl": "Het Spoorwegmuseum", "fr": "Musée des chemins de fer (Spoorwegmuseum)", "es": "Museo del Ferrocarril (Spoorwegmuseum)", "it": "Museo ferroviario (Spoorwegmuseum)"}, "texts": {"en": "The Dutch national railway museum was founded in 1927 and has been housed since 1954 in the former Maliebaan station. In and around the old station you see historic locomotives, carriages and trams, alongside exhibitions and rides that show how trains changed the world.", "de": "Das niederländische Eisenbahnmuseum wurde 1927 gegründet und befindet sich seit 1954 im ehemaligen Bahnhof Maliebaan. In und um den alten Bahnhof stehen historische Lokomotiven, Wagen und Straßenbahnen, dazu Ausstellungen und Attraktionen, die zeigen, wie die Eisenbahn die Welt veränderte.", "nl": "Het nationale spoorwegmuseum van Nederland werd in 1927 opgericht en zit sinds 1954 in het voormalige Maliebaanstation. In en rond het oude station staan historische locomotieven, rijtuigen en trams, met tentoonstellingen en attracties die laten zien hoe de trein de wereld veranderde.", "fr": "Le musée national des chemins de fer néerlandais, fondé en 1927, occupe depuis 1954 l'ancienne gare de Maliebaan. Dans et autour de la vieille gare, on découvre des locomotives, des voitures et des tramways historiques, ainsi que des expositions et des attractions qui montrent comment le train a changé le monde.", "es": "El museo nacional del ferrocarril neerlandés se fundó en 1927 y desde 1954 ocupa la antigua estación de Maliebaan. Dentro y alrededor de la vieja estación hay locomotoras, vagones y tranvías históricos, además de exposiciones y atracciones que muestran cómo el tren cambió el mundo.", "it": "Il museo ferroviario nazionale olandese fu fondato nel 1927 e dal 1954 ha sede nell'ex stazione di Maliebaan. Dentro e intorno alla vecchia stazione si vedono locomotive, carrozze e tram storici, oltre a mostre e attrazioni che raccontano come il treno ha cambiato il mondo."}, "status": null, "lat": 52.087778, "lon": 5.131667, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Railway_Museum_%28Netherlands%29", "de": "https://de.wikipedia.org/wiki/Nederlands_Spoorwegmuseum", "nl": "https://nl.wikipedia.org/wiki/Spoorwegmuseum_%28Utrecht%29", "fr": "https://fr.wikipedia.org/wiki/Nederlands_Spoorwegmuseum"}, "image": {"file": "Spoorwegmuseum Utrecht 003.JPG", "local": "/travel/map-assets/1528871692/spoorwegmuseum.jpg", "author": "Marion Golsteijn", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Spoorwegmuseum_Utrecht_003.JPG"}}, {"id": "pieterskerk", "category": "landmark", "in_episode": false, "names": {"en": "St Peter's Church (Pieterskerk)", "de": "Peterskirche (Pieterskerk)", "nl": "Pieterskerk", "fr": "Église Saint-Pierre (Pieterskerk)", "es": "Iglesia de San Pedro (Pieterskerk)", "it": "Chiesa di San Pietro (Pieterskerk)"}, "texts": {"en": "Bishop Bernold consecrated the Pieterskerk on 1 May 1048, making it one of Utrecht's oldest churches. Its Romanesque nave rests on columns each cut from one block of red sandstone, and a crypt lies under the choir. It was the eastern end of the 'church cross' around the Dom and is now used by the Walloon Church.", "de": "Bischof Bernold weihte die Pieterskerk am 1. Mai 1048; sie zählt zu den ältesten Kirchen Utrechts. Das romanische Langhaus ruht auf Säulen aus je einem Block roten Sandsteins, unter dem Chor liegt eine Krypta. Sie bildete das östliche Ende des „Kirchenkreuzes“ um den Dom und wird heute von der Wallonischen Kirche genutzt.", "nl": "Bisschop Bernold wijdde de Pieterskerk in op 1 mei 1048; het is een van de oudste kerken van Utrecht. Het romaanse schip rust op zuilen van telkens één blok rode zandsteen, en onder het koor ligt een crypte. De kerk vormde het oostelijke eind van het kerkenkruis rond de Dom en wordt nu gebruikt door de Waalse Kerk.", "fr": "L'évêque Bernold consacra la Pieterskerk le 1er mai 1048 : c'est l'une des plus anciennes églises d'Utrecht. Sa nef romane repose sur des colonnes taillées chacune dans un bloc de grès rouge, et une crypte s'étend sous le chœur. Extrémité est de la « croix d'églises » autour de la cathédrale, elle sert aujourd'hui à l'Église wallonne.", "es": "El obispo Bernold consagró la Pieterskerk el 1 de mayo de 1048: es una de las iglesias más antiguas de Utrecht. Su nave románica se apoya en columnas de un solo bloque de arenisca roja, y bajo el coro hay una cripta. Cerraba por el este la «cruz de iglesias» de la catedral y hoy la usa la Iglesia valona.", "it": "Il vescovo Bernold consacrò la Pieterskerk il 1° maggio 1048: è una delle chiese più antiche di Utrecht. La navata romanica poggia su colonne ricavate ciascuna da un blocco di arenaria rossa, e sotto il coro c'è una cripta. Era l'estremità orientale della «croce di chiese» intorno al Duomo e oggi è usata dalla Chiesa vallona."}, "status": null, "lat": 52.091389, "lon": 5.124444, "wikipedia": {"en": "https://en.wikipedia.org/wiki/St._Peter%27s_Church%2C_Utrecht", "de": "https://de.wikipedia.org/wiki/Pieterskerk_%28Utrecht%29", "nl": "https://nl.wikipedia.org/wiki/Pieterskerk_%28Utrecht%29"}, "image": {"file": "18297-Pieterskerk.JPG", "local": "/travel/map-assets/1528871692/pieterskerk.jpg", "author": "Michielderoo", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:18297-Pieterskerk.JPG"}}]}, UI={"en": {"read": "Read aloud", "stop": "Stop", "ep": "In the episode", "also": "Also worth seeing", "wiki": "Wikipedia", "photo": "Photo", "close": "Close", "listen": "Listen to the episode", "list": "All highlights", "title": "{city} map: highlights", "noaudio": "Read aloud is not supported on this device."}, "de": {"read": "Vorlesen", "stop": "Stopp", "ep": "In der Folge", "also": "Auch sehenswert", "wiki": "Wikipedia", "photo": "Foto", "close": "Schließen", "listen": "Folge anhören", "list": "Alle Highlights", "title": "{city} Karte: Sehenswürdigkeiten", "noaudio": "Vorlesen wird auf diesem Gerät nicht unterstützt."}, "nl": {"read": "Voorlezen", "stop": "Stop", "ep": "In de aflevering", "also": "Ook de moeite waard", "wiki": "Wikipedia", "photo": "Foto", "close": "Sluiten", "listen": "Luister de aflevering", "list": "Alle hoogtepunten", "title": "{city} kaart: hoogtepunten", "noaudio": "Voorlezen wordt op dit apparaat niet ondersteund."}, "fr": {"read": "Lire à voix haute", "stop": "Arrêter", "ep": "Dans l'épisode", "also": "À voir aussi", "wiki": "Wikipédia", "photo": "Photo", "close": "Fermer", "listen": "Écouter l'épisode", "list": "Tous les lieux", "title": "{city} carte : lieux à voir", "noaudio": "La lecture à voix haute n'est pas disponible sur cet appareil."}, "es": {"read": "Leer en voz alta", "stop": "Parar", "ep": "En el episodio", "also": "También merece la pena", "wiki": "Wikipedia", "photo": "Foto", "close": "Cerrar", "listen": "Escuchar el episodio", "list": "Todos los lugares", "title": "{city} mapa: lugares destacados", "noaudio": "La lectura en voz alta no está disponible en este dispositivo."}, "it": {"read": "Leggi ad alta voce", "stop": "Stop", "ep": "Nell'episodio", "also": "Da vedere anche", "wiki": "Wikipedia", "photo": "Foto", "close": "Chiudi", "listen": "Ascolta l'episodio", "list": "Tutti i luoghi", "title": "{city} mappa: luoghi da vedere", "noaudio": "La lettura ad alta voce non è disponibile su questo dispositivo."}}, CATS={"landmark": ["#0f6e6e", "★", {"en": "Landmark", "de": "Bauwerk", "nl": "Bezienswaardigheid", "fr": "Monument", "es": "Monumento", "it": "Monumento"}], "museum": ["#8a3fb0", "M", {"en": "Museum", "de": "Museum", "nl": "Museum", "fr": "Musée", "es": "Museo", "it": "Museo"}], "history": ["#b5542a", "H", {"en": "History", "de": "Geschichte", "nl": "Geschiedenis", "fr": "Histoire", "es": "Historia", "it": "Storia"}], "viewpoint": ["#2f6db5", "V", {"en": "Viewpoint", "de": "Aussicht", "nl": "Uitzicht", "fr": "Point de vue", "es": "Mirador", "it": "Panorama"}], "market": ["#c08a00", "€", {"en": "Market", "de": "Markt", "nl": "Markt", "fr": "Marché", "es": "Mercado", "it": "Mercato"}], "nature": ["#3f8a3f", "♣", {"en": "Nature", "de": "Natur", "nl": "Natuur", "fr": "Nature", "es": "Naturaleza", "it": "Natura"}], "station": ["#444444", "🚆", {"en": "Station", "de": "Bahnhof", "nl": "Station", "fr": "Gare", "es": "Estación", "it": "Stazione"}]}, SPEECH={"en": "en-GB", "de": "de-DE", "nl": "nl-NL", "fr": "fr-FR", "es": "es-ES", "it": "it-IT"}, LANGS={"en": "English", "de": "Deutsch", "nl": "Nederlands", "fr": "Français", "es": "Español", "it": "Italiano"};
const sel=document.getElementById('lang');
for(const[k,v]of Object.entries(LANGS)){const o=document.createElement('option');o.value=k;o.textContent=v;sel.appendChild(o)}
const q=new URLSearchParams(location.search);let L=q.get('lang')||(navigator.language||'en').slice(0,2);if(!LANGS[L])L='en';sel.value=L;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts=D.highlights.filter(h=>h.lat);
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',attributionControl:{compact:true}});
const b=new maplibregl.LngLatBounds();pts.forEach(h=>b.extend([h.lon,h.lat]));map.fitBounds(b,{padding:50,maxZoom:16,duration:0});
map.addControl(new maplibregl.NavigationControl({showCompass:false}));
map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}));
pts.forEach(h=>{const c=CATS[h.category]||CATS.landmark;const el=document.createElement('div');el.className='pin'+(h.in_episode?'':' also');
 el.style.background=c[0];el.textContent=c[1];el.title=h.names[L]||h.names.en;el.onclick=()=>show(h);
 new maplibregl.Marker({element:el}).setLngLat([h.lon,h.lat]).addTo(map);h._el=el});
function speak(text,btn){if(!('speechSynthesis'in window)){alert(UI[L].noaudio);return}
 if(speechSynthesis.speaking){speechSynthesis.cancel();btn.textContent='🔊 '+UI[L].read;return}
 const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH[L];const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(L));if(v)u.voice=v;
 u.onend=()=>btn.textContent='🔊 '+UI[L].read;btn.textContent='■ '+UI[L].stop;speechSynthesis.speak(u)}
function show(h){const u=UI[L],c=CATS[h.category]||CATS.landmark,name=h.names[L]||h.names.en,text=h.texts[L]||h.texts.en;
 if('speechSynthesis'in window)speechSynthesis.cancel();
 let s='';if(h.image)s+=`<img src="${h.image.local}" alt="${esc(name)}"><div class="credit">${u.photo}: ${esc(h.image.author)}, <a href="${h.image.license_url||h.image.source}">${esc(h.image.license)}</a>, <a href="${h.image.source}">Wikimedia Commons</a></div>`;
 s+=`<h2>${esc(name)}</h2><div class="badges"><span class="chip">${esc(c[2][L]||c[2].en)}</span> <span class="chip">${h.in_episode?u.ep:u.also}</span></div>`;
 if(h.status)s+=`<div class="status">${esc(h.status[L]||h.status.en)}</div>`;
 s+=`<p>${esc(text)}</p><div class="row"><button class="btn" id="rd">🔊 ${u.read}</button>`;
 const w=h.wikipedia&&(h.wikipedia[L]||h.wikipedia.en||h.wikipedia.nl);if(w)s+=`<a class="btn" href="${w}" target="_blank" rel="noopener">${u.wiki}</a>`;
 if(h.in_episode)s+=`<a class="btn" href="/travel/netherlands/utrecht/#${L}">${u.listen}</a>`;s+='</div>';
 document.getElementById('cc').innerHTML=s;document.getElementById('rd').onclick=e=>speak(name+'. '+text,e.target);
 document.getElementById('card').classList.add('open');map.easeTo({center:[h.lon,h.lat],offset:[0,-120],duration:400})}
document.getElementById('x').onclick=()=>{document.getElementById('card').classList.remove('open');if('speechSynthesis'in window)speechSynthesis.cancel()};
function render(){const u=UI[L];document.documentElement.lang=L;document.getElementById('h1').textContent=u.title.replace('{city}',D.city);
 document.getElementById('ep').textContent='🎧 '+u.listen;document.getElementById('lh').textContent=u.list;
 document.getElementById('legend').innerHTML=Object.values(CATS).filter(c=>pts.some(h=>CATS[h.category]===c)).map(c=>`<span style="background:${c[0]}"></span>${esc(c[2][L])}`).join('');
 const ol=document.getElementById('items');ol.innerHTML='';pts.forEach(h=>{const li=document.createElement('li');li.textContent=(h.names[L]||h.names.en)+(h.in_episode?'':' · '+u.also);li.onclick=()=>{show(h);window.scrollTo({top:0,behavior:'smooth'})};ol.appendChild(li);if(h._el)h._el.title=h.names[L]||h.names.en})}
sel.onchange=()=>{L=sel.value;render();document.getElementById('card').classList.remove('open')};render();
</script>
