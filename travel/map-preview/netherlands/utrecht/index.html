n": 5.124167, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Museum_Catharijneconvent", "de": "https://de.wikipedia.org/wiki/Museum_Catharijneconvent", "nl": "https://nl.wikipedia.org/wiki/Museum_Catharijneconvent", "fr": "https://fr.wikipedia.org/wiki/Mus%C3%A9e_du_couvent_Sainte-Catherine", "it": "https://it.wikipedia.org/wiki/Museo_Catharijneconvent"}, "image": {"file": "Catharijneconvent Utrecht.jpg", "local": "/travel/map-assets/1528871692/museum-catharijneconvent.jpg", "author": "FaceMePLS", "license": "CC BY 2.0", "license_url": "https://creativecommons.org/licenses/by/2.0", "source": "https://commons.wikimedia.org/wiki/File:Catharijneconvent_Utrecht.jpg"}, "mini": "/travel/map-assets/1528871692/mini/museum-catharijneconvent.jpg", "mini_source": {"file": "Lange Nieuwstraat, Utrecht, Netherlands - panoramio (38).jpg", "author": "Ben Bender", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Lange_Nieuwstraat,_Utrecht,_Netherlands_-_panoramio_(38).jpg"}, "episode": {}}, {"id": "catharijnekathedraal", "category": "landmark", "top": null, "names": {"en": "St Catherine's Cathedral (Catharijnekerk)", "de": "St.-Katharinen-Kathedrale (Catharijnekerk)", "nl": "Sint-Catharinakathedraal", "fr": "Cathédrale Sainte-Catherine (Catharijnekerk)", "es": "Catedral de Santa Catalina (Catharijnekerk)", "it": "Cattedrale di Santa Caterina (Catharijnekerk)"}, "texts": {"en": "St Catherine's Cathedral was built as the church of a Carmelite friary founded in 1456 and completed by the Knights Hospitallers in the mid-16th century. Protestant from 1580, it returned to the Catholics in 1815 and has been the cathedral of the Archdiocese of Utrecht since 1853, the Catholic metropolitan church of the Netherlands. Its tower was added in 1900.", "de": "Die St.-Katharinen-Kathedrale entstand als Kirche eines 1456 gegründeten Karmeliterklosters und wurde Mitte des 16. Jahrhunderts von den Johannitern vollendet. Ab 1580 protestantisch, kam sie 1815 an die Katholiken zurück und ist seit 1853 Kathedrale des Erzbistums Utrecht, die katholische Metropolitankirche der Niederlande. Ihr Turm kam 1900 hinzu.", "nl": "De Sint-Catharinakathedraal werd gebouwd als kerk van een in 1456 gesticht karmelietenklooster en halverwege de 16e eeuw voltooid door de Johannieters. Vanaf 1580 was ze protestants; in 1815 kwam ze terug bij de katholieken en sinds 1853 is ze de kathedraal van het aartsbisdom Utrecht, de katholieke metropolitane kerk van Nederland. De toren kwam er in 1900 bij.", "fr": "La cathédrale Sainte-Catherine fut bâtie comme église d'un couvent de carmes fondé en 1456, puis achevée par les Hospitaliers au milieu du XVIe siècle. Protestante dès 1580, elle revint aux catholiques en 1815 et est depuis 1853 la cathédrale de l'archidiocèse d'Utrecht, église métropolitaine catholique des Pays-Bas. Sa tour fut ajoutée en 1900.", "es": "La catedral de Santa Catalina se construyó como iglesia de un convento carmelita fundado en 1456 y la terminaron los caballeros hospitalarios a mediados del siglo XVI. Protestante desde 1580, volvió a los católicos en 1815 y desde 1853 es la catedral de la archidiócesis de Utrecht, iglesia metropolitana católica de los Países Bajos. Su torre se añadió en 1900.", "it": "La cattedrale di Santa Caterina nacque come chiesa di un convento carmelitano fondato nel 1456 e fu completata dai Cavalieri Ospitalieri a metà del XVI secolo. Protestante dal 1580, tornò ai cattolici nel 1815 ed è dal 1853 la cattedrale dell'arcidiocesi di Utrecht, chiesa metropolitana cattolica dei Paesi Bassi. La torre fu aggiunta nel 1900."}, "status": null, "lat": 52.0875, "lon": 5.124167, "wikipedia": {"en": "https://en.wikipedia.org/wiki/St_Catherine%27s_Cathedral%2C_Utrecht", "de": "https://de.wikipedia.org/wiki/St.-Katharinen-Kathedrale_%28Utrecht%29", "nl": "https://nl.wikipedia.org/wiki/Sint-Catharinakathedraal", "fr": "https://fr.wikipedia.org/wiki/Cath%C3%A9drale_Sainte-Catherine_d%27Utrecht", "es": "https://es.wikipedia.org/wiki/Catedral_de_Santa_Catalina_%28Utrecht%29", "it": "https://it.wikipedia.org/wiki/Cattedrale_di_Santa_Caterina_%28Utrecht%29"}, "image": {"file": "Utrecht - Sint Catharinakathedraal RM36264.JPG", "local": "/travel/map-assets/1528871692/catharijnekathedraal.jpg", "author": "HenkvD", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_-_Sint_Catharinakathedraal_RM36264.JPG"}, "mini": "/travel/map-assets/1528871692/mini/catharijnekathedraal.jpg", "mini_source": {"file": "Utrecht - Sint Catharinakathedraal RM36264.JPG", "author": "HenkvD", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Utrecht_-_Sint_Catharinakathedraal_RM36264.JPG"}, "episode": {}}, {"id": "spoorwegmuseum", "category": "museum", "top": 6, "names": {"en": "Railway Museum (Spoorwegmuseum)", "de": "Eisenbahnmuseum (Spoorwegmuseum)", "nl": "Het Spoorwegmuseum", "fr": "Musée des chemins de fer (Spoorwegmuseum)", "es": "Museo del Ferrocarril (Spoorwegmuseum)", "it": "Museo ferroviario (Spoorwegmuseum)"}, "texts": {"en": "The Dutch national railway museum was founded in 1927 and has been housed since 1954 in the former Maliebaan station. In and around the old station you see historic locomotives, carriages and trams, alongside exhibitions and rides that show how trains changed the world.", "de": "Das niederländische Eisenbahnmuseum wurde 1927 gegründet und befindet sich seit 1954 im ehemaligen Bahnhof Maliebaan. In und um den alten Bahnhof stehen historische Lokomotiven, Wagen und Straßenbahnen, dazu Ausstellungen und Attraktionen, die zeigen, wie die Eisenbahn die Welt veränderte.", "nl": "Het nationale spoorwegmuseum van Nederland werd in 1927 opgericht en zit sinds 1954 in het voormalige Maliebaanstation. In en rond het oude station staan historische locomotieven, rijtuigen en trams, met tentoonstellingen en attracties die laten zien hoe de trein de wereld veranderde.", "fr": "Le musée national des chemins de fer néerlandais, fondé en 1927, occupe depuis 1954 l'ancienne gare de Maliebaan. Dans et autour de la vieille gare, on découvre des locomotives, des voitures et des tramways historiques, ainsi que des expositions et des attractions qui montrent comment le train a changé le monde.", "es": "El museo nacional del ferrocarril neerlandés se fundó en 1927 y desde 1954 ocupa la antigua estación de Maliebaan. Dentro y alrededor de la vieja estación hay locomotoras, vagones y tranvías históricos, además de exposiciones y atracciones que muestran cómo el tren cambió el mundo.", "it": "Il museo ferroviario nazionale olandese fu fondato nel 1927 e dal 1954 ha sede nell'ex stazione di Maliebaan. Dentro e intorno alla vecchia stazione si vedono locomotive, carrozze e tram storici, oltre a mostre e attrazioni che raccontano come il treno ha cambiato il mondo."}, "status": null, "lat": 52.087778, "lon": 5.131667, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Railway_Museum_%28Netherlands%29", "de": "https://de.wikipedia.org/wiki/Nederlands_Spoorwegmuseum", "nl": "https://nl.wikipedia.org/wiki/Spoorwegmuseum_%28Utrecht%29", "fr": "https://fr.wikipedia.org/wiki/Nederlands_Spoorwegmuseum"}, "image": {"file": "Spoorwegmuseum Utrecht 003.JPG", "local": "/travel/map-assets/1528871692/spoorwegmuseum.jpg", "author": "Marion Golsteijn", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Spoorwegmuseum_Utrecht_003.JPG"}, "mini": "/travel/map-assets/1528871692/mini/spoorwegmuseum.jpg", "mini_source": {"file": "Spoorwegmuseum Utrecht 003.JPG", "author": "Marion Golsteijn", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:Spoorwegmuseum_Utrecht_003.JPG"}, "episode": {"nl": true, "fr": true, "es": true}}, {"id": "rietveld-schroderhuis", "category": "landmark", "top": 5, "names": {"en": "Rietveld Schröder House (Rietveld Schröderhuis)", "de": "Rietveld-Schröder-Haus (Rietveld Schröderhuis)", "nl": "Rietveld Schröderhuis", "fr": "Maison Rietveld Schröder (Rietveld Schröderhuis)", "es": "Casa Rietveld Schröder (Rietveld Schröderhuis)", "it": "Casa Rietveld Schröder (Rietveld Schröderhuis)"}, "texts": {"en": "Gerrit Rietveld designed this house in 1924 with Truus Schröder, who lived here until her death in 1985. A key work of De Stijl, it has primary colours, straight lines and an upper floor divided by sliding panels instead of fixed walls. A UNESCO World Heritage Site since 2000, it can only be visited with a booked time slot.", "de": "Gerrit Rietveld entwarf dieses Haus 1924 zusammen mit Truus Schröder, die bis zu ihrem Tod 1985 hier lebte. Es ist ein Hauptwerk von De Stijl, mit Primärfarben, geraden Linien und einem Obergeschoss, das statt fester Wände durch Schiebewände geteilt wird. Das Haus ist seit 2000 UNESCO-Welterbe und nur mit gebuchtem Zeitfenster zu besichtigen.", "nl": "Gerrit Rietveld ontwierp dit huis in 1924 samen met Truus Schröder, die er tot haar dood in 1985 woonde. Het is een sleutelwerk van De Stijl, met primaire kleuren, rechte lijnen en een bovenverdieping die met schuifwanden in plaats van vaste muren wordt ingedeeld. Het huis is sinds 2000 UNESCO-werelderfgoed en alleen te bezoeken met een gereserveerd tijdslot.", "fr": "Gerrit Rietveld a conçu cette maison en 1924 avec Truus Schröder, qui y vécut jusqu'à sa mort en 1985. Œuvre clé de De Stijl, elle associe couleurs primaires, lignes droites et un étage divisé par des cloisons coulissantes au lieu de murs fixes. Inscrite au patrimoine mondial de l'UNESCO depuis 2000, elle se visite uniquement sur réservation.", "es": "Gerrit Rietveld diseñó esta casa en 1924 junto con Truus Schröder, que vivió en ella hasta su muerte en 1985. Es una obra clave de De Stijl, con colores primarios, líneas rectas y una planta alta dividida por paneles correderos en lugar de muros fijos. Patrimonio Mundial de la UNESCO desde 2000, solo se puede visitar reservando un horario.", "it": "Gerrit Rietveld progettò questa casa nel 1924 insieme a Truus Schröder, che vi abitò fino alla morte nel 1985. È un'opera chiave di De Stijl, con colori primari, linee rette e un piano superiore diviso da pannelli scorrevoli invece che da muri fissi. Patrimonio mondiale dell'UNESCO dal 2000, si visita solo prenotando una fascia oraria."}, "status": null, "lat": 52.085333, "lon": 5.147597, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Rietveld_Schr%C3%B6der_House", "de": "https://de.wikipedia.org/wiki/Rietveld-Schr%C3%B6der-Haus", "nl": "https://nl.wikipedia.org/wiki/Rietveld_Schr%C3%B6derhuis", "fr": "https://fr.wikipedia.org/wiki/Maison_Schr%C3%B6der_de_Rietveld", "es": "https://es.wikipedia.org/wiki/Casa_Rietveld_Schr%C3%B6der", "it": "https://it.wikipedia.org/wiki/Casa_Rietveld_Schr%C3%B6der"}, "image": {"file": "Rietveld Schröderhuis HayKranen-20.JPG", "local": "/travel/map-assets/1528871692/rietveld-schroderhuis.jpg", "author": "User:Husky", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Rietveld_Schr%C3%B6derhuis_HayKranen-20.JPG"}, "mini": "/travel/map-assets/1528871692/mini/rietveld-schroderhuis.jpg", "mini_source": {"file": "Rietveld Schröderhuis HayKranen-20.JPG", "author": "User:Husky", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Rietveld_Schr%C3%B6derhuis_HayKranen-20.JPG"}, "episode": {"en": true, "de": true, "nl": true, "fr": true, "es": true, "it": true}}, {"id": "botanische-tuinen", "category": "nature", "top": null, "names": {"en": "Utrecht University Botanic Gardens (Fort Hoofddijk)", "de": "Botanische Gärten der Universität Utrecht (Fort Hoofddijk)", "nl": "Botanische Tuinen Universiteit Utrecht", "fr": "Jardins botaniques de l'université d'Utrecht (Fort Hoofddijk)", "es": "Jardines Botánicos de la Universidad de Utrecht (Fort Hoofddijk)", "it": "Orti botanici dell'Università di Utrecht (Fort Hoofddijk)"}, "texts": {"en": "Utrecht University's main botanic garden lies at Fort Hoofddijk, a fort of the New Dutch Waterline on the Utrecht Science Park campus. The university acquired the land in 1963 and built one of Europe's largest rock gardens there, partly with rocks from the Ardennes. The greenhouses include a butterfly house, added in 2019.", "de": "Der wichtigste botanische Garten der Universität Utrecht liegt im Fort Hoofddijk, einer Festung der Neuen Holländischen Wasserlinie auf dem Campus Utrecht Science Park. Die Universität erwarb das Gelände 1963 und legte dort einen der größten Steingärten Europas an, zum Teil mit Felsen aus den Ardennen. Zu den Gewächshäusern gehört seit 2019 ein Schmetterlingshaus.", "nl": "De belangrijkste botanische tuin van de Universiteit Utrecht ligt bij Fort Hoofddijk, een fort van de Nieuwe Hollandse Waterlinie op het Utrecht Science Park. De universiteit verwierf de grond in 1963 en legde er een van de grootste rotstuinen van Europa aan, deels met rotsen uit de Ardennen. Bij de kassen hoort sinds 2019 een vlindertuin.", "fr": "Le principal jardin botanique de l'université d'Utrecht se trouve au Fort Hoofddijk, un fort de la Nouvelle ligne de défense hollandaise sur le campus Utrecht Science Park. L'université acquit le terrain en 1963 et y aménagea l'un des plus grands jardins de rocaille d'Europe, en partie avec des roches des Ardennes. Les serres comprennent une maison aux papillons depuis 2019.", "es": "El principal jardín botánico de la Universidad de Utrecht está en el Fort Hoofddijk, un fuerte de la Nueva Línea de Agua Holandesa en el campus Utrecht Science Park. La universidad adquirió el terreno en 1963 y creó allí uno de los mayores jardines de rocas de Europa, en parte con rocas de las Ardenas. Los invernaderos incluyen un mariposario desde 2019.", "it": "Il principale orto botanico dell'Università di Utrecht si trova a Fort Hoofddijk, un forte della Nuova linea d'acqua olandese nel campus Utrecht Science Park. L'università acquistò il terreno nel 1963 e vi creò uno dei più grandi giardini rocciosi d'Europa, in parte con rocce delle Ardenne. Le serre comprendono dal 2019 una casa delle farfalle."}, "status": null, "lat": 52.0883, "lon": 5.1725, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Utrecht_University_Botanic_Gardens", "nl": "https://nl.wikipedia.org/wiki/Botanische_Tuinen_Universiteit_Utrecht", "es": "https://es.wikipedia.org/wiki/Jard%C3%ADn_Bot%C3%A1nico_de_la_Universidad_de_Utrecht"}, "image": {"file": "FortHoofddijk01.jpg", "local": "/travel/map-assets/1528871692/botanische-tuinen.jpg", "author": "unknown", "license": "CC BY-SA 2.5 nl", "license_url": "https://creativecommons.org/licenses/by-sa/2.5/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:FortHoofddijk01.jpg"}, "mini": "/travel/map-assets/1528871692/mini/botanische-tuinen.jpg", "mini_source": {"file": "FortHoofddijk01.jpg", "author": "unknown", "license": "CC BY-SA 2.5 nl", "license_url": "https://creativecommons.org/licenses/by-sa/2.5/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:FortHoofddijk01.jpg"}, "episode": {}}, {"id": "molen-rijn-en-zon", "category": "landmark", "top": null, "names": {"en": "Rijn en Zon windmill", "de": "Windmühle Rijn en Zon", "nl": "Molen Rijn en Zon", "fr": "Moulin Rijn en Zon", "es": "Molino Rijn en Zon", "it": "Mulino Rijn en Zon"}, "texts": {"en": "Rijn en Zon is a brick corn mill built in 1913 in the Vogelenbuurt, replacing a mill of the same name on the city ramparts. About 32 metres to the top of its cap, it is among the five tallest windmills in the Netherlands. After a long restoration it has been working again since 2020.", "de": "Rijn en Zon ist eine Getreidemühle aus Backstein, 1913 in der Vogelenbuurt als Ersatz für eine gleichnamige Mühle auf dem Stadtwall errichtet. Mit rund 32 Metern bis zur Kappe gehört sie zu den fünf höchsten Windmühlen der Niederlande. Nach langer Restaurierung ist sie seit 2020 wieder in Betrieb.", "nl": "Rijn en Zon is een stenen korenmolen uit 1913 in de Vogelenbuurt, als opvolger van een gelijknamige molen op de stadswal. Met zo'n 32 meter tot de top van de kap hoort hij bij de vijf hoogste molens van Nederland. Na een lange restauratie draait hij sinds 2020 weer.", "fr": "Rijn en Zon est un moulin à grain en brique construit en 1913 dans le Vogelenbuurt, pour remplacer un moulin du même nom sur les remparts. Avec environ 32 mètres jusqu'au sommet du toit, il compte parmi les cinq plus hauts moulins à vent des Pays-Bas. Après une longue restauration, il tourne de nouveau depuis 2020.", "es": "Rijn en Zon es un molino de grano de ladrillo construido en 1913 en el Vogelenbuurt, en sustitución de un molino del mismo nombre en la muralla. Con unos 32 metros hasta lo alto de su caperuza, está entre los cinco molinos de viento más altos de los Países Bajos. Tras una larga restauración, vuelve a funcionar desde 2020.", "it": "Rijn en Zon è un mulino per cereali in mattoni costruito nel 1913 nel Vogelenbuurt, al posto di un mulino omonimo sui bastioni della città. Con circa 32 metri fino alla cima del cappello, è tra i cinque mulini a vento più alti dei Paesi Bassi. Dopo un lungo restauro funziona di nuovo dal 2020."}, "status": null, "lat": 52.099167, "lon": 5.115556, "wikipedia": {"de": "https://de.wikipedia.org/wiki/Windm%C3%BChle_Rijn_en_Zon", "nl": "https://nl.wikipedia.org/wiki/Rijn_en_Zon"}, "image": {"file": "Rijn en Zon.jpg", "local": "/travel/map-assets/1528871692/molen-rijn-en-zon.jpg", "author": "Kattenkruid", "license": "CC BY 2.5", "license_url": "https://creativecommons.org/licenses/by/2.5", "source": "https://commons.wikimedia.org/wiki/File:Rijn_en_Zon.jpg"}, "mini": "/travel/map-assets/1528871692/mini/molen-rijn-en-zon.jpg", "mini_source": {"file": "Rijn en Zon.jpg", "author": "Kattenkruid", "license": "CC BY 2.5", "license_url": "https://creativecommons.org/licenses/by/2.5", "source": "https://commons.wikimedia.org/wiki/File:Rijn_en_Zon.jpg"}, "episode": {}}, {"id": "maximapark", "category": "nature", "top": null, "names": {"en": "Máximapark", "de": "Máximapark", "nl": "Máximapark", "fr": "Parc Máxima (Máximapark)", "es": "Parque Máxima (Máximapark)", "it": "Parco Máxima (Máximapark)"}, "texts": {"en": "Máximapark is a 300-hectare city park at the heart of Leidsche Rijn, Utrecht's large western expansion. First called Leidsche Rijn Park, it was renamed in 2011 in honour of Máxima, who officially opened it in 2013. An 8-kilometre car-free path, Het Lint, loops around the park, and the reconstructed Roman fort Castellum Hoge Woerd lies nearby in De Meern.", "de": "Der Máximapark ist ein 300 Hektar großer Stadtpark im Herzen von Leidsche Rijn, Utrechts großer Stadterweiterung im Westen. Zuerst Leidsche Rijn Park genannt, wurde er 2011 zu Ehren von Máxima umbenannt, die ihn 2013 offiziell eröffnete. Der 8 Kilometer lange autofreie Weg Het Lint führt rund um den Park; in De Meern liegt das rekonstruierte Römerkastell Hoge Woerd.", "nl": "Het Máximapark is een stadspark van 300 hectare in het hart van Leidsche Rijn, de grote westelijke stadsuitbreiding van Utrecht. Het heette eerst Leidsche Rijn Park en werd in 2011 vernoemd naar Máxima, die het in 2013 officieel opende. Het 8 kilometer lange autovrije pad Het Lint loopt rond het park; vlakbij in De Meern ligt het gereconstrueerde Castellum Hoge Woerd.", "fr": "Le Máximapark est un parc urbain de 300 hectares au cœur de Leidsche Rijn, la grande extension ouest d'Utrecht. Appelé d'abord Leidsche Rijn Park, il a été rebaptisé en 2011 en l'honneur de Máxima, qui l'a inauguré officiellement en 2013. Un chemin sans voitures de 8 km, Het Lint, en fait le tour, et le fort romain reconstitué Castellum Hoge Woerd se trouve tout près, à De Meern.", "es": "El Máximapark es un parque urbano de 300 hectáreas en el corazón de Leidsche Rijn, la gran expansión occidental de Utrecht. Llamado primero Leidsche Rijn Park, en 2011 recibió el nombre de Máxima, que lo inauguró oficialmente en 2013. Un camino sin coches de 8 km, Het Lint, lo rodea, y cerca, en De Meern, está el fuerte romano reconstruido Castellum Hoge Woerd.", "it": "Il Máximapark è un parco urbano di 300 ettari nel cuore di Leidsche Rijn, la grande espansione occidentale di Utrecht. Chiamato prima Leidsche Rijn Park, nel 2011 fu intitolato a Máxima, che lo inaugurò ufficialmente nel 2013. Un percorso di 8 km senza auto, Het Lint, gira attorno al parco, e vicino, a De Meern, sorge il forte romano ricostruito Castellum Hoge Woerd."}, "status": null, "lat": 52.100142, "lon": 5.024692, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/M%C3%A1ximapark", "es": "https://es.wikipedia.org/wiki/M%C3%A1ximapark"}, "image": {"file": "Parkrestaurant Anafora Máximapark.jpg", "local": "/travel/map-assets/1528871692/maximapark.jpg", "author": "Maurits90", "license": "CC0", "license_url": "http://creativecommons.org/publicdomain/zero/1.0/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Parkrestaurant_Anafora_M%C3%A1ximapark.jpg"}, "mini": "/travel/map-assets/1528871692/mini/maximapark.jpg", "mini_source": {"file": "Parkrestaurant Anafora Máximapark.jpg", "author": "Maurits90", "license": "CC0", "license_url": "http://creativecommons.org/publicdomain/zero/1.0/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Parkrestaurant_Anafora_M%C3%A1ximapark.jpg"}, "episode": {"en": true}}, {"id": "kasteel-de-haar", "category": "landmark", "top": 7, "names": {"en": "De Haar Castle (Kasteel de Haar)", "de": "Schloss De Haar (Kasteel de Haar)", "nl": "Kasteel de Haar", "fr": "Château de Haar (Kasteel de Haar)", "es": "Castillo de Haar (Kasteel de Haar)", "it": "Castello De Haar (Kasteel de Haar)"}, "texts": {"en": "De Haar is the largest castle in the Netherlands, in Haarzuilens on the western edge of Utrecht's municipality. Little more than a ruin by 1890, it was rebuilt from 1892 by architect Pierre Cuypers for Baron Etienne van Zuylen and Hélène de Rothschild. Visitors tour rooms on the ground and first floors and walk in the park and gardens.", "de": "De Haar ist das größte Schloss der Niederlande und liegt in Haarzuilens am westlichen Rand der Gemeinde Utrecht. Um 1890 kaum mehr als eine Ruine, wurde es ab 1892 vom Architekten Pierre Cuypers für Baron Etienne van Zuylen und Hélène de Rothschild neu aufgebaut. Besucher sehen Räume im Erd- und ersten Obergeschoss und den Park mit Gärten.", "nl": "De Haar is het grootste kasteel van Nederland, in Haarzuilens aan de westrand van de gemeente Utrecht. Rond 1890 was het weinig meer dan een ruïne; vanaf 1892 herbouwde architect Pierre Cuypers het voor baron Etienne van Zuylen en Hélène de Rothschild. Bezoekers zien zalen op de begane grond en eerste verdieping en wandelen door park en tuinen.", "fr": "De Haar est le plus grand château des Pays-Bas, à Haarzuilens, à l'extrémité ouest de la commune d'Utrecht. Presque en ruine en 1890, il fut reconstruit à partir de 1892 par l'architecte Pierre Cuypers pour le baron Etienne van Zuylen et Hélène de Rothschild. On visite des salles du rez-de-chaussée et du premier étage, ainsi que le parc et les jardins.", "es": "De Haar es el castillo más grande de los Países Bajos, en Haarzuilens, en el extremo oeste del municipio de Utrecht. Casi en ruinas en 1890, fue reconstruido desde 1892 por el arquitecto Pierre Cuypers para el barón Etienne van Zuylen y Hélène de Rothschild. Se visitan salas de la planta baja y del primer piso, además del parque y los jardines.", "it": "De Haar è il castello più grande dei Paesi Bassi, a Haarzuilens, all'estremità occidentale del comune di Utrecht. Ridotto quasi a un rudere nel 1890, fu ricostruito dal 1892 dall'architetto Pierre Cuypers per il barone Etienne van Zuylen e Hélène de Rothschild. Si visitano sale al piano terra e al primo piano, oltre al parco e ai giardini."}, "status": null, "lat": 52.121431, "lon": 4.986347, "wikipedia": {"en": "https://en.wikipedia.org/wiki/De_Haar_Castle", "de": "https://de.wikipedia.org/wiki/Kasteel_de_Haar", "nl": "https://nl.wikipedia.org/wiki/Kasteel_de_Haar", "fr": "https://fr.wikipedia.org/wiki/Ch%C3%A2teau_de_Haar", "es": "https://es.wikipedia.org/wiki/Castillo_de_Haar", "it": "https://it.wikipedia.org/wiki/Castello_De_Haar"}, "image": {"file": "De Haar castlle.jpg", "local": "/travel/map-assets/1528871692/kasteel-de-haar.jpg", "author": "Rafa.rivero", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:De_Haar_castlle.jpg"}, "mini": "/travel/map-assets/1528871692/mini/kasteel-de-haar.jpg", "mini_source": {"file": "De Haar castlle.jpg", "author": "Rafa.rivero", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0", "source": "https://commons.wikimedia.org/wiki/File:De_Haar_castlle.jpg"}, "episode": {}}]}, UI={"en": {"drawing": "Map icon drawn after", "read": "Read aloud", "stop": "Stop", "ep": "In the episode", "also": "Also worth seeing", "wiki": "Wikipedia", "photo": "Photo", "close": "Close", "listen": "Listen to the episode", "list": "All highlights", "all": "All", "top": "Top {n}", "topchip": "Top sight", "title": "{city} map: highlights", "noaudio": "Read aloud is not supported on this device."}, "de": {"drawing": "Kartensymbol gezeichnet nach", "read": "Vorlesen", "stop": "Stopp", "ep": "In der Folge", "also": "Auch sehenswert", "wiki": "Wikipedia", "photo": "Foto", "close": "Schließen", "listen": "Folge anhören", "list": "Alle Highlights", "all": "Alle", "top": "Top {n}", "topchip": "Top-Sehenswürdigkeit", "title": "{city} Karte: Sehenswürdigkeiten", "noaudio": "Vorlesen wird auf diesem Gerät nicht unterstützt."}, "nl": {"drawing": "Kaarticoon getekend const sel=document.getElementById('lang');
for(const[k,v]of Object.entries(LANGS)){const o=document.createElement('option');o.value=k;o.textContent=v;sel.appendChild(o)}
const q=new URLSearchParams(location.search);let L=q.get('lang')||(navigator.language||'en').slice(0,2);if(!LANGS[L])L='en';sel.value=L;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts=D.highlights.filter(h=>h.lat);
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',attributionControl:{compact:true}});
const b=new maplibregl.LngLatBounds();pts.forEach(h=>b.extend([h.lon,h.lat]));map.fitBounds(b,{padding:50,maxZoom:16,duration:0});
map.addControl(new maplibregl.NavigationControl({showCompass:false}));
const mapEl=document.getElementById('map');const zf=()=>mapEl.classList.toggle('far',map.getZoom()<14.3);map.on('zoom',zf);map.on('load',zf);
map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}));
const inEp=h=>!!(h.episode&&h.episode[L]);const tops=pts.filter(h=>h.top).sort((a,b)=>a.top-b.top);let F='all';
pts.forEach(h=>{const c=CATS[h.category]||CATS.landmark;const el=document.createElement('div');el.className='pin';
 if(h.mini){el.classList.add('mini');el.style.setProperty('--c',c[0]);el.style.backgroundImage=`url(${h.mini})`}
 else{el.style.background=c[0];el.textContent=c[1]}const bd=document.createElement('span');bd.className='b';bd.textContent='🎧';el.appendChild(bd);
 el.title=h.names[L]||h.names.en;el.onclick=()=>show(h);
 new maplibregl.Marker({element:el}).setLngLat([h.lon,h.lat]).addTo(map);h._el=el});
function speak(text,btn){if(!('speechSynthesis'in window)){alert(UI[L].noaudio);return}
 if(speechSynthesis.speaking){speechSynthesis.cancel();btn.textContent='🔊 '+UI[L].read;return}
 const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH[L];const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(L));if(v)u.voice=v;
 u.onend=()=>btn.textContent='🔊 '+UI[L].read;btn.textContent='■ '+UI[L].stop;speechSynthesis.speak(u)}
function show(h){const u=UI[L],c=CATS[h.category]||CATS.landmark,name=h.names[L]||h.names.en,text=h.texts[L]||h.texts.en;
 if('speechSynthesis'in window)speechSynthesis.cancel();
 let s='';if(h.image)s+=`<img src="${h.image.local}" alt="${esc(name)}"><div class="credit">${u.photo}: ${esc(h.image.author)}, <a href="${h.image.license_url||h.image.source}">${esc(h.image.license)}</a>, <a href="${h.image.source}">Wikimedia Commons</a></div>`;
 if(h.mini&&h.mini_source)s+=`<div class="credit">${u.drawing}: ${esc(h.mini_source.author)}, <a href="${h.mini_source.license_url||h.mini_source.source}">${esc(h.mini_source.license)}</a>, <a href="${h.mini_source.source}">Wikimedia Commons</a></div>`;
 s+=`<h2>${esc(name)}</h2><div class="badges"><span class="chip">${esc(c[2][L]||c[2].en)}</span> <span class="chip">${inEp(h)?'🎧 '+u.ep:u.also}</span>${h.top?` <span class="chip">⭐ ${u.topchip}</span>`:''}</div>`;
 if(h.status)s+=`<div class="status">${esc(h.status[L]||h.status.en)}</div>`;
 s+=`<p>${esc(text)}</p><div class="row"><button class="btn" id="rd">🔊 ${u.read}</button>`;
 const w=h.wikipedia&&(h.wikipedia[L]||h.wikipedia.en||h.wikipedia.nl);if(w)s+=`<a class="btn" href="${w}" target="_blank" rel="noopener">${u.wiki}</a>`;
 if(inEp(h))s+=`<a class="btn" href="/travel/netherlands/utrecht/#${L}">${u.listen}</a>`;s+='</div>';
 document.getElementById('cc').innerHTML=s;document.getElementById('rd').onclick=e=>speak(name+'. '+text,e.target);
 document.getElementById('card').classList.add('open');map.easeTo({center:[h.lon,h.lat],offset:[0,-120],duration:400})}
document.getElementById('x').onclick=()=>{document.getElementById('card').classList.remove('open');if('speechSynthesis'in window)speechSynthesis.cancel()};
function render(){const u=UI[L];document.documentElement.lang=L;document.getElementById('h1').textContent=u.title.replace('{city}',D.city);
 document.getElementById('ep').textContent='🎧 '+u.listen;document.getElementById('lh').textContent=u.list;
 document.getElementById('legend').innerHTML=Object.values(CATS).filter(c=>pts.some(h=>CATS[h.category]===c)).map(c=>`<span style="background:${c[0]}"></span>${esc(c[2][L])}`).join('');
 pts.forEach(h=>{h._el.classList.toggle('ep',inEp(h));h._el.title=h.names[L]||h.names.en});
 const fs=[['all',u.all+' ('+pts.length+')']];if(tops.length)fs.push(['top','⭐ '+u.top.replace('{n}',tops.length)]);
 const ne=pts.filter(inEp).length;if(ne)fs.push(['ep','🎧 '+u.ep+' ('+ne+')']);if(!fs.some(f=>f[0]===F))F='all';
 const fb=document.getElementById('filt');fb.innerHTML='';fs.forEach(([k,t])=>{const bt=document.createElement('button');bt.textContent=t;
  bt.className=k===F?'on':'';bt.setAttribute('aria-pressed',k===F);bt.onclick=()=>{F=k;render();fit()};fb.appendChild(bt)});
 const vis=h=>F==='all'||(F==='top'&&h.top)||(F==='ep'&&inEp(h));pts.forEach(h=>h._el.style.display=vis(h)?'':'none');
 document.getElementById('lh').textContent=F==='all'?u.list:fs.find(f=>f[0]===F)[1];
 const ol=document.getElementById('items');ol.innerHTML='';(F==='top'?tops:pts).filter(vis).forEach(h=>{const li=document.createElement('li');
  li.textContent=(h.top?'⭐ ':'')+(h.names[L]||h.names.en)+(inEp(h)?' 🎧':'');li.onclick=()=>{show(h);window.scrollTo({top:0,behavior:'smooth'})};ol.appendChild(li)})}
function fit(){const v=pts.filter(h=>h._el.style.display!=='none');if(!v.length)return;const bb=new maplibregl.LngLatBounds();
 v.forEach(h=>bb.extend([h.lon,h.lat]));map.fitBounds(bb,{padding:50,maxZoom:16,duration:500})}
sel.onchange=()=>{L=sel.value;render();document.getElementById('card').classList.remove('open')};render();
</script>
