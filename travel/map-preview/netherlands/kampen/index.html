const D={"city": "Kampen", "city_id": 1528270646, "highlights": [{"id": "station-kampen", "category": "station", "in_episode": true, "names": {"en": "Kampen station", "de": "Bahnhof Kampen", "nl": "Station Kampen", "fr": "Gare de Kampen", "es": "Estación de Kampen", "it": "Stazione di Kampen"}, "texts": {"en": "Kampen's main station stands on the IJsselmuiden bank, across the IJssel from the old town. The present building dates from 1912. It is the end of the single-track Kamperlijntje from Zwolle; Hanzelijn trains stop at Kampen Zuid, south of the centre, instead. Walk over the Stadsbrug into town.", "de": "Der Hauptbahnhof von Kampen liegt am Ufer von IJsselmuiden, gegenüber der Altstadt auf der anderen Seite der IJssel. Das heutige Gebäude stammt von 1912. Hier endet das eingleisige Kamperlijntje aus Zwolle; die Züge der Hanzelijn halten dagegen in Kampen Zuid, südlich des Zentrums. Über die Stadsbrug geht es zu Fuß in die Stadt.", "nl": "Het hoofdstation van Kampen ligt aan de IJsselmuidense oever, tegenover de oude stad aan de overkant van de IJssel. Het huidige gebouw dateert uit 1912. Hier eindigt het enkelsporige Kamperlijntje uit Zwolle; treinen over de Hanzelijn stoppen juist in Kampen Zuid, ten zuiden van het centrum. Via de Stadsbrug loop je de stad in.", "fr": "La gare principale de Kampen est sur la rive d'IJsselmuiden, face à la vieille ville. Le bâtiment actuel date de 1912. C'est le terminus du Kamperlijntje, ligne à voie unique venant de Zwolle ; les trains de la Hanzelijn s'arrêtent, eux, à Kampen Zuid, au sud du centre. On entre en ville à pied par le Stadsbrug.", "es": "La estación principal de Kampen está en la orilla de IJsselmuiden, frente al casco antiguo. El edificio actual data de 1912. Es el final del Kamperlijntje, una línea de vía única desde Zwolle; los trenes de la Hanzelijn paran en cambio en Kampen Zuid, al sur del centro. Se entra a pie en la ciudad por el Stadsbrug.", "it": "La stazione principale di Kampen si trova sulla riva di IJsselmuiden, di fronte al centro storico, dall'altra parte dell'IJssel. L'edificio attuale risale al 1912. Qui termina il Kamperlijntje, linea a binario unico da Zwolle; i treni della Hanzelijn fermano invece a Kampen Zuid, a sud del centro. In città si arriva a piedi attraverso lo Stadsbrug."}, "status": null, "lat": 52.559722, "lon": 5.921111, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Kampen_railway_station", "de": "https://de.wikipedia.org/wiki/Bahnhof_Kampen", "nl": "https://nl.wikipedia.org/wiki/Station_Kampen"}, "image": {"file": "Station Kampen, IJsselzijde.jpg", "local": "/travel/map-assets/1528270646/station-kampen.jpg", "author": "Apdency", "license": "CC0", "license_url": "http://creativecommons.org/publicdomain/zero/1.0/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Station_Kampen,_IJsselzijde.jpg"}, "mini": null, "mini_source": null}, {"id": "ijsselkade", "category": "viewpoint", "in_episode": true, "names": {"en": "IJsselkade (river quay)", "de": "IJsselkade (Flusskai)", "nl": "IJsselkade", "fr": "IJsselkade (quai de l'IJssel)", "es": "IJsselkade (muelle del IJssel)", "it": "IJsselkade (banchina sull'IJssel)"}, "texts": {"en": "This quay runs for about 1.1 km along the IJssel, Kampen's old waterfront. The traditional sailing ships of the Brown Fleet moor here between the Stadsbrug and the Van Heutszplein. Walking along it you pass the Koornmarktspoort and the former synagogue of 1847, with the towers of the old town rising behind.", "de": "Dieser Kai verläuft rund 1,1 km entlang der IJssel, an Kampens alter Wasserfront. Zwischen der Stadsbrug und dem Van Heutszplein liegen hier die traditionellen Segelschiffe der Braunen Flotte. Auf dem Weg kommt man an der Koornmarktspoort und der ehemaligen Synagoge von 1847 vorbei, dahinter ragen die Türme der Altstadt auf.", "nl": "Deze kade loopt ongeveer 1,1 km langs de IJssel, het oude waterfront van Kampen. Tussen de Stadsbrug en het Van Heutszplein liggen hier de traditionele zeilschepen van de Bruine Vloot. Onderweg passeer je de Koornmarktspoort en de voormalige synagoge uit 1847, met daarachter de torens van de oude stad.", "fr": "Ce quai longe l'IJssel sur environ 1,1 km, sur l'ancien front d'eau de Kampen. Les voiliers traditionnels de la Flotte brune y sont amarrés entre le Stadsbrug et le Van Heutszplein. En chemin, on passe devant la Koornmarktspoort et l'ancienne synagogue de 1847, avec les tours de la vieille ville en arrière-plan.", "es": "Este muelle recorre unos 1,1 km a lo largo del IJssel, el antiguo frente fluvial de Kampen. Entre el Stadsbrug y el Van Heutszplein amarran aquí los veleros tradicionales de la Flota Marrón. Por el camino se pasa junto a la Koornmarktspoort y la antigua sinagoga de 1847, con las torres del casco antiguo detrás.", "it": "Questa banchina corre per circa 1,1 km lungo l'IJssel, l'antico fronte d'acqua di Kampen. Tra lo Stadsbrug e il Van Heutszplein vi ormeggiano i velieri tradizionali della Flotta bruna. Camminando si passa davanti alla Koornmarktspoort e all'ex sinagoga del 1847, con le torri del centro storico sullo sfondo."}, "status": null, "lat": 52.55786, "lon": 5.919, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/IJsselkade_%28Kampen%29"}, "image": {"file": "IJsselkade Kampen Nederland-01.JPG", "local": "/travel/map-assets/1528270646/ijsselkade.jpg", "author": "Antoine", "license": "CC BY-SA 3.0", "license_url": "https://creativecommons.org/licenses/by-sa/3.0", "source": "https://commons.wikimedia.org/wiki/File:IJsselkade_Kampen_Nederland-01.JPG"}, "mini": null, "mini_source": null}, {"id": "koornmarktspoort", "category": "landmark", "in_episode": true, "names": {"en": "Koornmarktspoort (Corn Market Gate)", "de": "Koornmarktspoort (Kornmarkttor)", "nl": "Koornmarktspoort", "fr": "Koornmarktspoort (porte du marché aux grains)", "es": "Koornmarktspoort (puerta del mercado del grano)", "it": "Koornmarktspoort (porta del mercato del grano)"}, "texts": {"en": "Kampen's oldest surviving city gate, probably built in the 14th century, stands on the IJssel at the end of the Koornmarkt. It began as a Gothic gatehouse; in the 15th century two squat towers with spires were added on the river side. Of the town's roughly 20 gates, only three survive.", "de": "Das älteste erhaltene Stadttor Kampens, vermutlich im 14. Jahrhundert erbaut, steht an der IJssel am Ende des Koornmarkt. Es begann als gotisches Torhaus; im 15. Jahrhundert kamen auf der Flussseite zwei gedrungene Türme mit Spitzhelmen hinzu. Von den rund 20 Toren der Stadt sind nur drei erhalten.", "nl": "De oudste nog bestaande stadspoort van Kampen, waarschijnlijk uit de 14e eeuw, staat aan de IJssel aan het eind van de Koornmarkt. Het begon als gotisch poortgebouw; in de 15e eeuw kwamen er aan de rivierzijde twee gedrongen torens met spitsen bij. Van de ongeveer 20 poorten van de stad zijn er nog maar drie over.", "fr": "La plus ancienne porte de ville conservée de Kampen, sans doute du XIVe siècle, se dresse au bord de l'IJssel, au bout du Koornmarkt. D'abord simple porte gothique, elle a reçu au XVe siècle, côté rivière, deux tours trapues coiffées de flèches. Des quelque 20 portes de la ville, trois seulement subsistent.", "es": "La puerta de la ciudad más antigua que se conserva en Kampen, probablemente del siglo XIV, se alza junto al IJssel, al final del Koornmarkt. Empezó como una portada gótica; en el siglo XV se le añadieron, del lado del río, dos torres achaparradas con chapiteles. De las unas 20 puertas de la ciudad solo quedan tres.", "it": "La più antica porta cittadina conservata di Kampen, probabilmente del XIV secolo, si trova sull'IJssel, in fondo al Koornmarkt. Nata come porta gotica, nel XV secolo ricevette sul lato del fiume due torri tozze con guglie. Delle circa 20 porte della città ne restano soltanto tre."}, "status": null, "lat": 52.55528, "lon": 5.92139, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Koornmarktspoort", "nl": "https://nl.wikipedia.org/wiki/Koornmarktspoort"}, "image": {"file": "Kampenkmpoortklein.jpg", "local": "/travel/map-assets/1528270646/koornmarktspoort.jpg", "author": "Evanherk at Dutch Wikipedia", "license": "Public domain", "license_url": "", "source": "https://commons.wikimedia.org/wiki/File:Kampenkmpoortklein.jpg"}, "mini": null, "mini_source": null}, {"id": "broederpoort", "category": "landmark", "in_episode": true, "names": {"en": "Broederpoort (Brothers' Gate)", "de": "Broederpoort (Brüdertor)", "nl": "Broederpoort", "fr": "Broederpoort (porte des Frères)", "es": "Broederpoort (puerta de los Hermanos)", "it": "Broederpoort (porta dei Frati)"}, "texts": {"en": "Built in 1465, this city gate was remodelled in 1615 by Thomas Berendsz in an ornate Renaissance style. Four slender corner towers with spires frame its tall roof, and a scrolled gable crowns the town side. It stands at the end of the Broederweg on the edge of the Stadspark and is used as a wedding venue.", "de": "Dieses 1465 erbaute Stadttor wurde 1615 von Thomas Berendsz im verzierten Renaissancestil umgestaltet. Vier schlanke Ecktürme mit Spitzhelmen rahmen das hohe Dach, auf der Stadtseite krönt es ein Giebel mit Rollwerk. Es steht am Ende des Broederweg am Rand des Stadsparks und dient als Trauort.", "nl": "Deze stadspoort werd in 1465 gebouwd en in 1615 door Thomas Berendsz in sierlijke renaissancevormen verbouwd. Vier slanke hoektorens met spitsen omlijsten het hoge dak, en aan de stadszijde staat een topgevel met rolwerk. De poort staat aan het eind van de Broederweg aan de rand van het Stadspark en is een trouwlocatie.", "fr": "Construite en 1465, cette porte de ville a été remaniée en 1615 par Thomas Berendsz dans un style Renaissance richement orné. Quatre fines tourelles d'angle à flèche encadrent son haut toit, et un pignon à volutes la couronne côté ville. Elle se trouve au bout de la Broederweg, en bordure du Stadspark, et sert de lieu de mariage.", "es": "Construida en 1465, esta puerta de la ciudad fue remodelada en 1615 por Thomas Berendsz en un recargado estilo renacentista. Cuatro esbeltas torres de esquina con chapitel enmarcan su alto tejado, y un hastial con volutas la remata del lado de la ciudad. Está al final de la Broederweg, junto al Stadspark, y se usa para bodas.", "it": "Costruita nel 1465, questa porta cittadina fu rimaneggiata nel 1615 da Thomas Berendsz in un ricco stile rinascimentale. Quattro snelle torrette angolari con guglia incorniciano l'alto tetto, e un frontone a volute la corona sul lato della città. Si trova in fondo alla Broederweg, ai margini dello Stadspark, ed è usata per i matrimoni."}, "status": null, "lat": 52.55722, "lon": 5.91167, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Broederpoort"}, "image": {"file": "Broederpoort Kampen.jpg", "local": "/travel/map-assets/1528270646/broederpoort.jpg", "author": "Flowerflower", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Broederpoort_Kampen.jpg"}, "mini": null, "mini_source": null}, {"id": "cellebroederspoort", "category": "landmark", "in_episode": true, "names": {"en": "Cellebroederspoort (Cellite Brothers' Gate)", "de": "Cellebroederspoort (Cellitentor)", "nl": "Cellebroederspoort", "fr": "Cellebroederspoort (porte des Cellites)", "es": "Cellebroederspoort (puerta de los Celitas)", "it": "Cellebroederspoort (porta dei Celliti)"}, "texts": {"en": "This city gate dates from the 15th century and was given its present Renaissance form in 1617 by Thomas Berendsz. Two round towers with tall spires flank the passage, and two carved lions holding shields sit on the town side. It is named after the Cellebroeders (Alexian brothers), whose monastery stood nearby.", "de": "Dieses Stadttor stammt aus dem 15. Jahrhundert und erhielt 1617 durch Thomas Berendsz seine heutige Renaissanceform. Zwei runde Türme mit hohen Spitzhelmen flankieren die Durchfahrt, auf der Stadtseite halten zwei steinerne Löwen Wappenschilde. Benannt ist es nach den Cellebroeders (Alexianer), deren Kloster in der Nähe stand.", "nl": "Deze stadspoort dateert uit de 15e eeuw en kreeg in 1617 door Thomas Berendsz haar huidige renaissancevorm. Twee ronde torens met hoge spitsen flankeren de doorgang, en aan de stadszijde houden twee gebeeldhouwde leeuwen een schild vast. De poort is genoemd naar de Cellebroeders (Alexianen), wier klooster vlakbij stond.", "fr": "Cette porte de ville date du XVe siècle et doit sa forme Renaissance actuelle à Thomas Berendsz, en 1617. Deux tours rondes à hautes flèches encadrent le passage, et côté ville deux lions sculptés tiennent des écus. Elle porte le nom des Cellebroeders (frères alexiens), dont le couvent se trouvait tout près.", "es": "Esta puerta de la ciudad data del siglo XV y recibió su forma renacentista actual en 1617, obra de Thomas Berendsz. Dos torres redondas con altos chapiteles flanquean el paso, y del lado de la ciudad dos leones esculpidos sostienen escudos. Debe su nombre a los Cellebroeders (hermanos alexianos), cuyo convento estaba cerca.", "it": "Questa porta cittadina risale al XV secolo e ricevette la sua attuale forma rinascimentale nel 1617 da Thomas Berendsz. Due torri rotonde con alte guglie fiancheggiano il passaggio, e sul lato della città due leoni scolpiti reggono degli scudi. Prende il nome dai Cellebroeders (frati alessiani), il cui convento sorgeva vicino."}, "status": null, "lat": 52.554167, "lon": 5.915278, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Cellebroederspoort"}, "image": {"file": "Cellesbroederpoort Kampen.jpg", "local": "/travel/map-assets/1528270646/cellebroederspoort.jpg", "author": "Flowerflower", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Cellesbroederpoort_Kampen.jpg"}, "mini": null, "mini_source": null}, {"id": "bovenkerk", "category": "landmark", "in_episode": true, "names": {"en": "Bovenkerk (St Nicholas' Church)", "de": "Bovenkerk (St.-Nikolaus-Kirche)", "nl": "Bovenkerk (Sint-Nicolaaskerk)", "fr": "Bovenkerk (église Saint-Nicolas)", "es": "Bovenkerk (iglesia de San Nicolás)", "it": "Bovenkerk (chiesa di San Nicola)"}, "texts": {"en": "The Bovenkerk, or St Nicholas' Church, is a Gothic cross basilica built mainly in the 14th and 15th centuries, and the most prominent building in Kampen's skyline. Inside are an early-Renaissance choir screen of 1552 and the Hinsz organ of 1742 in a case from 1670–1676. The painter Hendrick Avercamp is buried here.", "de": "Die Bovenkerk oder St.-Nikolaus-Kirche ist eine gotische Kreuzbasilika, überwiegend im 14. und 15. Jahrhundert erbaut, und das auffälligste Gebäude in Kampens Stadtbild. Innen stehen ein frühes Renaissance-Chorgitter von 1552 und die Hinsz-Orgel von 1742 in einem Gehäuse von 1670–1676. Der Maler Hendrick Avercamp ist hier begraben.", "nl": "De Bovenkerk of Sint-Nicolaaskerk is een gotische kruisbasiliek, grotendeels gebouwd in de 14e en 15e eeuw, en het opvallendste gebouw in het stadsgezicht van Kampen. Binnen staan een vroegrenaissance koorhek uit 1552 en het Hinsz-orgel uit 1742 in een kast uit 1670–1676. De schilder Hendrick Avercamp ligt hier begraven.", "fr": "La Bovenkerk, ou église Saint-Nicolas, est une basilique gothique en croix latine, bâtie surtout aux XIVe et XVe siècles, et l'édifice le plus visible de la silhouette de Kampen. À l'intérieur se trouvent une clôture de chœur du début de la Renaissance (1552) et l'orgue Hinsz de 1742, dans un buffet de 1670–1676. Le peintre Hendrick Avercamp y est inhumé.", "es": "La Bovenkerk, o iglesia de San Nicolás, es una basílica gótica en cruz, construida sobre todo en los siglos XIV y XV, y el edificio más destacado del perfil de Kampen. Dentro hay una reja de coro renacentista de 1552 y el órgano Hinsz de 1742, en una caja de 1670–1676. Aquí yace el pintor Hendrick Avercamp.", "it": "La Bovenkerk, o chiesa di San Nicola, è una basilica gotica a croce, costruita soprattutto nel XIV e XV secolo, ed è l'edificio più evidente nel profilo di Kampen. All'interno si trovano una recinzione del coro del primo Rinascimento (1552) e l'organo Hinsz del 1742, in una cassa del 1670–1676. Qui è sepolto il pittore Hendrick Avercamp."}, "status": null, "lat": 52.555, "lon": 5.920278, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Bovenkerk%2C_Kampen", "de": "https://de.wikipedia.org/wiki/Bovenkerk_%28Kampen%29", "nl": "https://nl.wikipedia.org/wiki/Bovenkerk_%28Kampen%29", "fr": "https://fr.wikipedia.org/wiki/Bovenkerk_%28%C3%A9glise%29", "it": "https://it.wikipedia.org/wiki/Chiesa_Superiore_%28Kampen%29"}, "image": {"file": "Kerk Kampen.jpg", "local": "/travel/map-assets/1528270646/bovenkerk.jpg", "author": "Hsf-toshiba at Dutch Wikipedia", "license": "Public domain", "license_url": "", "source": "https://commons.wikimedia.org/wiki/File:Kerk_Kampen.jpg"}, "mini": null, "mini_source": null}, {"id": "nieuwe-toren", "category": "landmark", "in_episode": true, "names": {"en": "Nieuwe Toren (New Tower)", "de": "Nieuwe Toren (Neuer Turm)", "nl": "Nieuwe Toren", "fr": "Nieuwe Toren (Tour Neuve)", "es": "Nieuwe Toren (Torre Nueva)", "it": "Nieuwe Toren (Torre Nuova)"}, "texts": {"en": "This free-standing city tower was built between 1649 and 1663 on the site of a chapel that burned down in 1646. Its carillon has 48 bells, 29 of them cast by François Hemony around 1660. In summer a model cow hangs from the tower, recalling the Kamper ui tale of hoisting a cow up to graze.", "de": "Dieser freistehende Stadtturm wurde zwischen 1649 und 1663 an der Stelle einer 1646 abgebrannten Kapelle errichtet. Sein Glockenspiel hat 48 Glocken, 29 davon goss François Hemony um 1660. Im Sommer hängt eine Kuhfigur am Turm – eine Anspielung auf den Kamper ui, den Schwank von der Kuh, die zum Grasen hochgezogen wurde.", "nl": "Deze vrijstaande stadstoren werd tussen 1649 en 1663 gebouwd op de plek van een kapel die in 1646 afbrandde. Het carillon telt 48 klokken, waarvan er 29 rond 1660 door François Hemony zijn gegoten. 's Zomers hangt er een nepkoe aan de toren, naar de Kamper ui over de koe die werd opgehesen om te grazen.", "fr": "Cette tour civique isolée a été construite entre 1649 et 1663 à l'emplacement d'une chapelle incendiée en 1646. Son carillon compte 48 cloches, dont 29 fondues par François Hemony vers 1660. En été, une fausse vache pend à la tour, en souvenir du Kamper ui, l'histoire de la vache hissée pour brouter l'herbe.", "es": "Esta torre municipal exenta se construyó entre 1649 y 1663 en el lugar de una capilla que ardió en 1646. Su carillón tiene 48 campanas, 29 de ellas fundidas por François Hemony hacia 1660. En verano cuelga de la torre una vaca falsa, en recuerdo del Kamper ui, la historia de la vaca izada para pastar.", "it": "Questa torre civica isolata fu costruita tra il 1649 e il 1663 sul luogo di una cappella bruciata nel 1646. Il suo carillon ha 48 campane, 29 delle quali fuse da François Hemony intorno al 1660. D'estate dalla torre pende una finta mucca, in ricordo del Kamper ui, la storiella della mucca issata per brucare."}, "status": {"en": "Climbing the tower only by appointment (guided visit).", "de": "Turmbesteigung nur nach Vereinbarung (mit Begleitung).", "nl": "De toren beklimmen kan alleen op afspraak (onder begeleiding).", "fr": "Montée dans la tour uniquement sur rendez-vous (visite accompagnée).", "es": "Subida a la torre solo con cita previa (visita guiada).", "it": "Salita sulla torre solo su appuntamento (visita accompagnata)."}, "lat": 52.559167, "lon": 5.916389, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Nieuwe_Toren%2C_Kampen", "nl": "https://nl.wikipedia.org/wiki/Nieuwe_Toren_%28Kampen%29", "es": "https://es.wikipedia.org/wiki/Nieuwe_Toren_%28Kampen%29"}, "image": {"file": "Nieuwe toren in Kampen.jpg", "local": "/travel/map-assets/1528270646/nieuwe-toren.jpg", "author": "Gouwenaar", "license": "CC0", "license_url": "http://creativecommons.org/publicdomain/zero/1.0/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Nieuwe_toren_in_Kampen.jpg"}, "mini": null, "mini_source": null}, {"id": "stedelijk-museum", "category": "museum", "in_episode": true, "names": {"en": "Stedelijk Museum Kampen (Old Town Hall)", "de": "Stedelijk Museum Kampen (Altes Rathaus)", "nl": "Stedelijk Museum Kampen (Oude Raadhuis)", "fr": "Stedelijk Museum Kampen (ancien hôtel de ville)", "es": "Stedelijk Museum Kampen (antiguo ayuntamiento)", "it": "Stedelijk Museum Kampen (antico municipio)"}, "texts": {"en": "Kampen's city museum occupies the Oude Raadhuis, the old town hall from about 1350, rebuilt after a fire in 1543. Its centrepiece is the Schepenzaal, the aldermen's hall completed in 1545, which served as council chamber and court until 1795. The museum reopened in October 2026 after a renovation; its collection includes works by Hendrick Avercamp.", "de": "Das Stadtmuseum von Kampen befindet sich im Oude Raadhuis, dem alten Rathaus von etwa 1350, das nach einem Brand 1543 wiederaufgebaut wurde. Herzstück ist die 1545 vollendete Schepenzaal, der Schöffensaal, bis 1795 Ratssaal und Gericht. Das Museum wurde im Oktober 2026 nach einer Renovierung wiedereröffnet; zur Sammlung gehören Werke von Hendrick Avercamp.", "nl": "Het stadsmuseum van Kampen zit in het Oude Raadhuis, het oude stadhuis van rond 1350, herbouwd na een brand in 1543. Pronkstuk is de Schepenzaal, voltooid in 1545, die tot 1795 bestuurscentrum en rechtbank was. Het museum ging in oktober 2026 na een verbouwing weer open; tot de collectie behoren werken van Hendrick Avercamp.", "fr": "Le musée municipal de Kampen occupe l'Oude Raadhuis, ancien hôtel de ville d'environ 1350, reconstruit après un incendie en 1543. Sa pièce maîtresse est la Schepenzaal, salle des échevins achevée en 1545, siège du conseil et du tribunal jusqu'en 1795. Rouvert en octobre 2026 après rénovation, le musée possède des œuvres de Hendrick Avercamp.", "es": "El museo municipal de Kampen ocupa el Oude Raadhuis, antiguo ayuntamiento de hacia 1350, reconstruido tras un incendio en 1543. Su joya es la Schepenzaal, sala de los regidores terminada en 1545, sede del consejo y del tribunal hasta 1795. Reabierto en octubre de 2026 tras una reforma, el museo tiene obras de Hendrick Avercamp.", "it": "Il museo civico di Kampen ha sede nell'Oude Raadhuis, l'antico municipio del 1350 circa, ricostruito dopo un incendio nel 1543. Il suo pezzo forte è la Schepenzaal, la sala degli scabini completata nel 1545, che fu sala del consiglio e tribunale fino al 1795. Il museo ha riaperto nell'ottobre 2026 dopo un restauro; la collezione comprende opere di Hendrick Avercamp."}, "status": null, "lat": 52.5588, "lon": 5.9167, "wikipedia": {"en": "https://en.wikipedia.org/wiki/Stedelijk_Museum_Kampen", "nl": "https://nl.wikipedia.org/wiki/Stedelijk_Museum_Kampen"}, "image": null, "mini": null, "mini_source": null}, {"id": "de-olifant", "category": "landmark", "in_episode": true, "names": {"en": "De Olifant cigar factory", "de": "Zigarrenfabrik De Olifant", "nl": "Sigarenfabriek De Olifant", "fr": "Manufacture de cigares De Olifant", "es": "Fábrica de puros De Olifant", "it": "Fabbrica di sigari De Olifant"}, "texts": {"en": "De Olifant is the last of Kampen's cigar factories, housed in two tall warehouses on the Voorstraat. When it was listed as a national monument in 1998, it was the only tobacco factory in Kampen still in operation. Inside, the workrooms keep their beamed ceilings and pre-war cigar-making machines.", "de": "De Olifant ist die letzte der Zigarrenfabriken Kampens, untergebracht in zwei hohen Speicherhäusern an der Voorstraat. Als sie 1998 unter Denkmalschutz gestellt wurde, war sie die einzige noch arbeitende Tabakfabrik in Kampen. Innen haben die Werkräume ihre Balkendecken und Zigarrenmaschinen aus der Vorkriegszeit bewahrt.", "nl": "De Olifant is de laatste van de Kamper sigarenfabrieken, gevestigd in twee hoge pakhuizen aan de Voorstraat. Toen de fabriek in 1998 rijksmonument werd, was het de enige tabaksfabriek in Kampen die nog in bedrijf was. Binnen hebben de werkruimtes hun balkenplafonds en vooroorlogse sigarenmachines behouden.", "fr": "De Olifant est la dernière des manufactures de cigares de Kampen, installée dans deux hauts entrepôts de la Voorstraat. Lors de son classement monument national en 1998, c'était la seule fabrique de tabac encore en activité à Kampen. À l'intérieur, les ateliers ont gardé leurs plafonds à poutres et leurs machines à cigares d'avant-guerre.", "es": "De Olifant es la última de las fábricas de puros de Kampen, instalada en dos altos almacenes de la Voorstraat. Cuando fue declarada monumento nacional en 1998, era la única fábrica de tabaco de Kampen todavía en funcionamiento. Dentro, los talleres conservan sus techos de vigas y máquinas de hacer puros de antes de la guerra.", "it": "De Olifant è l'ultima delle fabbriche di sigari di Kampen, ospitata in due alti magazzini sulla Voorstraat. Quando nel 1998 fu dichiarata monumento nazionale, era l'unica fabbrica di tabacco di Kampen ancora in attività. All'interno i laboratori conservano i soffitti a travi e le macchine per sigari d'anteguerra."}, "status": {"en": "Factory interior only on a booked guided tour.", "de": "Fabrik innen nur bei einer gebuchten Führung zu sehen.", "nl": "Fabriek alleen te bezichtigen met een gereserveerde rondleiding.", "fr": "Intérieur de l'usine uniquement lors d'une visite guidée réservée.", "es": "Interior de la fábrica solo con visita guiada reservada.", "it": "Interno della fabbrica visitabile solo con visita guidata prenotata."}, "lat": 52.55799, "lon": 5.91788, "wikipedia": {}, "image": {"file": "Kampen DeOlifant.jpg", "local": "/travel/map-assets/1528270646/de-olifant.jpg", "author": "Ymblanter", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Kampen_DeOlifant.jpg"}, "mini": null, "mini_source": null}, {"id": "buitenkerk", "category": "landmark", "in_episode": false, "names": {"en": "Buitenkerk (Church of Our Lady)", "de": "Buitenkerk (Liebfrauenkirche)", "nl": "Buitenkerk (Onze-Lieve-Vrouwekerk)", "fr": "Buitenkerk (église Notre-Dame)", "es": "Buitenkerk (iglesia de Nuestra Señora)", "it": "Buitenkerk (chiesa di Nostra Signora)"}, "texts": {"en": "Work on this church of Our Lady began in 1369 under master builder Rutger van Ceulen; the tower followed in 1453. It is a hall church with three aisles of equal height, one of the few in the Netherlands. Used as a stable around 1800, it was given to Kampen's Catholics in 1809 and is still their church.", "de": "Der Bau dieser Liebfrauenkirche begann 1369 unter Baumeister Rutger van Ceulen; der Turm folgte 1453. Sie ist eine Hallenkirche mit drei gleich hohen Schiffen, eine der wenigen ihrer Art in den Niederlanden. Um 1800 als Pferdestall genutzt, wurde sie 1809 den Katholiken Kampens übergeben und ist bis heute ihre Kirche.", "nl": "De bouw van deze Mariakerk begon in 1369 onder bouwmeester Rutger van Ceulen; de toren volgde in 1453. Het is een hallenkerk met drie even hoge beuken, een van de weinige in Nederland. Rond 1800 diende ze als paardenstal; in 1809 kregen de Kamper katholieken de kerk, en die is nog steeds van hen.", "fr": "La construction de cette église Notre-Dame a commencé en 1369 sous le maître d'œuvre Rutger van Ceulen ; la tour a suivi en 1453. C'est une église-halle à trois vaisseaux de même hauteur, l'une des rares de ce type aux Pays-Bas. Utilisée comme écurie vers 1800, elle fut confiée aux catholiques de Kampen en 1809 et l'est toujours.", "es": "Las obras de esta iglesia de Nuestra Señora empezaron en 1369 con el maestro Rutger van Ceulen; la torre llegó en 1453. Es una iglesia de salón con tres naves de igual altura, una de las pocas de los Países Bajos. Usada como establo hacia 1800, pasó en 1809 a los católicos de Kampen, que aún la usan.", "it": "I lavori di questa chiesa di Nostra Signora iniziarono nel 1369 con il capomastro Rutger van Ceulen; la torre seguì nel 1453. È una chiesa a sala con tre navate di uguale altezza, una delle poche nei Paesi Bassi. Usata come stalla verso il 1800, nel 1809 passò ai cattolici di Kampen, che la usano ancora."}, "status": {"en": "Interior open to visitors only in summer (June to early September); otherwise during services.", "de": "Innenraum nur im Sommer (Juni bis Anfang September) für Besucher geöffnet, sonst nur zu Gottesdiensten.", "nl": "Interieur alleen in de zomer (juni tot begin september) open voor bezoekers, verder tijdens vieringen.", "fr": "Intérieur ouvert aux visiteurs seulement en été (de juin à début septembre) ; sinon pendant les offices.", "es": "Interior abierto a visitantes solo en verano (de junio a principios de septiembre); el resto del año, durante los oficios.", "it": "Interno aperto ai visitatori solo d'estate (da giugno a inizio settembre); altrimenti durante le funzioni."}, "lat": 52.561667, "lon": 5.9125, "wikipedia": {"de": "https://de.wikipedia.org/wiki/Buitenkerk", "nl": "https://nl.wikipedia.org/wiki/Buitenkerk"}, "image": {"file": "Kampen Onze Lieve Vrouwe Kerk (Buitenkerk).JPG", "local": "/travel/map-assets/1528270646/buitenkerk.jpg", "author": "Parsifal2000", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Kampen_Onze_Lieve_Vrouwe_Kerk_(Buitenkerk).JPG"}, "mini": null, "mini_source": null}, {"id": "voormalige-synagoge", "category": "museum", "in_episode": false, "names": {"en": "Former Synagogue (Voormalige Synagoge)", "de": "Ehemalige Synagoge (Voormalige Synagoge)", "nl": "Voormalige Synagoge", "fr": "Ancienne synagogue (Voormalige Synagoge)", "es": "Antigua sinagoga (Voormalige Synagoge)", "it": "Ex sinagoga (Voormalige Synagoge)"}, "texts": {"en": "The former synagogue on the IJsselkade was built in 1847 to a design by city architect Nicolaas Plomp. During the German occupation almost all of Kampen's Jews were deported to the death camps; a marble plaque from 1984 lists victims' names. It is now the Stedelijk Museum's second location, with exhibitions and a display on local Jewish history.", "de": "Die ehemalige Synagoge an der IJsselkade wurde 1847 nach einem Entwurf von Stadtarchitekt Nicolaas Plomp erbaut. Während der deutschen Besatzung wurden fast alle Juden Kampens in die Vernichtungslager deportiert; eine Marmortafel von 1984 nennt Namen der Opfer. Heute ist sie der zweite Standort des Stedelijk Museum, mit Ausstellungen und einer Präsentation zur jüdischen Geschichte der Stadt.", "nl": "De voormalige synagoge aan de IJsselkade werd in 1847 gebouwd naar ontwerp van stadsarchitect Nicolaas Plomp. In de Duitse bezetting werden bijna alle Kamper Joden naar de vernietigingskampen gevoerd; een marmeren plaquette uit 1984 noemt namen van slachtoffers. Nu is het de tweede locatie van het Stedelijk Museum, met tentoonstellingen en een presentatie over de Joodse geschiedenis van Kampen.", "fr": "L'ancienne synagogue de l'IJsselkade fut construite en 1847 par l'architecte municipal Nicolaas Plomp. Sous l'occupation allemande, presque tous les Juifs de Kampen furent déportés vers les camps d'extermination ; une plaque de marbre de 1984 porte des noms de victimes. C'est aujourd'hui le second site du Stedelijk Museum, avec des expositions et un espace sur l'histoire juive locale.", "es": "La antigua sinagoga del IJsselkade se construyó en 1847 según proyecto del arquitecto municipal Nicolaas Plomp. En la ocupación alemana, casi todos los judíos de Kampen fueron deportados a los campos de exterminio; una placa de mármol de 1984 recoge nombres de víctimas. Hoy es la segunda sede del Stedelijk Museum, con exposiciones y un espacio de historia judía local.", "it": "L'ex sinagoga sull'IJsselkade fu costruita nel 1847 su progetto dell'architetto comunale Nicolaas Plomp. Durante l'occupazione tedesca quasi tutti gli ebrei di Kampen furono deportati nei campi di sterminio; una lapide di marmo del 1984 riporta nomi delle vittime. Oggi è la seconda sede dello Stedelijk Museum, con mostre e un'esposizione sulla storia ebraica locale."}, "status": null, "lat": 52.557722, "lon": 5.919028, "wikipedia": {"de": "https://de.wikipedia.org/wiki/Synagoge_%28Kampen%29", "nl": "https://nl.wikipedia.org/wiki/Synagoge_%28Kampen%29"}, "image": {"file": "Kampen voormalige synagoge.JPG", "local": "/travel/map-assets/1528270646/voormalige-synagoge.jpg", "author": "Parsifal2000", "license": "CC BY-SA 3.0 nl", "license_url": "https://creativecommons.org/licenses/by-sa/3.0/nl/deed.en", "source": "https://commons.wikimedia.org/wiki/File:Kampen_voormalige_synagoge.JPG"}, "mini": null, "mini_source": null}, {"id": "ikonenmuseum", "category": "museum", "in_episode": false, "names": {"en": "Ikonenmuseum (Icon Museum)", "de": "Ikonenmuseum", "nl": "Ikonenmuseum Kampen", "fr": "Ikonenmuseum (musée des Icônes)", "es": "Ikonenmuseum (Museo de Iconos)", "it": "Ikonenmuseum (Museo delle icone)"}, "texts": {"en": "This museum opened in 2005 in the former dormitory of Kampen's Franciscan friary, rebuilt in 1490 after a fire. It draws on the Alexander Stichting collection of more than 4,000 wooden and metal icons, mainly from Russia and other Eastern Orthodox lands, shown in permanent and changing exhibitions.", "de": "Das Museum wurde 2005 im ehemaligen Schlafsaal des Kampener Franziskanerklosters eröffnet, das nach einem Brand 1490 wiederaufgebaut worden war. Es schöpft aus der Sammlung der Alexander Stichting mit über 4.000 Ikonen aus Holz und Metall, vor allem aus Russland und anderen orthodoxen Ländern, gezeigt in Dauer- und Wechselausstellungen.", "nl": "Dit museum opende in 2005 in het voormalige dormitorium van het Kamper minderbroedersklooster, dat in 1490 na een brand was herbouwd. Het put uit de collectie van de Alexander Stichting van ruim 4000 houten en metalen ikonen, vooral uit Rusland en andere oosters-orthodoxe landen, getoond in vaste en wisselende tentoonstellingen.", "fr": "Ce musée a ouvert en 2005 dans l'ancien dortoir du couvent franciscain de Kampen, reconstruit en 1490 après un incendie. Il puise dans la collection de l'Alexander Stichting, plus de 4 000 icônes en bois et en métal, surtout de Russie et d'autres pays orthodoxes, présentées en expositions permanentes et temporaires.", "es": "Este museo abrió en 2005 en el antiguo dormitorio del convento franciscano de Kampen, reconstruido en 1490 tras un incendio. Se nutre de la colección de la Alexander Stichting, con más de 4.000 iconos de madera y metal, sobre todo de Rusia y otros países ortodoxos, expuestos en muestras permanentes y temporales.", "it": "Questo museo è stato aperto nel 2005 nell'antico dormitorio del convento francescano di Kampen, ricostruito nel 1490 dopo un incendio. Attinge alla collezione dell'Alexander Stichting, oltre 4.000 icone in legno e metallo, soprattutto dalla Russia e da altri paesi ortodossi, esposte in mostre permanenti e temporanee."}, "status": null, "lat": 52.558703, "lon": 5.915261, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Ikonenmuseum_Kampen"}, "image": null, "mini": null, "mini_source": null}, {"id": "stadspark", "category": "nature", "in_episode": false, "names": {"en": "Stadspark (City Park)", "de": "Stadspark", "nl": "Stadspark (Kamper plantsoen)", "fr": "Stadspark (parc municipal)", "es": "Stadspark (parque municipal)", "it": "Stadspark (parco cittadino)"}, "texts": {"en": "Kampen's city park lies on the site of the former fortifications, just outside the old town, and the Broederpoort and Cellebroederspoort serve as its gateways. It is laid out in English landscape style along the old moats. In 1863 the landscape architects Jan David and Louis Paul Zocher redesigned it.", "de": "Kampens Stadtpark liegt auf dem Gelände der früheren Befestigungen, direkt vor der Altstadt; Broederpoort und Cellebroederspoort dienen als seine Eingangstore. Er ist im englischen Landschaftsstil entlang der alten Gräben angelegt. 1863 gestalteten ihn die Landschaftsarchitekten Jan David und Louis Paul Zocher neu.", "nl": "Het Kamper stadspark ligt op de plek van de vroegere vestingwerken, net buiten de oude stad, met de Broederpoort en de Cellebroederspoort als toegangspoorten. Het is in Engelse landschapsstijl aangelegd langs de oude singels. In 1863 herontwierpen de tuinarchitecten Jan David en Louis Paul Zocher het park.", "fr": "Le parc municipal de Kampen occupe l'emplacement des anciennes fortifications, juste à l'extérieur de la vieille ville ; la Broederpoort et la Cellebroederspoort lui servent de portes d'entrée. Il est aménagé en style paysager anglais le long des anciens fossés. En 1863, les architectes paysagistes Jan David et Louis Paul Zocher l'ont redessiné.", "es": "El parque municipal de Kampen ocupa el lugar de las antiguas fortificaciones, justo fuera del casco antiguo, y la Broederpoort y la Cellebroederspoort le sirven de entradas. Está trazado al estilo paisajista inglés a lo largo de los antiguos fosos. En 1863 lo rediseñaron los paisajistas Jan David y Louis Paul Zocher.", "it": "Il parco cittadino di Kampen sorge sull'area delle antiche fortificazioni, appena fuori dal centro storico, e la Broederpoort e la Cellebroederspoort ne sono le porte d'ingresso. È disegnato in stile paesaggistico inglese lungo gli antichi fossati. Nel 1863 i paesaggisti Jan David e Louis Paul Zocher lo ridisegnarono."}, "status": null, "lat": 52.55623, "lon": 5.91261, "wikipedia": {"nl": "https://nl.wikipedia.org/wiki/Stadspark_%28Kampen%29"}, "image": {"file": "Broederpoort Kampen.jpg", "local": "/travel/map-assets/1528270646/stadspark.jpg", "author": "Flowerflower", "license": "CC BY 3.0", "license_url": "https://creativecommons.org/licenses/by/3.0", "source": "https://commons.wikimedia.org/wiki/File:Broederpoort_Kampen.jpg"}, "mini": null, "mini_source": null}]}, UI={"en": {"drawing": "Map icon drawn after", "read": "Read aloud", "stop": "Stop", "ep": "In the episode", "also": "Also worth seeing", "wiki": "Wikipedia", "photo": "Photo", "close": "Close", "listen": "Listen to the episode", "list": "All highlights", "title": "{city} map: highlights", "noaudio": "Read aloud is not supported on this device."}, "de": {"drawing": "Kartensymbol gezeichnet nach", "read": "Vorlesen", "stop": "Stopp", "ep": "In der Folge", "also": "Auch sehenswert", "wiki": "Wikipedia", "photo": "Foto", "close": "Schließen", "listen": "Folge anhören", "list": "Alle Highlights", "title": "{city} Karte: Sehenswürdigkeiten", "noaudio": "Vorlesen wird auf diesem Gerät nicht unterstützt."}, "nl": {"drawing": "Kaarticoon getekend naar", "read": "Voorlezen", "stop": "Stop", "ep": "In de aflevering", "also": "Ook de moeite waard", "wiki": "Wikipedia", "photo": "Foto", "close": "Sluiten", "listen": "Luister de aflevering", "list": "Alle hoogtepunten", "title": "{city} kaart: hoogtepunten", "noaudio": "Voorlezen wordt op dit apparaat niet ondersteund."}, "fr": {"drawing": "Icône dessinée d'après", "read": "Lire à voix haute", "stop": "Arrêter", "ep": "Dans l'épisode", "also": "À voir aussi", "wiki": "Wikipédia", "photo": "Photo", "close": "Fermer", "listen": "Écouter l'épisode", "list": "Tous les lieux", "title": "{city} carte : lieux à voir", "noaudio": "La lecture à voix haute n'est pas disponible sur cet appareil."}, "es": {"drawing": "Icono dibujado a partir de", "read": "Leer en voz alta", "stop": "Parar", "ep": "En el episodio", "also": "También merece la pena", "wiki": "Wikipedia", "photo": "Foto", "close": "Cerrar", "listen": "Escuchar el episodio", "list": "Todos los lugares", "title": "{city} mapa: lugares destacados", "noaudio": "La lectura en voz alta no está disponible en este dispositivo."}, "it": {"drawing": "Icona disegnata da", "read": "Leggi ad alta voce", "stop": "Stop", "ep": "Nell'episodio", "also": "Da vedere anche", "wiki": "Wikipedia", "photo": "Foto", "close": "Chiudi", "listen": "Ascolta l'episodio", "list": "Tutti i luoghi", "title": "{city} mappa: luoghi da vedere", "noaudio": "La lettura ad alta voce non è disponibile su questo dispositivo."}}, CATS={"landmark": ["#0f6e6e", "★", {"en": "Landmark", "de": "Bauwerk", "nl": "Bezienswaardigheid", "fr": "Monument", "es": "Monumento", "it": "Monumento"}], "museum": ["#8a3fb0", "M", {"en": "Museum", "de": "Museum", "nl": "Museum", "fr": "Musée", "es": "Museo", "it": "Museo"}], "history": ["#b5542a", "H", {"en": "History", "de": "Geschichte", "nl": "Geschiedenis", "fr": "Histoire", "es": "Historia", "it": "Storia"}], "viewpoint": ["#2f6db5", "V", {"en": "Viewpoint", "de": "Aussicht", "nl": "Uitzicht", "fr": "Point de vue", "es": "Mirador", "it": "Panorama"}], "market": ["#c08a00", "€", {"en": "Market", "de": "Markt", "nl": "Markt", "fr": "Marché", "es": "Mercado", "it": "Mercato"}], "nature": ["#3f8a3f", "♣", {"en": "Nature", "de": "Natur", "nl": "Natuur", "fr": "Nature", "es": "Naturaleza", "it": "Natura"}], "station": ["#444444", "🚆", {"en": "Station", "de": "Bahnhof", "nl": "Station", "fr": "Gare", "es": "Estación", "it": "Stazione"}]}, SPEECH={"en": "en-GB", "de": "de-DE", "nl": "nl-NL", "fr": "fr-FR", "es": "es-ES", "it": "it-IT"}, LANGS={"en": "English", "de": "Deutsch", "nl": "Nederlands", "fr": "Français", "es": "Español", "it": "Italiano"};
const sel=document.getElementById('lang');
for(const[k,v]of Object.entries(LANGS)){const o=document.createElement('option');o.value=k;o.textContent=v;sel.appendChild(o)}
const q=new URLSearchParams(location.search);let L=q.get('lang')||(navigator.language||'en').slice(0,2);if(!LANGS[L])L='en';sel.value=L;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts=D.highlights.filter(h=>h.lat);
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',attributionControl:{compact:true}});
const b=new maplibregl.LngLatBounds();pts.forEach(h=>b.extend([h.lon,h.lat]));map.fitBounds(b,{padding:50,maxZoom:16,duration:0});
map.addControl(new maplibregl.NavigationControl({showCompass:false}));
const mapEl=document.getElementById('map');const zf=()=>mapEl.classList.toggle('far',map.getZoom()<14.3);map.on('zoom',zf);map.on('load',zf);
map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}));
pts.forEach(h=>{const c=CATS[h.category]||CATS.landmark;const el=document.createElement('div');el.className='pin'+(h.in_episode?'':' also');
 if(h.mini){el.classList.add('mini');el.style.setProperty('--c',c[0]);el.style.backgroundImage=`url(${h.mini})`}
 else{el.style.background=c[0];el.textContent=c[1]}el.title=h.names[L]||h.names.en;el.onclick=()=>show(h);
 new maplibregl.Marker({element:el}).setLngLat([h.lon,h.lat]).addTo(map);h._el=el});
function speak(text,btn){if(!('speechSynthesis'in window)){alert(UI[L].noaudio);return}
 if(speechSynthesis.speaking){speechSynthesis.cancel();btn.textContent='🔊 '+UI[L].read;return}
 const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH[L];const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(L));if(v)u.voice=v;
 u.onend=()=>btn.textContent='🔊 '+UI[L].read;btn.textContent='■ '+UI[L].stop;speechSynthesis.speak(u)}
function show(h){const u=UI[L],c=CATS[h.category]||CATS.landmark,name=h.names[L]||h.names.en,text=h.texts[L]||h.texts.en;
 if('speechSynthesis'in window)speechSynthesis.cancel();
 let s='';if(h.image)s+=`<img src="${h.image.local}" alt="${esc(name)}"><div class="credit">${u.photo}: ${esc(h.image.author)}, <a href="${h.image.license_url||h.image.source}">${esc(h.image.license)}</a>, <a href="${h.image.source}">Wikimedia Commons</a></div>`;
 if(h.mini&&h.mini_source)s+=`<div class="credit">${u.drawing}: ${esc(h.mini_source.author)}, <a href="${h.mini_source.license_url||h.mini_source.source}">${esc(h.mini_source.license)}</a>, <a href="${h.mini_source.source}">Wikimedia Commons</a></div>`;
 s+=`<h2>${esc(name)}</h2><div class="badges"><span class="chip">${esc(c[2][L]||c[2].en)}</span> <span class="chip">${h.in_episode?u.ep:u.also}</span></div>`;
 if(h.status)s+=`<div class="status">${esc(h.status[L]||h.status.en)}</div>`;
 s+=`<p>${esc(text)}</p><div class="row"><button class="btn" id="rd">🔊 ${u.read}</button>`;
 const w=h.wikipedia&&(h.wikipedia[L]||h.wikipedia.en||h.wikipedia.nl);if(w)s+=`<a class="btn" href="${w}" target="_blank" rel="noopener">${u.wiki}</a>`;
 if(h.in_episode)s+=`<a class="btn" href="/travel/netherlands/kampen/#${L}">${u.listen}</a>`;s+='</div>';
 document.getElementById('cc').innerHTML=s;document.getElementById('rd').onclick=e=>speak(name+'. '+text,e.target);
 document.getElementById('card').classList.add('open');map.easeTo({center:[h.lon,h.lat],offset:[0,-120],duration:400})}
document.getElementById('x').onclick=()=>{document.getElementById('card').classList.remove('open');if('speechSynthesis'in window)speechSynthesis.cancel()};
function render(){const u=UI[L];document.documentElement.lang=L;document.getElementById('h1').textContent=u.title.replace('{city}',D.city);
 document.getElementById('ep').textContent='🎧 '+u.listen;document.getElementById('lh').textContent=u.list;
 document.getElementById('legend').innerHTML=Object.values(CATS).filter(c=>pts.some(h=>CATS[h.category]===c)).map(c=>`<span style="background:${c[0]}"></span>${esc(c[2][L])}`).join('');
 const ol=document.getElementById('items');ol.innerHTML='';pts.forEach(h=>{const li=document.createElement('li');li.textContent=(h.names[L]||h.names.en)+(h.in_episode?'':' · '+u.also);li.onclick=()=>{show(h);window.scrollTo({top:0,behavior:'smooth'})};ol.appendChild(li);if(h._el)h._el.title=h.names[L]||h.names.en})}
sel.onchange=()=>{L=sel.value;render();document.getElementById('card').classList.remove('open')};render();
</script>
